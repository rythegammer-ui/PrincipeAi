tion might only need a task. But when an answer disappoints, the fix is almost always one of these five.\u003c/p>\n\u003ch3>1. Role\u003c/h3>\n\u003cp>A role sets the expertise, vocabulary and point of view. &quot;Act as an experienced kindergarten teacher&quot; gets you different advice from &quot;act as a pediatric sleep consultant.&quot; Both are useful, for different problems.\u003c/p>\n\u003ch3>2. Context\u003c/h3>\n\u003cp>This is the most important part, and the one most people skip. Remember, your assistant has never met you. Who&#39;s involved? What have you already tried? What constraints matter: budget, time, skill level, tone? Context turns a generic answer into \u003cem>your\u003c/em> answer.\u003c/p>\n\u003ch3>3. Task\u003c/h3>\n\u003cp>Be specific about the action: write, summarize, compare, list, plan, rewrite or explain. &quot;Help me with my resume&quot; is vague. &quot;Rewrite the summary section of my resume to highlight my leadership experience&quot; is a task.\u003c/p>\n\u003ch3>4. Format\u003c/h3>\n\u003cp>Say what shape you want: bullet points, a table, a numbered checklist, a short email, three options, under 150 words. This one part saves more editing time than any other.\u003c/p>\n\u003ch3>5. Examples\u003c/h3>\n\u003cp>If you have an example of what good looks like (a past email you liked, a writing sample, a layout you prefer), include it. Examples communicate style faster than any description.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Before and after\u003c/h2>\n\u003cp>\u003cstrong>Before:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Write a message to my neighbor about their dog barking.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>After:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Act as a tactful communicator who helps neighbors stay on good terms.\n\nContext: My next-door neighbor&#39;s dog barks most weekdays from about 8am\nto noon while they&#39;re at work. I work from home, so it&#39;s hard to take\ncalls. We get along well and I don&#39;t want to sound like I&#39;m complaining.\n\nTask: Write a short, friendly text message that raises the issue and\nsuggests we figure out a solution together.\n\nFormat: Under 80 words. Warm and casual. No passive-aggressive phrasing.\n\nExample of my usual tone: &quot;Hey! Hope your weekend was good. Quick\nquestion for you when you get a sec...&quot;\n\u003c/code>\u003c/pre>\n\u003cp>The first prompt gets a generic, slightly stiff note. The second gets a message you could send as is, in your own voice, that protects the relationship.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Your reusable template\u003c/h2>\n\u003cp>Copy this into your notes app. You&#39;ll use it constantly:\u003c/p>\n\u003cpre>\u003ccode>Act as [ROLE].\n\nContext: [WHO YOU ARE, THE SITUATION, WHAT YOU&#39;VE TRIED, CONSTRAINTS]\n\nTask: [EXACTLY WHAT YOU WANT IT TO DO]\n\nFormat: [LENGTH, STRUCTURE, TONE]\n\nHere&#39;s an example of what I like: [OPTIONAL EXAMPLE]\n\u003c/code>\u003c/pre>\n\u003cp>You don&#39;t need the labels. Writing naturally works just as well, as long as the information is there. The labels simply stop you forgetting a part.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The shortcut when you&#39;re not sure what to include\u003c/h2>\n\u003cp>When you don&#39;t know which context matters, let the AI ask:\u003c/p>\n\u003cpre>\u003ccode>I want help with [GOAL]. Before you answer, ask me up to five questions\nthat would help you give me a much better, more specific answer.\nAsk them all at once.\n\u003c/code>\u003c/pre>\n\u003cp>This is one of the most useful prompts you&#39;ll ever learn. It turns the AI into an interviewer, so you end up with a great prompt without having to plan one.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Think of a real task you need to do this week: a message, a plan or a decision.\u003c/li>\n\u003cli>Write it as a one-line prompt, send it, and save the answer.\u003c/li>\n\u003cli>Rewrite it using all five parts and send it in a \u003cstrong>new chat\u003c/strong>.\u003c/li>\n\u003cli>Compare the two answers side by side. Which part made the biggest difference?\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Skipping context.\u003c/strong> The AI can&#39;t read your mind. Two extra sentences of background usually transform the answer.\u003c/li>\n\u003cli>\u003cstrong>Asking for everything at once.\u003c/strong> &quot;Plan my wedding&quot; is too big. Break large jobs into steps.\u003c/li>\n\u003cli>\u003cstrong>Forgetting the format.\u003c/strong> If you don&#39;t say, you get the AI&#39;s default, which is often longer than you want.\u003c/li>\n\u003cli>\u003cstrong>Being polite at the expense of clear.\u003c/strong> Courtesy is fine, but clarity matters more. Say exactly what you want.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Great prompts combine Role, Context, Task, Format and Examples, whenever the result matters.\u003c/li>\n\u003cli>Context is the most powerful part, and the one most often skipped.\u003c/li>\n\u003cli>Specifying the format saves more editing time than anything else.\u003c/li>\n\u003cli>When you&#39;re unsure what to include, ask the AI to interview you first.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Two people ask the same AI assistant for help with the same problem. One gets a bland, generic answer and decides AI is overhyped. The other gets something so useful they use it almost word for word. The difference isn't luck or a paid plan. It's the prompt. A prompt is simply what you type to the AI. Nearly every great prompt contains some mix of five parts. The five parts Part What it tells the AI Role Who to act as: \"a friendly personal trainer\" Context Your situation: \"I'm 52, haven't exercised in years, and have a bad knee\" Task Exactly what you want: \"Create a 4-week walking plan\" Format What the answer should look like: \"A simple table, one row per week\" Examples What good looks like: \"Here's a plan layout I liked...\" You don't need all five every time. A quick question might only need a task. But when an answer disappoints, the fix is almost always one of these five. 1. Role A role sets the expertise, vocabulary and point of view. \"Act as an experienced kindergarten teacher\" gets you different advice from \"act as a pediatric sleep consultant.\" Both are useful, for different problems. 2. Context This is the most important part, and the one most people skip. Remember, your assistant has never met you. Who's involved? What have you already tried? What constraints matter: budget, time, skill level, tone? Context turns a generic answer into your answer. 3. Task Be specific about the action: write, summarize, compare, list, plan, rewrite or explain. \"Help me with my resume\" is vague. \"Rewrite the summary section of my resume to highlight my leadership experience\" is a task. 4. Format Say what shape you want: bullet points, a table, a numbered checklist, a short email, three options, under 150 words. This one part saves more editing time than any other. 5. Examples If you have an example of what good looks like (a past email you liked, a writing sample, a layout you prefer), include it. Examples communicate style faster than any description. Before and after Before: Write a message to my neighbor about their dog barking. After: Act as a tactful communicator who helps neighbors stay on good terms. Context: My next-door neighbor's dog barks most weekdays from about 8am to noon while they're at work. I work from home, so it's hard to take calls. We get along well and I don't want to sound like I'm complaining. Task: Write a short, friendly text message that raises the issue and suggests we figure out a solution together. Format: Under 80 words. Warm and casual. No passive-aggressive phrasing. Example of my usual tone: \"Hey! Hope your weekend was good. Quick question for you when you get a sec...\" The first prompt gets a generic, slightly stiff note. The second gets a message you could send as is, in your own voice, that protects the relationship. Your reusable template Copy this into your notes app. You'll use it constantly: Act as [ROLE]. Context: [WHO YOU ARE, THE SITUATION, WHAT YOU'VE TRIED, CONSTRAINTS] Task: [EXACTLY WHAT YOU WANT IT TO DO] Format: [LENGTH, STRUCTURE, TONE] Here's an example of what I like: [OPTIONAL EXAMPLE] You don't need the labels. Writing naturally works just as well, as long as the information is there. The labels simply stop you forgetting a part. The shortcut when you're not sure what to include When you don't know which context matters, let the AI ask: I want help with [GOAL]. Before you answer, ask me up to five questions that would help you give me a much better, more specific answer. Ask them all at once. This is one of the most useful prompts you'll ever learn. It turns the AI into an interviewer, so you end up with a great prompt without having to plan one. Try it now Think of a real task you need to do this week: a message, a plan or a decision. Write it as a one-line prompt, send it, and save the answer. Rewrite it using all five parts and send it in a new chat . Compare the two answers side by side. Which part made the biggest difference? Common mistakes Skipping context. The AI can't read your mind. Two extra sentences of background usually transform the answer. Asking for everything at once. \"Plan my wedding\" is too big. Break large jobs into steps. Forgetting the format. If you don't say, you get the AI's default, which is often longer than you want. Being polite at the expense of clear. Courtesy is fine, but clarity matters more. Say exactly what you want. Key takeaways Great prompts combine Role, Context, Task, Format and Examples, whenever the result matters. Context is the most powerful part, and the one most often skipped. Specifying the format saves more editing time than anything else. When you're unsure what to include, ask the AI to interview you first.","blocks":[{"lang":"","text":"Write a message to my neighbor about their dog barking."},{"lang":"","text":"Act as a tactful communicator who helps neighbors stay on good terms.\n\nContext: My next-door neighbor's dog barks most weekdays from about 8am\nto noon while they're at work. I work from home, so it's hard to take\ncalls. We get along well and I don't want to sound like I'm complaining.\n\nTask: Write a short, friendly text message that raises the issue and\nsuggests we figure out a solution together.\n\nFormat: Under 80 words. Warm and casual. No passive-aggressive phrasing.\n\nExample of my usual tone: \"Hey! Hope your weekend was good. Quick\nquestion for you when you get a sec...\""},{"lang":"","text":"Act as [ROLE].\n\nContext: [WHO YOU ARE, THE SITUATION, WHAT YOU'VE TRIED, CONSTRAINTS]\n\nTask: [EXACTLY WHAT YOU WANT IT TO DO]\n\nFormat: [LENGTH, STRUCTURE, TONE]\n\nHere's an example of what I like: [OPTIONAL EXAMPLE]"},{"lang":"","text":"I want help with [GOAL]. Before you answer, ask me up to five questions\nthat would help you give me a much better, more specific answer.\nAsk them all at once."}],"quiz":[{"q":"Which part of a prompt does the lesson call the most important, and the one most people skip?","options":["Context: your situation and constraints","Role: who the AI should act as","Format: the shape of the answer","Examples: what good looks like"],"answer":0,"explain":"Context tells the AI who's involved, what you've tried and which constraints matter. Since the assistant has never met you, it's what turns a generic answer into your answer."},{"q":"Your AI answers keep coming back far longer than you want. Which part should you add to your prompt?","options":["A role, such as \"act as a friendly expert\"","An example of a reply you didn't like","A format, such as \"under 150 words, as bullets\"","A broader task, such as \"help me with this\""],"answer":2,"explain":"Format tells the AI what shape the answer should take. If you don't say, you get the default, which is often longer than you want."},{"q":"You want help with a goal but aren't sure what background the AI needs. What does the lesson suggest?","options":["Send a one-line request and accept whatever comes back","Ask the AI to ask you up to five questions before it answers","Write a long essay that covers every detail of your life","Give it a role and leave out the context entirely"],"answer":1,"explain":"When you're unsure what to include, let the AI interview you with up to five questions first, so you end up with a great prompt without having to plan one."}],"videoUrl":null},{"n":5,"slug":"iterate-and-follow-up","title":"Iterate Like a Pro: Follow-Ups That Fix Any Answer","summary":"Why the first answer is only a draft, and the follow-up phrases that turn a so-so reply into exactly what you need.","durationMin":10,"module":2,"moduleTitle":"Prompting That Works","html":"\u003csection class=\"sec sec-intro\">\u003cp>Here&#39;s something experienced AI users know: they rarely get a perfect answer on the first try either. What they do differently is what happens next. Instead of starting over or giving up, they \u003cstrong>steer\u003c/strong>. A good follow-up takes ten seconds and often does more than a perfect first prompt.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Think conversation, not vending machine\u003c/h2>\n\u003cp>A vending machine gives you one thing per button press. A conversation builds. Your assistant can see everything earlier in the chat, so you never need to repeat yourself. Just react to what you got, the way you&#39;d give feedback to a colleague.\u003c/p>\n\u003cp>The simplest follow-ups are often the most effective:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>&quot;Shorter.&quot;\u003c/strong> or \u003cstrong>&quot;Cut this in half.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;More casual.&quot;\u003c/strong> or \u003cstrong>&quot;More professional.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Give me three different versions.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Keep the first paragraph and rewrite the rest.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Explain that like I&#39;m new to this.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Make it more specific to my situation.&quot;\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Five follow-ups that do the heavy lifting\u003c/h2>\n\u003cp>\u003cstrong>1. Say what&#39;s wrong, and what&#39;s right.\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>This is close. Keep the friendly opening and the bullet list, but the\nending sounds too salesy. Rewrite just the last paragraph so it sounds\nlike a genuine thank-you.\n\u003c/code>\u003c/pre>\n\u003cp>Specific feedback (&quot;the ending sounds salesy&quot;) beats vague feedback (&quot;make it better&quot;).\u003c/p>\n\u003cp>\u003cstrong>2. Ask for options.\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Give me 3 alternative versions: one very short, one warm and personal,\nand one formal. Label each one.\n\u003c/code>\u003c/pre>\n\u003cp>Choosing from options is faster than describing what you want.\u003c/p>\n\u003cp>\u003cstrong>3. Ask it to critique itself.\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Review your last answer the way a tough editor would. What&#39;s weak,\nmissing or unclear? Then write an improved version that fixes those\nproblems.\n\u003c/code>\u003c/pre>\n\u003cp>This works surprisingly well for writing, plans and arguments.\u003c/p>\n\u003cp>\u003cstrong>4. Add the context you forgot.\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>I should have mentioned: this is for my team of 4 volunteers, and none\nof them have used this software before. Please adjust the instructions.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>5. Ask what it needs.\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>What information would help you make this much better? Ask me.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Follow up, edit, or start fresh?\u003c/h2>\n\u003cp>Most assistants give you three ways forward:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Follow up\u003c/strong> (most of the time) when the answer is on the right track and just needs adjusting.\u003c/li>\n\u003cli>\u003cstrong>Edit your original message, or regenerate,\u003c/strong> when the answer went in the wrong direction from the start. Fixing the prompt is cleaner than arguing with a bad answer.\u003c/li>\n\u003cli>\u003cstrong>Start a new chat\u003c/strong> when you&#39;re switching topics, or the conversation has become long and muddled. A fresh chat with a better prompt often beats ten corrections.\u003c/li>\n\u003c/ul>\n\u003cp>A handy trick before you start fresh is to ask the old chat to summarize itself:\u003c/p>\n\u003cpre>\u003ccode>Summarize what we&#39;ve worked out in this conversation, including my\npreferences and the decisions we made, so I can paste it into a new chat.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example: a birthday party plan\u003c/h2>\n\u003cp>\u003cstrong>First prompt:\u003c/strong> &quot;Help me plan my daughter&#39;s 8th birthday party.&quot;\u003c/p>\n\u003cp>The answer is a generic checklist. Here&#39;s how three follow-ups transform it:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>&quot;Budget is about $200, 12 kids, at our house, and she loves science.&quot;\u003c/strong> The plan becomes a science-themed party at home.\u003c/li>\n\u003cli>\u003cstrong>&quot;Turn this into a timeline for a 2-hour party, in 15-minute blocks.&quot;\u003c/strong> Now you have a running order.\u003c/li>\n\u003cli>\u003cstrong>&quot;Give me a shopping list grouped by store section, with rough costs.&quot;\u003c/strong> Now you can actually go shopping.\u003c/li>\n\u003c/ol>\n\u003cp>Three short follow-ups, one genuinely useful plan, and each step built on the last.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Take an answer from an earlier lesson, or ask for something new, like a packing list or this week&#39;s to-do list.\u003c/li>\n\u003cli>Improve it with at least \u003cstrong>three\u003c/strong> follow-ups: one about length or tone, one asking for options, and one asking the AI to critique itself.\u003c/li>\n\u003cli>Notice which follow-up helped most. That one goes in your toolkit.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Starting over every time.\u003c/strong> You throw away all the context you built. Follow up first.\u003c/li>\n\u003cli>\u003cstrong>Vague feedback.\u003c/strong> &quot;That&#39;s not right&quot; gives the AI nothing to work with. Say what&#39;s off and what you want instead.\u003c/li>\n\u003cli>\u003cstrong>Arguing with a broken answer.\u003c/strong> If it&#39;s way off, edit your original prompt or start fresh rather than patching.\u003c/li>\n\u003cli>\u003cstrong>Accepting the first draft.\u003c/strong> Two quick follow-ups usually lift an answer from okay to excellent.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>The first answer is a draft. The real value is in the follow-up.\u003c/li>\n\u003cli>Be specific about what to keep and what to change.\u003c/li>\n\u003cli>Ask for options, ask for a self-critique, and ask what information is missing.\u003c/li>\n\u003cli>Follow up when you&#39;re close; edit your prompt or start fresh when you&#39;re way off.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Here's something experienced AI users know: they rarely get a perfect answer on the first try either. What they do differently is what happens next. Instead of starting over or giving up, they steer . A good follow-up takes ten seconds and often does more than a perfect first prompt. Think conversation, not vending machine A vending machine gives you one thing per button press. A conversation builds. Your assistant can see everything earlier in the chat, so you never need to repeat yourself. Just react to what you got, the way you'd give feedback to a colleague. The simplest follow-ups are often the most effective: \"Shorter.\" or \"Cut this in half.\" \"More casual.\" or \"More professional.\" \"Give me three different versions.\" \"Keep the first paragraph and rewrite the rest.\" \"Explain that like I'm new to this.\" \"Make it more specific to my situation.\" Five follow-ups that do the heavy lifting 1. Say what's wrong, and what's right. This is close. Keep the friendly opening and the bullet list, but the ending sounds too salesy. Rewrite just the last paragraph so it sounds like a genuine thank-you. Specific feedback (\"the ending sounds salesy\") beats vague feedback (\"make it better\"). 2. Ask for options. Give me 3 alternative versions: one very short, one warm and personal, and one formal. Label each one. Choosing from options is faster than describing what you want. 3. Ask it to critique itself. Review your last answer the way a tough editor would. What's weak, missing or unclear? Then write an improved version that fixes those problems. This works surprisingly well for writing, plans and arguments. 4. Add the context you forgot. I should have mentioned: this is for my team of 4 volunteers, and none of them have used this software before. Please adjust the instructions. 5. Ask what it needs. What information would help you make this much better? Ask me. Follow up, edit, or start fresh? Most assistants give you three ways forward: Follow up (most of the time) when the answer is on the right track and just needs adjusting. Edit your original message, or regenerate, when the answer went in the wrong direction from the start. Fixing the prompt is cleaner than arguing with a bad answer. Start a new chat when you're switching topics, or the conversation has become long and muddled. A fresh chat with a better prompt often beats ten corrections. A handy trick before you start fresh is to ask the old chat to summarize itself: Summarize what we've worked out in this conversation, including my preferences and the decisions we made, so I can paste it into a new chat. Worked example: a birthday party plan First prompt: \"Help me plan my daughter's 8th birthday party.\" The answer is a generic checklist. Here's how three follow-ups transform it: \"Budget is about $200, 12 kids, at our house, and she loves science.\" The plan becomes a science-themed party at home. \"Turn this into a timeline for a 2-hour party, in 15-minute blocks.\" Now you have a running order. \"Give me a shopping list grouped by store section, with rough costs.\" Now you can actually go shopping. Three short follow-ups, one genuinely useful plan, and each step built on the last. Try it now Take an answer from an earlier lesson, or ask for something new, like a packing list or this week's to-do list. Improve it with at least three follow-ups: one about length or tone, one asking for options, and one asking the AI to critique itself. Notice which follow-up helped most. That one goes in your toolkit. Common mistakes Starting over every time. You throw away all the context you built. Follow up first. Vague feedback. \"That's not right\" gives the AI nothing to work with. Say what's off and what you want instead. Arguing with a broken answer. If it's way off, edit your original prompt or start fresh rather than patching. Accepting the first draft. Two quick follow-ups usually lift an answer from okay to excellent. Key takeaways The first answer is a draft. The real value is in the follow-up. Be specific about what to keep and what to change. Ask for options, ask for a self-critique, and ask what information is missing. Follow up when you're close; edit your prompt or start fresh when you're way off.","blocks":[{"lang":"","text":"This is close. Keep the friendly opening and the bullet list, but the\nending sounds too salesy. Rewrite just the last paragraph so it sounds\nlike a genuine thank-you."},{"lang":"","text":"Give me 3 alternative versions: one very short, one warm and personal,\nand one formal. Label each one."},{"lang":"","text":"Review your last answer the way a tough editor would. What's weak,\nmissing or unclear? Then write an improved version that fixes those\nproblems."},{"lang":"","text":"I should have mentioned: this is for my team of 4 volunteers, and none\nof them have used this software before. Please adjust the instructions."},{"lang":"","text":"What information would help you make this much better? Ask me."},{"lang":"","text":"Summarize what we've worked out in this conversation, including my\npreferences and the decisions we made, so I can paste it into a new chat."}],"quiz":[{"q":"According to the lesson, how should you treat the first answer an assistant gives you?","options":["As the finished product, ready to use as is","As proof your prompt failed if it isn't perfect","As a draft you can steer with follow-ups","As a guess you should always throw away"],"answer":2,"explain":"The first answer is a draft. The real value comes from specific follow-ups that build on the conversation instead of starting over."},{"q":"An answer is close, but the ending sounds too salesy. What's the best next step?","options":["Reply \"that's not right\" and ask it to try again","Delete the chat and retype your original prompt","Open a new chat and ask the same question there","Say what to keep and that the ending sounds salesy"],"answer":3,"explain":"Specific feedback about what to keep and what's wrong beats vague feedback, and following up keeps the context you've already built."},{"q":"Your chat has become long and muddled, but you want to keep working on the same project. What should you do?","options":["Ask it to summarize the conversation, then paste that into a new chat","Keep adding corrections in the same chat until it gets back on track","Start a new chat with no background and re-explain everything from memory","Tell the assistant to forget everything and carry on in the same chat"],"answer":0,"explain":"A long, muddled conversation is a sign to start a new chat. Asking the old chat to summarize your preferences and decisions first lets you carry the context over."}],"videoUrl":null},{"n":6,"slug":"give-ai-your-context","title":"Give AI Your Context: Custom Instructions, Projects & Templates","summary":"Stop re-explaining yourself. Set up personal instructions, workspaces and reusable templates so every answer starts closer to right.","durationMin":11,"module":2,"moduleTitle":"Prompting That Works","html":"\u003csection class=\"sec sec-intro\">\u003cp>If you&#39;ve used AI for a week, you&#39;ve probably typed the same background again and again: who you are, what you do, how you like your answers. There&#39;s a better way. In this lesson you&#39;ll set things up once, so your assistant starts every conversation already knowing the basics.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Three layers of context\u003c/h2>\n\u003cp>Think of context in three layers, from broadest to most specific:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Personal instructions:\u003c/strong> facts and preferences that apply to almost every chat.\u003c/li>\n\u003cli>\u003cstrong>Workspaces:\u003c/strong> background for one ongoing area of your life, like a job search, a renovation or a course you&#39;re studying.\u003c/li>\n\u003cli>\u003cstrong>Templates:\u003c/strong> saved prompts for tasks you repeat.\u003c/li>\n\u003c/ol>\n\u003cp>Assistants name these features differently (&quot;custom instructions,&quot; &quot;personal preferences,&quot; &quot;projects&quot; and so on), and features change over time. If yours doesn&#39;t have one of them, the note-based approach below works everywhere.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Layer 1: Personal instructions\u003c/h2>\n\u003cp>Most assistants have a settings area where you can describe yourself and how you&#39;d like it to respond. Whatever you write there is quietly included in your conversations.\u003c/p>\n\u003cp>Here&#39;s a template to adapt:\u003c/p>\n\u003cpre>\u003ccode>About me:\n- I&#39;m [ROLE OR LIFE SITUATION], based in [CITY OR COUNTRY].\n- I mostly use AI for [YOUR TOP 3 USES].\n- I&#39;m [A BEGINNER / COMFORTABLE / AN EXPERT] with [RELEVANT TOPICS].\n\nHow I like answers:\n- Get to the point: lead with the answer, then the detail.\n- Use plain English and explain any jargon.\n- Use bullet points for steps and lists.\n- If my request is unclear, ask me a question before answering.\n- If you&#39;re unsure about a fact, say so.\n\u003c/code>\u003c/pre>\n\u003cp>Keep it short and general, and follow the postcard rule from Module 1: \u003cstrong>no sensitive details\u003c/strong> like account numbers, health specifics or anything you wouldn&#39;t want stored.\u003c/p>\n\u003cp>No settings for this? Save the text in a note and paste it at the start of important conversations.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Layer 2: Workspaces for ongoing areas\u003c/h2>\n\u003cp>Some assistants let you group related chats into a project or workspace with its own instructions and files. That&#39;s perfect for anything that lasts weeks or months.\u003c/p>\n\u003cp>\u003cstrong>Example: a job search workspace.\u003c/strong> Add your resume, a list of target roles and an instruction like this:\u003c/p>\n\u003cpre>\u003ccode>This workspace is for my job search. I&#39;m moving from retail management\ninto operations or project coordination roles. Always tailor advice to\nthat transition, highlight transferable skills, and keep cover letters\nunder 250 words. My resume is attached for reference.\n\u003c/code>\u003c/pre>\n\u003cp>Now every chat inside it, whether it&#39;s a cover letter, interview practice or a follow-up email, starts with the full picture.\u003c/p>\n\u003cp>Good candidates for a workspace: a home renovation, a wedding, a course you&#39;re studying, a side business, or caring for an aging parent. No workspace feature? Keep a short &quot;briefing note&quot; for each area and paste it in when you start a related chat.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Layer 3: Reusable templates\u003c/h2>\n\u003cp>Any prompt you use more than twice deserves to be saved. Create a note called \u003cstrong>&quot;My AI Prompts&quot;\u003c/strong> in the notes app you already use, and store your best prompts with blanks to fill in:\u003c/p>\n\u003cpre>\u003ccode>WEEKLY PLAN\nHere&#39;s my week: [PASTE CALENDAR OR LIST]. My top priorities are\n[PRIORITIES]. Build a realistic day-by-day plan, flag anything that\nwon&#39;t fit, and suggest what to drop or delegate.\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>REPLY HELPER\nHere&#39;s a message I received: [PASTE MESSAGE]. I want to reply\n[YES / NO / NOT YET] and my main point is [POINT]. Draft a reply\nunder 100 words in a [TONE] tone.\n\u003c/code>\u003c/pre>\n\u003cp>The free AI Starter Kit&#39;s prompt library is a great place to start your collection.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example: same question, different context\u003c/h2>\n\u003cp>Ask a fresh assistant &quot;How should I prepare for my meeting tomorrow?&quot; and you&#39;ll get general tips. Ask one that knows you&#39;re a new team lead, prefer short bullet points and get nervous presenting, and you&#39;ll get a focused prep checklist that includes a few ways to calm your nerves. Same question, completely different usefulness.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Write your personal instructions using the template above. Aim for 5 to 10 lines.\u003c/li>\n\u003cli>Add them to your assistant&#39;s settings, or save them in a note if that feature isn&#39;t available.\u003c/li>\n\u003cli>Start a new chat and ask: &quot;Based on what you know about me, what are three ways you could save me time this week?&quot; Check that the answer reflects your instructions.\u003c/li>\n\u003cli>Create your &quot;My AI Prompts&quot; note and save two templates.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Writing an essay.\u003c/strong> Long instructions get diluted. Keep only what applies to most chats.\u003c/li>\n\u003cli>\u003cstrong>Setting and forgetting.\u003c/strong> Review your instructions every couple of months as your needs change.\u003c/li>\n\u003cli>\u003cstrong>Storing sensitive details.\u003c/strong> Save preferences, not private data.\u003c/li>\n\u003cli>\u003cstrong>Never checking memory.\u003c/strong> If your assistant remembers things, look at what it saved now and then, and delete anything outdated.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Layer your context: personal instructions, workspaces for ongoing areas, and saved templates.\u003c/li>\n\u003cli>Personal instructions should be short, general and free of sensitive details.\u003c/li>\n\u003cli>Workspaces keep long-running topics organized with their own background and files.\u003c/li>\n\u003cli>Save any prompt you use more than twice. Your template library is your superpower.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"If you've used AI for a week, you've probably typed the same background again and again: who you are, what you do, how you like your answers. There's a better way. In this lesson you'll set things up once, so your assistant starts every conversation already knowing the basics. Three layers of context Think of context in three layers, from broadest to most specific: Personal instructions: facts and preferences that apply to almost every chat. Workspaces: background for one ongoing area of your life, like a job search, a renovation or a course you're studying. Templates: saved prompts for tasks you repeat. Assistants name these features differently (\"custom instructions,\" \"personal preferences,\" \"projects\" and so on), and features change over time. If yours doesn't have one of them, the note-based approach below works everywhere. Layer 1: Personal instructions Most assistants have a settings area where you can describe yourself and how you'd like it to respond. Whatever you write there is quietly included in your conversations. Here's a template to adapt: About me: - I'm [ROLE OR LIFE SITUATION], based in [CITY OR COUNTRY]. - I mostly use AI for [YOUR TOP 3 USES]. - I'm [A BEGINNER / COMFORTABLE / AN EXPERT] with [RELEVANT TOPICS]. How I like answers: - Get to the point: lead with the answer, then the detail. - Use plain English and explain any jargon. - Use bullet points for steps and lists. - If my request is unclear, ask me a question before answering. - If you're unsure about a fact, say so. Keep it short and general, and follow the postcard rule from Module 1: no sensitive details like account numbers, health specifics or anything you wouldn't want stored. No settings for this? Save the text in a note and paste it at the start of important conversations. Layer 2: Workspaces for ongoing areas Some assistants let you group related chats into a project or workspace with its own instructions and files. That's perfect for anything that lasts weeks or months. Example: a job search workspace. Add your resume, a list of target roles and an instruction like this: This workspace is for my job search. I'm moving from retail management into operations or project coordination roles. Always tailor advice to that transition, highlight transferable skills, and keep cover letters under 250 words. My resume is attached for reference. Now every chat inside it, whether it's a cover letter, interview practice or a follow-up email, starts with the full picture. Good candidates for a workspace: a home renovation, a wedding, a course you're studying, a side business, or caring for an aging parent. No workspace feature? Keep a short \"briefing note\" for each area and paste it in when you start a related chat. Layer 3: Reusable templates Any prompt you use more than twice deserves to be saved. Create a note called \"My AI Prompts\" in the notes app you already use, and store your best prompts with blanks to fill in: WEEKLY PLAN Here's my week: [PASTE CALENDAR OR LIST]. My top priorities are [PRIORITIES]. Build a realistic day-by-day plan, flag anything that won't fit, and suggest what to drop or delegate. REPLY HELPER Here's a message I received: [PASTE MESSAGE]. I want to reply [YES / NO / NOT YET] and my main point is [POINT]. Draft a reply under 100 words in a [TONE] tone. The free AI Starter Kit's prompt library is a great place to start your collection. Worked example: same question, different context Ask a fresh assistant \"How should I prepare for my meeting tomorrow?\" and you'll get general tips. Ask one that knows you're a new team lead, prefer short bullet points and get nervous presenting, and you'll get a focused prep checklist that includes a few ways to calm your nerves. Same question, completely different usefulness. Try it now Write your personal instructions using the template above. Aim for 5 to 10 lines. Add them to your assistant's settings, or save them in a note if that feature isn't available. Start a new chat and ask: \"Based on what you know about me, what are three ways you could save me time this week?\" Check that the answer reflects your instructions. Create your \"My AI Prompts\" note and save two templates. Common mistakes Writing an essay. Long instructions get diluted. Keep only what applies to most chats. Setting and forgetting. Review your instructions every couple of months as your needs change. Storing sensitive details. Save preferences, not private data. Never checking memory. If your assistant remembers things, look at what it saved now and then, and delete anything outdated. Key takeaways Layer your context: personal instructions, workspaces for ongoing areas, and saved templates. Personal instructions should be short, general and free of sensitive details. Workspaces keep long-running topics organized with their own background and files. Save any prompt you use more than twice. Your template library is your superpower.","blocks":[{"lang":"","text":"About me:\n- I'm [ROLE OR LIFE SITUATION], based in [CITY OR COUNTRY].\n- I mostly use AI for [YOUR TOP 3 USES].\n- I'm [A BEGINNER / COMFORTABLE / AN EXPERT] with [RELEVANT TOPICS].\n\nHow I like answers:\n- Get to the point: lead with the answer, then the detail.\n- Use plain English and explain any jargon.\n- Use bullet points for steps and lists.\n- If my request is unclear, ask me a question before answering.\n- If you're unsure about a fact, say so."},{"lang":"","text":"This workspace is for my job search. I'm moving from retail management\ninto operations or project coordination roles. Always tailor advice to\nthat transition, highlight transferable skills, and keep cover letters\nunder 250 words. My resume is attached for reference."},{"lang":"","text":"WEEKLY PLAN\nHere's my week: [PASTE CALENDAR OR LIST]. My top priorities are\n[PRIORITIES]. Build a realistic day-by-day plan, flag anything that\nwon't fit, and suggest what to drop or delegate."},{"lang":"","text":"REPLY HELPER\nHere's a message I received: [PASTE MESSAGE]. I want to reply\n[YES / NO / NOT YET] and my main point is [POINT]. Draft a reply\nunder 100 words in a [TONE] tone."}],"quiz":[{"q":"What belongs in your personal instructions?","options":["Your account numbers, so it can help with banking","Short, general facts and preferences for most chats","A detailed essay covering your whole life story","Specific health details, so answers are personalized"],"answer":1,"explain":"Personal instructions should be short, general and free of sensitive details: who you are, what you use AI for and how you like your answers."},{"q":"You're starting a months-long home renovation and will ask AI about it often. What's the best setup?","options":["A workspace, or a briefing note, with the project's background","Retyping the full background at the start of every new chat","Adding every renovation detail to your personal instructions","Running the entire project in one single, never-ending chat"],"answer":0,"explain":"Workspaces are for ongoing areas like a renovation. If your assistant has no workspace feature, a short briefing note you paste in works everywhere."},{"q":"You've used the same weekly-planning prompt three times this month. What does the lesson suggest?","options":["Retype it from memory each time so it stays fresh","Paste the whole prompt into your personal instructions","Stop using it, because repeated prompts stop working","Save it with blanks to fill in your \"My AI Prompts\" note"],"answer":3,"explain":"Any prompt you use more than twice deserves to be saved as a template with blanks to fill in, in a note like \"My AI Prompts\"."}],"videoUrl":null},{"n":7,"slug":"emails-and-messages","title":"Emails, Texts & Tricky Messages","summary":"Draft replies in seconds, get the tone right on difficult messages, and say no gracefully, while still sounding like you.","durationMin":10,"module":3,"moduleTitle":"AI for Everyday Life","html":"\u003csection class=\"sec sec-intro\">\u003cp>How much of your week goes into writing messages? Not just emails, but texts to family, notes to your kid&#39;s school, a reply to a client, and that awkward message you&#39;ve been avoiding for three days. This is where AI pays off fastest for most people, because writing messages is pure language work, and you&#39;re the expert on whether the result sounds right.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The golden rule: you bring the substance, AI handles the wording\u003c/h2>\n\u003cp>AI is excellent at \u003cem>how\u003c/em> to say something. Only you know \u003cem>what\u003c/em> to say. The best results come from giving it your key points, even in messy shorthand, and letting it shape them:\u003c/p>\n\u003cpre>\u003ccode>Turn these notes into a clear, friendly email to my team:\n- meeting moved from Tuesday to Thursday, same time\n- bring your Q3 numbers\n- Sam is presenting the new schedule\n- lunch provided\nKeep it under 100 words.\n\u003c/code>\u003c/pre>\n\u003cp>Thirty seconds of notes, a few seconds of AI, one clear email.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Four everyday situations\u003c/h2>\n\u003ch3>1. Replying when you don&#39;t know what to say\u003c/h3>\n\u003cpre>\u003ccode>Here&#39;s an email I received: [PASTE EMAIL]\n\nI want to reply that [YOUR MAIN POINT]. Draft a response that is\n[POLITE BUT FIRM / WARM / BRIEF], under [NUMBER] words.\n\u003c/code>\u003c/pre>\n\u003cp>Before pasting someone else&#39;s message, remove details they wouldn&#39;t want shared, like phone numbers or addresses. The AI doesn&#39;t need them.\u003c/p>\n\u003ch3>2. Saying no without burning a bridge\u003c/h3>\n\u003cpre>\u003ccode>I&#39;ve been asked to [REQUEST]. I need to say no because [REASON].\nWrite a short, kind reply that declines clearly, doesn&#39;t over-apologize,\nand [SUGGESTS AN ALTERNATIVE / LEAVES THE DOOR OPEN FOR NEXT TIME].\n\u003c/code>\u003c/pre>\n\u003ch3>3. The emotionally tricky message\u003c/h3>\n\u003cp>When you&#39;re angry, hurt or anxious, AI makes an excellent calm second pair of eyes:\u003c/p>\n\u003cpre>\u003ccode>I&#39;m upset and I want to respond without making things worse.\nHere&#39;s what they said: [PASTE MESSAGE]\nHere&#39;s my draft reply: [PASTE YOUR DRAFT]\n\n1. How is my draft likely to come across?\n2. Rewrite it so it&#39;s honest about how I feel, but calm and constructive.\n\u003c/code>\u003c/pre>\n\u003cp>The question &quot;How is this likely to come across?&quot; is worth using before you send anything important.\u003c/p>\n\u003ch3>4. Complaints that get results\u003c/h3>\n\u003cpre>\u003ccode>Help me write a complaint to [COMPANY]. What happened: [FACTS, DATES,\nORDER NUMBER IF RELEVANT]. What I want: [REFUND / REPLACEMENT / FIX].\nMake it firm, factual and polite, with a clear request and a reasonable\ndeadline. Under 200 words.\n\u003c/code>\u003c/pre>\n\u003cp>Clear facts plus a specific request are much harder to ignore than an emotional rant.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Keeping your own voice\u003c/h2>\n\u003cp>Messages that sound like a corporate brochure don&#39;t feel like you, and people notice. Three fixes:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Give it a sample.\u003c/strong> Paste two or three messages you&#39;ve written and say, &quot;Match this tone and style.&quot;\u003c/li>\n\u003cli>\u003cstrong>Ban the clichés.\u003c/strong> Add: &quot;Avoid phrases like &#39;I hope this email finds you well&#39; and &#39;Don&#39;t hesitate to reach out.&#39;&quot;\u003c/li>\n\u003cli>\u003cstrong>Do the final edit yourself.\u003c/strong> Change a word or two and add a personal detail. That last 10 percent makes it yours.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example\u003c/h2>\n\u003cp>You need to tell a friend you can&#39;t make their weekend get-together after you&#39;d said yes. Your notes: &quot;Can&#39;t come Sat. Work deadline moved. Really sorry. Want to see them soon, maybe dinner next week.&quot;\u003c/p>\n\u003cp>Your prompt: \u003cem>&quot;Turn this into a warm text to a close friend. Casual and genuine, not over-the-top apologetic. Suggest a specific evening for dinner next week.&quot;\u003c/em> The result is a short, kind message with a real plan in it. You tweak one word and send it: two minutes instead of twenty minutes of overthinking.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Find a message you&#39;ve been putting off answering. There&#39;s always one.\u003c/li>\n\u003cli>Write your key points in rough shorthand.\u003c/li>\n\u003cli>Use the reply prompt above to draft a response, then ask: &quot;How is this likely to come across to the person reading it?&quot;\u003c/li>\n\u003cli>Make it yours with a personal touch, check the details, and send it.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Sending without reading.\u003c/strong> Always check names, dates, numbers and promises. AI can add details that sound right but aren&#39;t.\u003c/li>\n\u003cli>\u003cstrong>Letting AI decide what you say.\u003c/strong> You decide the message; AI helps with the wording.\u003c/li>\n\u003cli>\u003cstrong>Over-polishing messages to people who know you.\u003c/strong> A text to your sister shouldn&#39;t read like a press release. Ask for &quot;casual.&quot;\u003c/li>\n\u003cli>\u003cstrong>Pasting private details you don&#39;t need to.\u003c/strong> Strip out phone numbers, addresses and account details first.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Give AI your key points and let it handle the wording.\u003c/li>\n\u003cli>Ask &quot;How will this come across?&quot; before sending anything important or emotional.\u003c/li>\n\u003cli>Protect your voice with writing samples, banned clichés and a quick personal edit.\u003c/li>\n\u003cli>Always check names, dates and commitments before you hit send.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"How much of your week goes into writing messages? Not just emails, but texts to family, notes to your kid's school, a reply to a client, and that awkward message you've been avoiding for three days. This is where AI pays off fastest for most people, because writing messages is pure language work, and you're the expert on whether the result sounds right. The golden rule: you bring the substance, AI handles the wording AI is excellent at how to say something. Only you know what to say. The best results come from giving it your key points, even in messy shorthand, and letting it shape them: Turn these notes into a clear, friendly email to my team: - meeting moved from Tuesday to Thursday, same time - bring your Q3 numbers - Sam is presenting the new schedule - lunch provided Keep it under 100 words. Thirty seconds of notes, a few seconds of AI, one clear email. Four everyday situations 1. Replying when you don't know what to say Here's an email I received: [PASTE EMAIL] I want to reply that [YOUR MAIN POINT]. Draft a response that is [POLITE BUT FIRM / WARM / BRIEF], under [NUMBER] words. Before pasting someone else's message, remove details they wouldn't want shared, like phone numbers or addresses. The AI doesn't need them. 2. Saying no without burning a bridge I've been asked to [REQUEST]. I need to say no because [REASON]. Write a short, kind reply that declines clearly, doesn't over-apologize, and [SUGGESTS AN ALTERNATIVE / LEAVES THE DOOR OPEN FOR NEXT TIME]. 3. The emotionally tricky message When you're angry, hurt or anxious, AI makes an excellent calm second pair of eyes: I'm upset and I want to respond without making things worse. Here's what they said: [PASTE MESSAGE] Here's my draft reply: [PASTE YOUR DRAFT] 1. How is my draft likely to come across? 2. Rewrite it so it's honest about how I feel, but calm and constructive. The question \"How is this likely to come across?\" is worth using before you send anything important. 4. Complaints that get results Help me write a complaint to [COMPANY]. What happened: [FACTS, DATES, ORDER NUMBER IF RELEVANT]. What I want: [REFUND / REPLACEMENT / FIX]. Make it firm, factual and polite, with a clear request and a reasonable deadline. Under 200 words. Clear facts plus a specific request are much harder to ignore than an emotional rant. Keeping your own voice Messages that sound like a corporate brochure don't feel like you, and people notice. Three fixes: Give it a sample. Paste two or three messages you've written and say, \"Match this tone and style.\" Ban the clichés. Add: \"Avoid phrases like 'I hope this email finds you well' and 'Don't hesitate to reach out.'\" Do the final edit yourself. Change a word or two and add a personal detail. That last 10 percent makes it yours. Worked example You need to tell a friend you can't make their weekend get-together after you'd said yes. Your notes: \"Can't come Sat. Work deadline moved. Really sorry. Want to see them soon, maybe dinner next week.\" Your prompt: \"Turn this into a warm text to a close friend. Casual and genuine, not over-the-top apologetic. Suggest a specific evening for dinner next week.\" The result is a short, kind message with a real plan in it. You tweak one word and send it: two minutes instead of twenty minutes of overthinking. Try it now Find a message you've been putting off answering. There's always one. Write your key points in rough shorthand. Use the reply prompt above to draft a response, then ask: \"How is this likely to come across to the person reading it?\" Make it yours with a personal touch, check the details, and send it. Common mistakes Sending without reading. Always check names, dates, numbers and promises. AI can add details that sound right but aren't. Letting AI decide what you say. You decide the message; AI helps with the wording. Over-polishing messages to people who know you. A text to your sister shouldn't read like a press release. Ask for \"casual.\" Pasting private details you don't need to. Strip out phone numbers, addresses and account details first. Key takeaways Give AI your key points and let it handle the wording. Ask \"How will this come across?\" before sending anything important or emotional. Protect your voice with writing samples, banned clichés and a quick personal edit. Always check names, dates and commitments before you hit send.","blocks":[{"lang":"","text":"Turn these notes into a clear, friendly email to my team:\n- meeting moved from Tuesday to Thursday, same time\n- bring your Q3 numbers\n- Sam is presenting the new schedule\n- lunch provided\nKeep it under 100 words."},{"lang":"","text":"Here's an email I received: [PASTE EMAIL]\n\nI want to reply that [YOUR MAIN POINT]. Draft a response that is\n[POLITE BUT FIRM / WARM / BRIEF], under [NUMBER] words."},{"lang":"","text":"I've been asked to [REQUEST]. I need to say no because [REASON].\nWrite a short, kind reply that declines clearly, doesn't over-apologize,\nand [SUGGESTS AN ALTERNATIVE / LEAVES THE DOOR OPEN FOR NEXT TIME]."},{"lang":"","text":"I'm upset and I want to respond without making things worse.\nHere's what they said: [PASTE MESSAGE]\nHere's my draft reply: [PASTE YOUR DRAFT]\n\n1. How is my draft likely to come across?\n2. Rewrite it so it's honest about how I feel, but calm and constructive."},{"lang":"","text":"Help me write a complaint to [COMPANY]. What happened: [FACTS, DATES,\nORDER NUMBER IF RELEVANT]. What I want: [REFUND / REPLACEMENT / FIX].\nMake it firm, factual and polite, with a clear request and a reasonable\ndeadline. Under 200 words."}],"quiz":[{"q":"What's the golden rule for using AI to write messages?","options":["Let AI decide what to say, since it writes better","Use AI for formal emails only, never for texts","Paste the whole thread and let AI choose your reply","You bring the substance, and AI handles the wording"],"answer":3,"explain":"AI is excellent at how to say something, but only you know what to say, so give it your key points and let it shape them."},{"q":"You're upset and have drafted an angry reply to a message. What should you do before sending it?","options":["Send it right away, while your feelings are fresh and honest","Ask AI to make the reply sound even firmer and sharper","Ask AI how it will come across, then for a calmer version","Delete your draft and let AI reply without your input"],"answer":2,"explain":"The lesson suggests asking how your draft is likely to come across, then rewriting it so it's honest about how you feel but calm and constructive."},{"q":"AI drafted an email that sounds stiff and corporate, not like you. What's the best fix?","options":["Send it anyway, since polished messages always work best","Give it samples of your writing and do the final edit yourself","Ask it to add phrases like \"I hope this email finds you well\"","Ask it to make the whole email longer and more formal"],"answer":1,"explain":"To keep your own voice, give AI a sample of your messages, ban the clichés and do the final edit yourself with a personal touch."}],"videoUrl":null},{"n":8,"slug":"plan-anything","title":"Plan Anything: Meals, Travel, Budgets & Your Week","summary":"Turn AI into a personal planner for meals, trips, budgets and busy weeks, using constraints to get plans that fit your real life.","durationMin":12,"module":3,"moduleTitle":"AI for Everyday Life","html":"\u003csection class=\"sec sec-intro\">\u003cp>Planning is a hidden time sink. Deciding what&#39;s for dinner, mapping out a trip, working out where the money goes, squeezing a too-full week into seven days: none of it is hard, exactly, but it drains your energy. AI is a remarkably good planning partner, as long as you give it the one thing it can&#39;t guess: \u003cstrong>your constraints\u003c/strong>.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The planning formula: goal + constraints + format\u003c/h2>\n\u003cp>A plan is only useful if it fits your real life, so every planning prompt should include:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Goal:\u003c/strong> what you want to end up with.\u003c/li>\n\u003cli>\u003cstrong>Constraints:\u003c/strong> budget, time, people, preferences, restrictions, and what you already have.\u003c/li>\n\u003cli>\u003cstrong>Format:\u003c/strong> how you&#39;ll use the plan, such as a shopping list, a day-by-day itinerary or a table.\u003c/li>\n\u003c/ul>\n\u003cp>The more constraints you share, the less you&#39;ll have to fix later.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Meals\u003c/h2>\n\u003cpre>\u003ccode>Plan 5 weeknight dinners for [NUMBER] people.\nConstraints: [DIETARY NEEDS AND DISLIKES], no more than [MINUTES]\nminutes of hands-on cooking, budget-friendly, and use up what I already\nhave: [INGREDIENTS]. Reuse ingredients across meals to reduce waste.\nThen give me one combined grocery list grouped by store section.\n\u003c/code>\u003c/pre>\n\u003cp>Follow-ups that help: &quot;Swap Wednesday for something vegetarian,&quot; &quot;Make Thursday a leftovers night,&quot; or &quot;Which of these can I prep on Sunday?&quot;\u003c/p>\n\u003cp>A note on allergies: AI can suggest recipes that avoid an allergen, but always read the labels yourself. It can&#39;t see what&#39;s actually in the product you buy.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Travel\u003c/h2>\n\u003cp>AI is great at turning a vague idea into a structured itinerary:\u003c/p>\n\u003cpre>\u003ccode>I&#39;m planning [NUMBER] days in [DESTINATION] in [MONTH] with [WHO&#39;S\nCOMING]. We enjoy [INTERESTS] and prefer a [RELAXED / PACKED] pace.\nOur budget is [LEVEL]. Create a day-by-day itinerary that groups nearby\nsights together, includes a rainy-day backup, and notes anything that\nusually needs booking in advance.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Verify before you book.\u003c/strong> Opening hours, prices, seasonal closures, transport timetables and entry or visa requirements change. Treat the itinerary as a smart first draft and confirm details on official websites. If your assistant can search the web, ask it to include links, then open them.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Budgets\u003c/h2>\n\u003cp>AI can help you see patterns and build a simple plan without a spreadsheet:\u003c/p>\n\u003cpre>\u003ccode>Here are my approximate monthly expenses: [CATEGORIES AND ROUGH\nAMOUNTS]. My take-home pay is about [AMOUNT]. I want to save [GOAL]\nby [DATE].\n\n1. Organize these into needs, wants and savings.\n2. Suggest 3 realistic places to cut, with estimated monthly savings.\n3. Build a simple monthly budget table and show your math.\n\u003c/code>\u003c/pre>\n\u003cp>Use \u003cstrong>rounded figures and categories\u003c/strong>, never account numbers, logins or full statements. And double-check the totals with a calculator. AI is usually right, but it takes ten seconds to be sure.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Your week\u003c/h2>\n\u003cpre>\u003ccode>Here&#39;s everything on my plate this week: [TASKS, APPOINTMENTS AND\nDEADLINES]. Fixed commitments: [MEETINGS, SCHOOL RUNS, ETC.]. I have\nthe most energy in the [MORNING / AFTERNOON].\n\nBuild a realistic day-by-day plan. Put demanding work in my high-energy\ntime, batch small tasks, leave buffer time, and tell me honestly what\nwon&#39;t fit, with suggestions for what to drop, delay or delegate.\n\u003c/code>\u003c/pre>\n\u003cp>That last line matters. A plan that pretends everything fits isn&#39;t a plan. Asking AI to be honest about capacity gives you permission to let something go.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example: the Sunday reset\u003c/h2>\n\u003cp>Here&#39;s a 15-minute weekly routine that combines everything above:\u003c/p>\n\u003col>\n\u003cli>Brain-dump your week into the weekly planning prompt.\u003c/li>\n\u003cli>Ask for a dinner plan that fits the busy evenings it found: &quot;Quick meals on Tuesday and Thursday, I get home late.&quot;\u003c/li>\n\u003cli>Ask for one grocery list for the whole week.\u003c/li>\n\u003cli>Ask: &quot;What&#39;s one thing I could prepare tonight to make this week easier?&quot;\u003c/li>\n\u003c/ol>\n\u003cp>Four prompts, one calmer week.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Pick one area: meals, a trip, your budget or your week.\u003c/li>\n\u003cli>Write down at least \u003cstrong>four constraints\u003c/strong> before you write the prompt.\u003c/li>\n\u003cli>Use the matching prompt above, then improve the plan with two follow-ups.\u003c/li>\n\u003cli>Save your final prompt to your &quot;My AI Prompts&quot; note so you can reuse it.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>No constraints.\u003c/strong> &quot;Plan a trip to Italy&quot; gets a generic tourist list. Who, when, budget and pace change everything.\u003c/li>\n\u003cli>\u003cstrong>Trusting time-sensitive details.\u003c/strong> Prices, hours and rules change. Confirm anything you&#39;ll pay for or travel for.\u003c/li>\n\u003cli>\u003cstrong>Over-packed plans.\u003c/strong> Ask for buffer time and honest trade-offs.\u003c/li>\n\u003cli>\u003cstrong>Sharing sensitive financial details.\u003c/strong> Categories and rounded numbers are all AI needs.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Every good planning prompt includes a goal, your constraints and a useful format.\u003c/li>\n\u003cli>AI drafts the plan; you confirm prices, hours, rules and anything you&#39;ll pay for.\u003c/li>\n\u003cli>Ask AI to tell you honestly what won&#39;t fit.\u003c/li>\n\u003cli>A 15-minute weekly planning session with AI can make the whole week calmer.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Planning is a hidden time sink. Deciding what's for dinner, mapping out a trip, working out where the money goes, squeezing a too-full week into seven days: none of it is hard, exactly, but it drains your energy. AI is a remarkably good planning partner, as long as you give it the one thing it can't guess: your constraints . The planning formula: goal + constraints + format A plan is only useful if it fits your real life, so every planning prompt should include: Goal: what you want to end up with. Constraints: budget, time, people, preferences, restrictions, and what you already have. Format: how you'll use the plan, such as a shopping list, a day-by-day itinerary or a table. The more constraints you share, the less you'll have to fix later. Meals Plan 5 weeknight dinners for [NUMBER] people. Constraints: [DIETARY NEEDS AND DISLIKES], no more than [MINUTES] minutes of hands-on cooking, budget-friendly, and use up what I already have: [INGREDIENTS]. Reuse ingredients across meals to reduce waste. Then give me one combined grocery list grouped by store section. Follow-ups that help: \"Swap Wednesday for something vegetarian,\" \"Make Thursday a leftovers night,\" or \"Which of these can I prep on Sunday?\" A note on allergies: AI can suggest recipes that avoid an allergen, but always read the labels yourself. It can't see what's actually in the product you buy. Travel AI is great at turning a vague idea into a structured itinerary: I'm planning [NUMBER] days in [DESTINATION] in [MONTH] with [WHO'S COMING]. We enjoy [INTERESTS] and prefer a [RELAXED / PACKED] pace. Our budget is [LEVEL]. Create a day-by-day itinerary that groups nearby sights together, includes a rainy-day backup, and notes anything that usually needs booking in advance. Verify before you book. Opening hours, prices, seasonal closures, transport timetables and entry or visa requirements change. Treat the itinerary as a smart first draft and confirm details on official websites. If your assistant can search the web, ask it to include links, then open them. Budgets AI can help you see patterns and build a simple plan without a spreadsheet: Here are my approximate monthly expenses: [CATEGORIES AND ROUGH AMOUNTS]. My take-home pay is about [AMOUNT]. I want to save [GOAL] by [DATE]. 1. Organize these into needs, wants and savings. 2. Suggest 3 realistic places to cut, with estimated monthly savings. 3. Build a simple monthly budget table and show your math. Use rounded figures and categories , never account numbers, logins or full statements. And double-check the totals with a calculator. AI is usually right, but it takes ten seconds to be sure. Your week Here's everything on my plate this week: [TASKS, APPOINTMENTS AND DEADLINES]. Fixed commitments: [MEETINGS, SCHOOL RUNS, ETC.]. I have the most energy in the [MORNING / AFTERNOON]. Build a realistic day-by-day plan. Put demanding work in my high-energy time, batch small tasks, leave buffer time, and tell me honestly what won't fit, with suggestions for what to drop, delay or delegate. That last line matters. A plan that pretends everything fits isn't a plan. Asking AI to be honest about capacity gives you permission to let something go. Worked example: the Sunday reset Here's a 15-minute weekly routine that combines everything above: Brain-dump your week into the weekly planning prompt. Ask for a dinner plan that fits the busy evenings it found: \"Quick meals on Tuesday and Thursday, I get home late.\" Ask for one grocery list for the whole week. Ask: \"What's one thing I could prepare tonight to make this week easier?\" Four prompts, one calmer week. Try it now Pick one area: meals, a trip, your budget or your week. Write down at least four constraints before you write the prompt. Use the matching prompt above, then improve the plan with two follow-ups. Save your final prompt to your \"My AI Prompts\" note so you can reuse it. Common mistakes No constraints. \"Plan a trip to Italy\" gets a generic tourist list. Who, when, budget and pace change everything. Trusting time-sensitive details. Prices, hours and rules change. Confirm anything you'll pay for or travel for. Over-packed plans. Ask for buffer time and honest trade-offs. Sharing sensitive financial details. Categories and rounded numbers are all AI needs. Key takeaways Every good planning prompt includes a goal, your constraints and a useful format. AI drafts the plan; you confirm prices, hours, rules and anything you'll pay for. Ask AI to tell you honestly what won't fit. A 15-minute weekly planning session with AI can make the whole week calmer.","blocks":[{"lang":"","text":"Plan 5 weeknight dinners for [NUMBER] people.\nConstraints: [DIETARY NEEDS AND DISLIKES], no more than [MINUTES]\nminutes of hands-on cooking, budget-friendly, and use up what I already\nhave: [INGREDIENTS]. Reuse ingredients across meals to reduce waste.\nThen give me one combined grocery list grouped by store section."},{"lang":"","text":"I'm planning [NUMBER] days in [DESTINATION] in [MONTH] with [WHO'S\nCOMING]. We enjoy [INTERESTS] and prefer a [RELAXED / PACKED] pace.\nOur budget is [LEVEL]. Create a day-by-day itinerary that groups nearby\nsights together, includes a rainy-day backup, and notes anything that\nusually needs booking in advance."},{"lang":"","text":"Here are my approximate monthly expenses: [CATEGORIES AND ROUGH\nAMOUNTS]. My take-home pay is about [AMOUNT]. I want to save [GOAL]\nby [DATE].\n\n1. Organize these into needs, wants and savings.\n2. Suggest 3 realistic places to cut, with estimated monthly savings.\n3. Build a simple monthly budget table and show your math."},{"lang":"","text":"Here's everything on my plate this week: [TASKS, APPOINTMENTS AND\nDEADLINES]. Fixed commitments: [MEETINGS, SCHOOL RUNS, ETC.]. I have\nthe most energy in the [MORNING / AFTERNOON].\n\nBuild a realistic day-by-day plan. Put demanding work in my high-energy\ntime, batch small tasks, leave buffer time, and tell me honestly what\nwon't fit, with suggestions for what to drop, delay or delegate."}],"quiz":[{"q":"What three things should every planning prompt include?","options":["A goal, your constraints and a useful format","A role, a deadline and a list of websites","A budget, a calendar and your account details","A question, a template and a word limit"],"answer":0,"explain":"The lesson's planning formula is goal plus constraints plus format, because a plan is only useful if it fits your real life and the way you'll use it."},{"q":"AI built you a great day-by-day itinerary for a trip. What should you do before booking anything?","options":["Book it all right away, since the itinerary is final","Confirm hours, prices and entry rules on official websites","Ask the AI if it's sure, and book if it says yes","Share your card number so the AI can check availability"],"answer":1,"explain":"Opening hours, prices, closures and entry requirements change, so treat the itinerary as a smart first draft and confirm details on official websites."},{"q":"You want AI's help building a monthly budget. What should you share with it?","options":["Your full bank statements and login details","Your account numbers so it can track spending","Rounded figures and your spending categories","Nothing at all, since AI can't help with money"],"answer":2,"explain":"Categories and rounded numbers are all AI needs. Never share account numbers, logins or full statements, and double-check the totals with a calculator."}],"videoUrl":null},{"n":9,"slug":"learn-anything-faster","title":"Learn Anything Faster with an AI Tutor","summary":"Use AI as a patient personal tutor: explanations at your level, practice questions and feedback that make new knowledge stick.","durationMin":11,"module":3,"moduleTitle":"AI for Everyday Life","html":"\u003csection class=\"sec sec-intro\">\u003cp>Imagine a tutor who knows something about almost every subject, never gets impatient, is available at 2am, and will happily explain the same idea five different ways until it clicks. That&#39;s what an AI assistant can be for you, but only if you use it to \u003cem>learn\u003c/em>, not just to get answers.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Answers versus understanding\u003c/h2>\n\u003cp>There are two ways to use AI for learning:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Shortcut mode:\u003c/strong> &quot;What&#39;s the answer?&quot; Fast, but very little sticks.\u003c/li>\n\u003cli>\u003cstrong>Tutor mode:\u003c/strong> &quot;Help me understand this.&quot; A little slower, and you actually learn.\u003c/li>\n\u003c/ul>\n\u003cp>Tutor mode works because learning takes effort: explaining, recalling, making mistakes and correcting them. A good AI tutor makes you do that work, with support.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Five tutor techniques\u003c/h2>\n\u003ch3>1. Explain it at my level\u003c/h3>\n\u003cpre>\u003ccode>Explain [TOPIC] to me. I&#39;m a complete beginner. Start with the big\npicture in 3-4 sentences, use an everyday analogy, then give me the\n3 most important ideas I need to understand first.\n\u003c/code>\u003c/pre>\n\u003cp>Not clicking yet? Follow up with &quot;Explain it a different way,&quot; &quot;Give me a real-world example&quot; or &quot;What&#39;s a common misconception about this?&quot;\u003c/p>\n\u003ch3>2. Quiz me\u003c/h3>\n\u003cp>Testing yourself is one of the most effective ways to remember things. Learning researchers call it retrieval practice.\u003c/p>\n\u003cpre>\u003ccode>Quiz me on [TOPIC] with 5 questions, one at a time. Wait for my answer\nbefore moving on. If I get one wrong, give me a hint before the answer.\nAt the end, tell me which areas I should review.\n\u003c/code>\u003c/pre>\n\u003ch3>3. Teach it back\u003c/h3>\n\u003cp>If you can explain something simply, you understand it. Use the AI to check:\u003c/p>\n\u003cpre>\u003ccode>I&#39;m going to explain [TOPIC] in my own words. Tell me what I got right,\nwhat I got wrong or left out, and ask me one question that would test\nwhether I really understand it. My explanation: [YOUR EXPLANATION]\n\u003c/code>\u003c/pre>\n\u003ch3>4. The Socratic tutor\u003c/h3>\n\u003cpre>\u003ccode>Act as a Socratic tutor. I want to understand [TOPIC]. Don&#39;t give me\nthe answers. Ask me guiding questions, one at a time, that help me work\nit out myself. If I&#39;m stuck twice in a row, give me a small hint.\n\u003c/code>\u003c/pre>\n\u003cp>It&#39;s slower, and it&#39;s also how the deepest learning happens.\u003c/p>\n\u003ch3>5. Build a learning plan\u003c/h3>\n\u003cpre>\u003ccode>I want to learn [SKILL] well enough to [SPECIFIC GOAL] in [TIMEFRAME].\nI can spend [TIME] per week. Create a week-by-week plan with what to\nlearn, how to practice and a simple way to check my progress each week.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Practicing a language\u003c/h2>\n\u003cp>AI makes a patient conversation partner:\u003c/p>\n\u003cpre>\u003ccode>Let&#39;s practice [LANGUAGE] at a [BEGINNER / INTERMEDIATE] level. Chat\nwith me casually about [TOPIC], using short messages. After each of my\nreplies, gently correct my mistakes, then continue the conversation.\n\u003c/code>\u003c/pre>\n\u003cp>If your assistant has a voice mode, try this out loud. There&#39;s more on voice features in Module 4.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>A note for students and parents\u003c/h2>\n\u003cp>Using AI to understand material, practice and get feedback is powerful. Using it to write your assignments usually breaks the rules, and it skips the learning you&#39;re there for. Schools and courses set different policies, so check yours. A good rule of thumb: \u003cstrong>use AI the way you&#39;d use a great tutor, not a ghostwriter.\u003c/strong>\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example: understanding your electricity bill\u003c/h2>\n\u003cp>Say your electricity bill jumped and you want to know why. Shortcut mode gets you a list of generic causes. Tutor mode goes further: you ask for a plain-English explanation of what a kilowatt-hour is, let the AI quiz you with two quick questions, then type in your monthly usage figures (no account details) and work out together which appliances and habits matter most. Fifteen minutes later you understand your bill, and you&#39;ll still understand it next month.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Watch for accuracy\u003c/h2>\n\u003cp>AI is very reliable on well-established topics, such as basic science, history overviews, grammar and how everyday things work. It&#39;s less reliable on niche, fast-changing or highly technical specifics. If details matter, as with a certification exam, a medical topic or a legal requirement, confirm key facts with your textbook, official guidance or another trusted source.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Pick something you&#39;ve always wanted to understand better, anything from how interest rates work to how to prune roses.\u003c/li>\n\u003cli>Use the &quot;explain it at my level&quot; prompt.\u003c/li>\n\u003cli>Then use the quiz prompt and answer all five questions honestly.\u003c/li>\n\u003cli>Finally, explain the topic back in your own words and ask for feedback.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Only asking for answers.\u003c/strong> You&#39;ll feel productive but remember little. Get the AI to quiz you.\u003c/li>\n\u003cli>\u003cstrong>Not saying your level.\u003c/strong> Tell it what you already know, or the explanation may be pitched too high or too low.\u003c/li>\n\u003cli>\u003cstrong>Trusting niche details.\u003c/strong> For specialized or high-stakes topics, cross-check the key facts.\u003c/li>\n\u003cli>\u003cstrong>Reading passively.\u003c/strong> Stop and explain things back. That&#39;s where the learning happens.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Use AI in tutor mode, focused on understanding, rather than shortcut mode.\u003c/li>\n\u003cli>Ask for explanations at your level, then quiz yourself and teach it back.\u003c/li>\n\u003cli>A Socratic tutor makes you think, and thinking is what makes learning stick.\u003c/li>\n\u003cli>Verify key facts when you&#39;re learning niche or high-stakes topics.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Imagine a tutor who knows something about almost every subject, never gets impatient, is available at 2am, and will happily explain the same idea five different ways until it clicks. That's what an AI assistant can be for you, but only if you use it to learn , not just to get answers. Answers versus understanding There are two ways to use AI for learning: Shortcut mode: \"What's the answer?\" Fast, but very little sticks. Tutor mode: \"Help me understand this.\" A little slower, and you actually learn. Tutor mode works because learning takes effort: explaining, recalling, making mistakes and correcting them. A good AI tutor makes you do that work, with support. Five tutor techniques 1. Explain it at my level Explain [TOPIC] to me. I'm a complete beginner. Start with the big picture in 3-4 sentences, use an everyday analogy, then give me the 3 most important ideas I need to understand first. Not clicking yet? Follow up with \"Explain it a different way,\" \"Give me a real-world example\" or \"What's a common misconception about this?\" 2. Quiz me Testing yourself is one of the most effective ways to remember things. Learning researchers call it retrieval practice. Quiz me on [TOPIC] with 5 questions, one at a time. Wait for my answer before moving on. If I get one wrong, give me a hint before the answer. At the end, tell me which areas I should review. 3. Teach it back If you can explain something simply, you understand it. Use the AI to check: I'm going to explain [TOPIC] in my own words. Tell me what I got right, what I got wrong or left out, and ask me one question that would test whether I really understand it. My explanation: [YOUR EXPLANATION] 4. The Socratic tutor Act as a Socratic tutor. I want to understand [TOPIC]. Don't give me the answers. Ask me guiding questions, one at a time, that help me work it out myself. If I'm stuck twice in a row, give me a small hint. It's slower, and it's also how the deepest learning happens. 5. Build a learning plan I want to learn [SKILL] well enough to [SPECIFIC GOAL] in [TIMEFRAME]. I can spend [TIME] per week. Create a week-by-week plan with what to learn, how to practice and a simple way to check my progress each week. Practicing a language AI makes a patient conversation partner: Let's practice [LANGUAGE] at a [BEGINNER / INTERMEDIATE] level. Chat with me casually about [TOPIC], using short messages. After each of my replies, gently correct my mistakes, then continue the conversation. If your assistant has a voice mode, try this out loud. There's more on voice features in Module 4. A note for students and parents Using AI to understand material, practice and get feedback is powerful. Using it to write your assignments usually breaks the rules, and it skips the learning you're there for. Schools and courses set different policies, so check yours. A good rule of thumb: use AI the way you'd use a great tutor, not a ghostwriter. Worked example: understanding your
