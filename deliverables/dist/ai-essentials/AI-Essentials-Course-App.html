electricity bill Say your electricity bill jumped and you want to know why. Shortcut mode gets you a list of generic causes. Tutor mode goes further: you ask for a plain-English explanation of what a kilowatt-hour is, let the AI quiz you with two quick questions, then type in your monthly usage figures (no account details) and work out together which appliances and habits matter most. Fifteen minutes later you understand your bill, and you'll still understand it next month. Watch for accuracy AI is very reliable on well-established topics, such as basic science, history overviews, grammar and how everyday things work. It's less reliable on niche, fast-changing or highly technical specifics. If details matter, as with a certification exam, a medical topic or a legal requirement, confirm key facts with your textbook, official guidance or another trusted source. Try it now Pick something you've always wanted to understand better, anything from how interest rates work to how to prune roses. Use the \"explain it at my level\" prompt. Then use the quiz prompt and answer all five questions honestly. Finally, explain the topic back in your own words and ask for feedback. Common mistakes Only asking for answers. You'll feel productive but remember little. Get the AI to quiz you. Not saying your level. Tell it what you already know, or the explanation may be pitched too high or too low. Trusting niche details. For specialized or high-stakes topics, cross-check the key facts. Reading passively. Stop and explain things back. That's where the learning happens. Key takeaways Use AI in tutor mode, focused on understanding, rather than shortcut mode. Ask for explanations at your level, then quiz yourself and teach it back. A Socratic tutor makes you think, and thinking is what makes learning stick. Verify key facts when you're learning niche or high-stakes topics.","blocks":[{"lang":"","text":"Explain [TOPIC] to me. I'm a complete beginner. Start with the big\npicture in 3-4 sentences, use an everyday analogy, then give me the\n3 most important ideas I need to understand first."},{"lang":"","text":"Quiz me on [TOPIC] with 5 questions, one at a time. Wait for my answer\nbefore moving on. If I get one wrong, give me a hint before the answer.\nAt the end, tell me which areas I should review."},{"lang":"","text":"I'm going to explain [TOPIC] in my own words. Tell me what I got right,\nwhat I got wrong or left out, and ask me one question that would test\nwhether I really understand it. My explanation: [YOUR EXPLANATION]"},{"lang":"","text":"Act as a Socratic tutor. I want to understand [TOPIC]. Don't give me\nthe answers. Ask me guiding questions, one at a time, that help me work\nit out myself. If I'm stuck twice in a row, give me a small hint."},{"lang":"","text":"I want to learn [SKILL] well enough to [SPECIFIC GOAL] in [TIMEFRAME].\nI can spend [TIME] per week. Create a week-by-week plan with what to\nlearn, how to practice and a simple way to check my progress each week."},{"lang":"","text":"Let's practice [LANGUAGE] at a [BEGINNER / INTERMEDIATE] level. Chat\nwith me casually about [TOPIC], using short messages. After each of my\nreplies, gently correct my mistakes, then continue the conversation."}],"quiz":[{"q":"What's the difference between shortcut mode and tutor mode?","options":["Shortcut mode is slower, but you remember more","Tutor mode only works for school subjects and exams","Shortcut mode gets answers; tutor mode builds understanding","Tutor mode means the AI does all the thinking for you"],"answer":2,"explain":"Shortcut mode asks for the answer and little sticks. Tutor mode asks for help understanding and makes you explain, recall and correct mistakes, so you actually learn."},{"q":"You've just read an AI explanation of a new topic and want it to stick. What should you do next?","options":["Read the same explanation again a few more times","Ask for a longer, more detailed explanation","Copy the explanation into your notes and move on","Ask the AI to quiz you, one question at a time"],"answer":3,"explain":"Testing yourself, which learning researchers call retrieval practice, is one of the most effective ways to remember things, so have the AI quiz you instead of reading passively."},{"q":"You're studying for a certification exam with an AI tutor. How should you handle the key facts it gives you?","options":["Confirm them with your textbook or official guidance","Trust them fully, since AI is reliable on every topic","Ask the AI to write your practice answers for you","Skip checking, since the AI sounds confident about them"],"answer":0,"explain":"AI is less reliable on niche or high-stakes specifics, so for something like a certification exam the lesson says to confirm key facts with your textbook, official guidance or another trusted source."}],"videoUrl":null},{"n":10,"slug":"health-legal-and-money-questions","title":"Health, Legal & Money Questions: Using AI Safely","summary":"Use AI to understand serious topics and prepare better questions, with clear rules for when to verify and when to see a professional.","durationMin":12,"module":3,"moduleTitle":"AI for Everyday Life","html":"\u003csection class=\"sec sec-intro\">\u003cp>Sooner or later you&#39;ll want to ask AI about something serious: a symptom, a confusing clause in a lease, whether to pay off debt or save. AI can be genuinely helpful here. It can explain jargon, help you organize your thoughts and prepare you for a much better conversation with a professional. It can also be confidently wrong in ways that matter. This lesson gives you a simple system for getting the benefits safely.\u003c/p>\n\u003cp>\u003cstrong>Emergencies first:\u003c/strong> if you or someone else might be in danger, or there are symptoms like chest pain, difficulty breathing or signs of a stroke, contact emergency services right away. Don&#39;t ask an AI.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Why these topics are different\u003c/h2>\n\u003cp>With everyday tasks, a mistake costs you a rewrite. Here, a mistake can cost your health, your money or your legal rights. Three reasons to be extra careful:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>AI can&#39;t see your full situation.\u003c/strong> A doctor examines you, a lawyer reads your documents, and a financial advisor knows your whole picture. AI only knows what you typed.\u003c/li>\n\u003cli>\u003cstrong>Rules depend on where you live.\u003c/strong> Laws, taxes, benefits and medical guidelines vary by country, state and even city, and AI may blend them together.\u003c/li>\n\u003cli>\u003cstrong>It tends to reassure.\u003c/strong> Assistants are built to be helpful and agreeable, so they can lean toward telling you what you hope to hear.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The traffic-light system\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Light\u003c/th>\n\u003cth>What AI helps with\u003c/th>\n\u003cth>Your move\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>🟢 Green\u003c/td>\n\u003ctd>Explaining terms, summarizing documents, preparing questions\u003c/td>\n\u003ctd>Go ahead\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🟡 Yellow\u003c/td>\n\u003ctd>General guidance, typical options, how a process usually works\u003c/td>\n\u003ctd>Verify with an official source\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>🔴 Red\u003c/td>\n\u003ctd>Diagnosis, medication changes, legal strategy, big money decisions\u003c/td>\n\u003ctd>Prepare with AI, decide with a professional\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The safest and most valuable use of AI on serious topics is green: \u003cstrong>understanding and preparing.\u003c/strong>\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Health: prepare for your appointment\u003c/h2>\n\u003cpre>\u003ccode>I have a doctor&#39;s appointment about [SYMPTOM OR CONDITION]. Help me\nprepare. Don&#39;t diagnose me.\n1. Organize my notes into a clear summary I can share: [WHEN IT STARTED,\n   HOW OFTEN IT HAPPENS, WHAT HELPS OR MAKES IT WORSE, CURRENT MEDICATIONS]\n2. Suggest questions I should ask.\n3. Explain any terms I might hear, in plain English.\n\u003c/code>\u003c/pre>\n\u003cp>You walk in organized and walk out with your questions answered. It&#39;s also useful afterwards: paste your visit notes and ask, &quot;Explain this in plain English. What should I ask at my follow-up?&quot;\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Legal: understand before you sign\u003c/h2>\n\u003cpre>\u003ccode>Here&#39;s a clause from my [LEASE / CONTRACT / TERMS], with names and\naddresses removed: [PASTE CLAUSE]. I&#39;m in [STATE OR COUNTRY].\n1. Explain what it means in plain English.\n2. What could it mean for me in practice? Give one example.\n3. What questions should I ask the other party, or a lawyer, about it?\n\u003c/code>\u003c/pre>\n\u003cp>AI can help you spot what to ask. It can&#39;t confirm that a contract is fair or enforceable where you live. For anything with real stakes, like a dispute, a large contract or an immigration matter, talk to a qualified lawyer. Many areas have free or low-cost legal aid services.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Money: think it through, then check\u003c/h2>\n\u003cpre>\u003ccode>Help me think through a money decision. Don&#39;t tell me what to do.\nMy situation: [E.G. &quot;I HAVE SOME SAVINGS AND A CREDIT CARD BALANCE\nWITH A HIGH INTEREST RATE&quot;]. Options I&#39;m considering: [OPTIONS].\nExplain the trade-offs of each in plain English, the questions I should\nask myself, and what I should confirm with my bank or a professional.\n\u003c/code>\u003c/pre>\n\u003cp>Asking for trade-offs instead of a verdict keeps you in charge. Check any numbers with a calculator, and confirm current rates, fees and tax rules with official sources.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Protect your privacy\u003c/h2>\n\u003cp>Strip out names, dates of birth, addresses, account numbers, policy numbers and medical record numbers before you paste anything. &quot;A 45-year-old with type 2 diabetes&quot; is all the AI needs, not your patient ID.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Find a document with confusing language: an insurance policy, a bill, a lease or a benefits letter.\u003c/li>\n\u003cli>Remove personal details, then paste a short section and ask: &quot;Explain this in plain English, and list three questions I should ask about it.&quot;\u003c/li>\n\u003cli>Decide which traffic light each of your follow-up questions falls under, and where you&#39;d verify the yellow ones.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Asking for a verdict instead of understanding.\u003c/strong> &quot;Should I sign this?&quot; is red. &quot;What does this clause mean, and what should I ask?&quot; is green.\u003c/li>\n\u003cli>\u003cstrong>Leaving out your location.\u003c/strong> Rules vary widely. Always say where you are.\u003c/li>\n\u003cli>\u003cstrong>Sharing identifying details.\u003c/strong> Anonymize first.\u003c/li>\n\u003cli>\u003cstrong>Treating reassurance as the all-clear.\u003c/strong> If something feels wrong with your health, money or legal situation, a professional opinion beats a reassuring paragraph.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Use AI to understand, organize and prepare. That&#39;s its safest and most valuable role here.\u003c/li>\n\u003cli>Follow the traffic lights: green means go, yellow means verify, red means see a professional.\u003c/li>\n\u003cli>Always include your location, and always remove identifying details.\u003c/li>\n\u003cli>In an emergency, contact emergency services, never an AI.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Sooner or later you'll want to ask AI about something serious: a symptom, a confusing clause in a lease, whether to pay off debt or save. AI can be genuinely helpful here. It can explain jargon, help you organize your thoughts and prepare you for a much better conversation with a professional. It can also be confidently wrong in ways that matter. This lesson gives you a simple system for getting the benefits safely. Emergencies first: if you or someone else might be in danger, or there are symptoms like chest pain, difficulty breathing or signs of a stroke, contact emergency services right away. Don't ask an AI. Why these topics are different With everyday tasks, a mistake costs you a rewrite. Here, a mistake can cost your health, your money or your legal rights. Three reasons to be extra careful: AI can't see your full situation. A doctor examines you, a lawyer reads your documents, and a financial advisor knows your whole picture. AI only knows what you typed. Rules depend on where you live. Laws, taxes, benefits and medical guidelines vary by country, state and even city, and AI may blend them together. It tends to reassure. Assistants are built to be helpful and agreeable, so they can lean toward telling you what you hope to hear. The traffic-light system Light What AI helps with Your move 🟢 Green Explaining terms, summarizing documents, preparing questions Go ahead 🟡 Yellow General guidance, typical options, how a process usually works Verify with an official source 🔴 Red Diagnosis, medication changes, legal strategy, big money decisions Prepare with AI, decide with a professional The safest and most valuable use of AI on serious topics is green: understanding and preparing. Health: prepare for your appointment I have a doctor's appointment about [SYMPTOM OR CONDITION]. Help me prepare. Don't diagnose me. 1. Organize my notes into a clear summary I can share: [WHEN IT STARTED, HOW OFTEN IT HAPPENS, WHAT HELPS OR MAKES IT WORSE, CURRENT MEDICATIONS] 2. Suggest questions I should ask. 3. Explain any terms I might hear, in plain English. You walk in organized and walk out with your questions answered. It's also useful afterwards: paste your visit notes and ask, \"Explain this in plain English. What should I ask at my follow-up?\" Legal: understand before you sign Here's a clause from my [LEASE / CONTRACT / TERMS], with names and addresses removed: [PASTE CLAUSE]. I'm in [STATE OR COUNTRY]. 1. Explain what it means in plain English. 2. What could it mean for me in practice? Give one example. 3. What questions should I ask the other party, or a lawyer, about it? AI can help you spot what to ask. It can't confirm that a contract is fair or enforceable where you live. For anything with real stakes, like a dispute, a large contract or an immigration matter, talk to a qualified lawyer. Many areas have free or low-cost legal aid services. Money: think it through, then check Help me think through a money decision. Don't tell me what to do. My situation: [E.G. \"I HAVE SOME SAVINGS AND A CREDIT CARD BALANCE WITH A HIGH INTEREST RATE\"]. Options I'm considering: [OPTIONS]. Explain the trade-offs of each in plain English, the questions I should ask myself, and what I should confirm with my bank or a professional. Asking for trade-offs instead of a verdict keeps you in charge. Check any numbers with a calculator, and confirm current rates, fees and tax rules with official sources. Protect your privacy Strip out names, dates of birth, addresses, account numbers, policy numbers and medical record numbers before you paste anything. \"A 45-year-old with type 2 diabetes\" is all the AI needs, not your patient ID. Try it now Find a document with confusing language: an insurance policy, a bill, a lease or a benefits letter. Remove personal details, then paste a short section and ask: \"Explain this in plain English, and list three questions I should ask about it.\" Decide which traffic light each of your follow-up questions falls under, and where you'd verify the yellow ones. Common mistakes Asking for a verdict instead of understanding. \"Should I sign this?\" is red. \"What does this clause mean, and what should I ask?\" is green. Leaving out your location. Rules vary widely. Always say where you are. Sharing identifying details. Anonymize first. Treating reassurance as the all-clear. If something feels wrong with your health, money or legal situation, a professional opinion beats a reassuring paragraph. Key takeaways Use AI to understand, organize and prepare. That's its safest and most valuable role here. Follow the traffic lights: green means go, yellow means verify, red means see a professional. Always include your location, and always remove identifying details. In an emergency, contact emergency services, never an AI.","blocks":[{"lang":"","text":"I have a doctor's appointment about [SYMPTOM OR CONDITION]. Help me\nprepare. Don't diagnose me.\n1. Organize my notes into a clear summary I can share: [WHEN IT STARTED,\n   HOW OFTEN IT HAPPENS, WHAT HELPS OR MAKES IT WORSE, CURRENT MEDICATIONS]\n2. Suggest questions I should ask.\n3. Explain any terms I might hear, in plain English."},{"lang":"","text":"Here's a clause from my [LEASE / CONTRACT / TERMS], with names and\naddresses removed: [PASTE CLAUSE]. I'm in [STATE OR COUNTRY].\n1. Explain what it means in plain English.\n2. What could it mean for me in practice? Give one example.\n3. What questions should I ask the other party, or a lawyer, about it?"},{"lang":"","text":"Help me think through a money decision. Don't tell me what to do.\nMy situation: [E.G. \"I HAVE SOME SAVINGS AND A CREDIT CARD BALANCE\nWITH A HIGH INTEREST RATE\"]. Options I'm considering: [OPTIONS].\nExplain the trade-offs of each in plain English, the questions I should\nask myself, and what I should confirm with my bank or a professional."}],"quiz":[{"q":"In the traffic-light system, what is the safest and most valuable way to use AI on health, legal and money topics?","options":["Getting a diagnosis or legal strategy you can act on right away","Understanding terms and preparing better questions for a professional","Confirming whether a contract is fair and enforceable where you live","Getting reassurance before deciding whether to see a professional"],"answer":1,"explain":"Explaining terms, summarizing documents and preparing questions are green-light uses. Diagnosis, legal strategy and big money decisions are red: prepare with AI, then decide with a professional."},{"q":"You're about to sign a lease and one clause confuses you. Which question to your AI assistant best follows the lesson's advice?","options":["\"Should I sign this lease, yes or no?\"","\"Is this clause fair and enforceable everywhere?\"","\"Can you reassure me this clause is standard?\"","\"What does this clause mean, and what should I ask?\""],"answer":3,"explain":"Asking for a verdict like \"Should I sign this?\" is red, while asking what a clause means and what to ask is green. AI can help you spot what to ask, but it can't confirm a contract is fair or enforceable where you live."},{"q":"You want AI to help you prepare for a doctor's appointment. What should you do before pasting your notes?","options":["Remove names, birth dates and record numbers, keeping only the details needed","Include your patient ID so the AI can match your notes to your records","Ask the AI to diagnose you first so you know what the doctor will say","Leave out where you live so the answer stays as general as possible"],"answer":0,"explain":"The lesson says to strip out identifying details such as names, dates of birth and medical record numbers; \"a 45-year-old with type 2 diabetes\" is all the AI needs. You should also include your location and ask it not to diagnose you."}],"videoUrl":null},{"n":11,"slug":"writing-and-editing","title":"Write and Edit Better (Without Sounding Like a Robot)","summary":"Use AI as an editor and writing partner for reports, posts and documents, while keeping your own voice and judgment.","durationMin":11,"module":4,"moduleTitle":"AI for Work & Productivity","html":"\u003csection class=\"sec sec-intro\">\u003cp>You&#39;ve probably read text that was obviously written by AI: smooth, vague, oddly enthusiastic, and full of words like &quot;delve&quot; and &quot;elevate.&quot; That&#39;s what happens when people hand AI the whole job. In this lesson you&#39;ll learn the opposite approach: using AI as a sharp editor and writing partner, so your writing gets clearer and faster while still sounding like you.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Editor, not ghostwriter\u003c/h2>\n\u003cp>There are two ways to write with AI:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Ghostwriter:\u003c/strong> &quot;Write a report about X.&quot; You get generic text that needs heavy rewriting and doesn&#39;t sound like you.\u003c/li>\n\u003cli>\u003cstrong>Editor and partner:\u003c/strong> you bring the ideas and a rough draft, and AI helps you structure, tighten and polish.\u003c/li>\n\u003c/ul>\n\u003cp>The second approach is faster overall and produces better writing, because the substance, the specifics and the voice all come from you.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Start with structure\u003c/h2>\n\u003cp>Staring at a blank page? Don&#39;t ask for the finished piece. Ask for an outline built from your own thoughts:\u003c/p>\n\u003cpre>\u003ccode>I need to write a [TYPE OF DOCUMENT] for [AUDIENCE] about [TOPIC].\nMy main point is [MAIN POINT]. Here are my rough thoughts: [NOTES].\nSuggest a clear outline with section headings and one line on what each\nsection should cover. Don&#39;t write the full piece yet.\n\u003c/code>\u003c/pre>\n\u003cp>Adjust the outline until it&#39;s right. Then write each section yourself, or draft it together one section at a time.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Edit with specific instructions\u003c/h2>\n\u003cp>&quot;Improve this&quot; gets random changes. Specific instructions get useful edits:\u003c/p>\n\u003cpre>\u003ccode>Edit the text below for clarity and flow. Keep my voice and all of my\nkey points. Don&#39;t add new ideas or facts. Then list the 5 most\nimportant changes you made and why, so I can learn from them.\n\n[PASTE YOUR DRAFT]\n\u003c/code>\u003c/pre>\n\u003cp>Asking for the reasons behind each change makes you a better writer over time, and makes it easy to reject edits you disagree with.\u003c/p>\n\u003cp>Other focused edits that work well:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>&quot;Cut this by 30 percent without losing any key points.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Give me 3 stronger options for the opening sentence.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Find anything vague or unsupported, and ask me for the specifics.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Rewrite this for a reader with no background in the topic.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Check spelling, grammar and consistency only. Don&#39;t change my style.&quot;\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Keep your voice\u003c/h2>\n\u003cp>AI has a default style. To override it, show it yours:\u003c/p>\n\u003cpre>\u003ccode>Here are two samples of my writing: [SAMPLE 1] [SAMPLE 2]\nDescribe my writing style in 5 bullet points: tone, sentence length,\nvocabulary and structure. Then edit the draft below to match it.\n\n[YOUR DRAFT]\n\u003c/code>\u003c/pre>\n\u003cp>Save the style description it gives you. You can paste it into future prompts or your personal instructions.\u003c/p>\n\u003cp>It also helps to ban the giveaways:\u003c/p>\n\u003cpre>\u003ccode>Avoid buzzwords and filler such as &quot;delve,&quot; &quot;elevate,&quot; &quot;unlock,&quot;\n&quot;in today&#39;s fast-paced world&quot; and &quot;it&#39;s important to note.&quot;\nUse short, concrete sentences.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example: a neighborhood newsletter\u003c/h2>\n\u003cp>Say you volunteer for your neighborhood association and write a monthly update. Your notes: road repairs start on the 14th, the park cleanup needs ten more volunteers, dues are due by the end of the month, and thank you to everyone who came to the picnic.\u003c/p>\n\u003col>\n\u003cli>Ask for an outline in a warm, neighborly tone.\u003c/li>\n\u003cli>Paste last month&#39;s newsletter so it can match the style.\u003c/li>\n\u003cli>Draft it, then ask: &quot;What would a busy neighbor skim past? Make the volunteer request impossible to miss.&quot;\u003c/li>\n\u003cli>Read it aloud, fix anything that doesn&#39;t sound like you, and check every date.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Be honest about AI help\u003c/h2>\n\u003cp>Norms are still settling. Plenty of people use AI to help edit without mentioning it, much like spellcheck. But some workplaces, schools and publications have specific rules about AI-assisted writing, so know what&#39;s expected. When words are presented as personally yours, like a heartfelt letter, a personal statement or a reference, write the heart of it yourself.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Take something you&#39;ve written recently: an email, a post or a section of a report.\u003c/li>\n\u003cli>Run the &quot;edit for clarity, then list your changes&quot; prompt.\u003c/li>\n\u003cli>Accept the edits you agree with, reject the rest, and note one writing habit you learned.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Letting AI invent facts.\u003c/strong> Tell it &quot;Don&#39;t add facts I didn&#39;t give you,&quot; then check anyway.\u003c/li>\n\u003cli>\u003cstrong>Accepting every edit.\u003c/strong> You&#39;re the author. Push back on changes that lose your meaning.\u003c/li>\n\u003cli>\u003cstrong>Publishing the first draft.\u003c/strong> AI drafts need a human pass for accuracy, voice and specifics.\u003c/li>\n\u003cli>\u003cstrong>Generic instructions.\u003c/strong> &quot;Make it better&quot; leads to bland. Say exactly what better means.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Use AI as an editor and partner, not a ghostwriter. You bring the ideas and the draft.\u003c/li>\n\u003cli>Start with an outline built from your own thoughts.\u003c/li>\n\u003cli>Give specific editing instructions and ask AI to explain its changes.\u003c/li>\n\u003cli>Protect your voice with samples, a style description and a list of banned phrases.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"You've probably read text that was obviously written by AI: smooth, vague, oddly enthusiastic, and full of words like \"delve\" and \"elevate.\" That's what happens when people hand AI the whole job. In this lesson you'll learn the opposite approach: using AI as a sharp editor and writing partner, so your writing gets clearer and faster while still sounding like you. Editor, not ghostwriter There are two ways to write with AI: Ghostwriter: \"Write a report about X.\" You get generic text that needs heavy rewriting and doesn't sound like you. Editor and partner: you bring the ideas and a rough draft, and AI helps you structure, tighten and polish. The second approach is faster overall and produces better writing, because the substance, the specifics and the voice all come from you. Start with structure Staring at a blank page? Don't ask for the finished piece. Ask for an outline built from your own thoughts: I need to write a [TYPE OF DOCUMENT] for [AUDIENCE] about [TOPIC]. My main point is [MAIN POINT]. Here are my rough thoughts: [NOTES]. Suggest a clear outline with section headings and one line on what each section should cover. Don't write the full piece yet. Adjust the outline until it's right. Then write each section yourself, or draft it together one section at a time. Edit with specific instructions \"Improve this\" gets random changes. Specific instructions get useful edits: Edit the text below for clarity and flow. Keep my voice and all of my key points. Don't add new ideas or facts. Then list the 5 most important changes you made and why, so I can learn from them. [PASTE YOUR DRAFT] Asking for the reasons behind each change makes you a better writer over time, and makes it easy to reject edits you disagree with. Other focused edits that work well: \"Cut this by 30 percent without losing any key points.\" \"Give me 3 stronger options for the opening sentence.\" \"Find anything vague or unsupported, and ask me for the specifics.\" \"Rewrite this for a reader with no background in the topic.\" \"Check spelling, grammar and consistency only. Don't change my style.\" Keep your voice AI has a default style. To override it, show it yours: Here are two samples of my writing: [SAMPLE 1] [SAMPLE 2] Describe my writing style in 5 bullet points: tone, sentence length, vocabulary and structure. Then edit the draft below to match it. [YOUR DRAFT] Save the style description it gives you. You can paste it into future prompts or your personal instructions. It also helps to ban the giveaways: Avoid buzzwords and filler such as \"delve,\" \"elevate,\" \"unlock,\" \"in today's fast-paced world\" and \"it's important to note.\" Use short, concrete sentences. Worked example: a neighborhood newsletter Say you volunteer for your neighborhood association and write a monthly update. Your notes: road repairs start on the 14th, the park cleanup needs ten more volunteers, dues are due by the end of the month, and thank you to everyone who came to the picnic. Ask for an outline in a warm, neighborly tone. Paste last month's newsletter so it can match the style. Draft it, then ask: \"What would a busy neighbor skim past? Make the volunteer request impossible to miss.\" Read it aloud, fix anything that doesn't sound like you, and check every date. Be honest about AI help Norms are still settling. Plenty of people use AI to help edit without mentioning it, much like spellcheck. But some workplaces, schools and publications have specific rules about AI-assisted writing, so know what's expected. When words are presented as personally yours, like a heartfelt letter, a personal statement or a reference, write the heart of it yourself. Try it now Take something you've written recently: an email, a post or a section of a report. Run the \"edit for clarity, then list your changes\" prompt. Accept the edits you agree with, reject the rest, and note one writing habit you learned. Common mistakes Letting AI invent facts. Tell it \"Don't add facts I didn't give you,\" then check anyway. Accepting every edit. You're the author. Push back on changes that lose your meaning. Publishing the first draft. AI drafts need a human pass for accuracy, voice and specifics. Generic instructions. \"Make it better\" leads to bland. Say exactly what better means. Key takeaways Use AI as an editor and partner, not a ghostwriter. You bring the ideas and the draft. Start with an outline built from your own thoughts. Give specific editing instructions and ask AI to explain its changes. Protect your voice with samples, a style description and a list of banned phrases.","blocks":[{"lang":"","text":"I need to write a [TYPE OF DOCUMENT] for [AUDIENCE] about [TOPIC].\nMy main point is [MAIN POINT]. Here are my rough thoughts: [NOTES].\nSuggest a clear outline with section headings and one line on what each\nsection should cover. Don't write the full piece yet."},{"lang":"","text":"Edit the text below for clarity and flow. Keep my voice and all of my\nkey points. Don't add new ideas or facts. Then list the 5 most\nimportant changes you made and why, so I can learn from them.\n\n[PASTE YOUR DRAFT]"},{"lang":"","text":"Here are two samples of my writing: [SAMPLE 1] [SAMPLE 2]\nDescribe my writing style in 5 bullet points: tone, sentence length,\nvocabulary and structure. Then edit the draft below to match it.\n\n[YOUR DRAFT]"},{"lang":"","text":"Avoid buzzwords and filler such as \"delve,\" \"elevate,\" \"unlock,\"\n\"in today's fast-paced world\" and \"it's important to note.\"\nUse short, concrete sentences."}],"quiz":[{"q":"What is the difference between using AI as a ghostwriter and using it as an editor?","options":["A ghostwriter keeps your voice, while an editor replaces it with its own","An editor writes the whole piece, while a ghostwriter only fixes spelling","As an editor, AI polishes your own ideas and draft instead of writing it all","There's no real difference, as long as you check the final result"],"answer":2,"explain":"With the editor approach, you bring the ideas and a rough draft, and AI helps you structure, tighten and polish. It's faster overall and better, because the substance, specifics and voice come from you."},{"q":"You want AI to improve a draft report and also help you become a better writer. Which instruction works best?","options":["Edit for clarity and flow, keep my voice, then list the main changes and why","Improve this so it sounds more professional and impressive to readers","Rewrite this from scratch in the best possible style you can manage","Make it better, and add any facts that would make it more convincing"],"answer":0,"explain":"Specific instructions get useful edits, while \"improve this\" gets random changes. Asking for the reasons behind each change helps you learn and makes it easy to reject edits you disagree with."},{"q":"AI's edits keep making your writing sound generic and not like you. What should you do?","options":["Accept the edits, since the AI's default style reads as more polished","Ask it to make the whole text more enthusiastic and exciting to read","Let the AI write the full draft from scratch next time instead","Share samples of your writing and ban buzzwords like \"delve\""],"answer":3,"explain":"AI has a default style, and you override it by showing it yours with writing samples and a style description. Banning giveaway phrases and asking for short, concrete sentences also helps."}],"videoUrl":null},{"n":12,"slug":"research-and-summaries","title":"Research and Summarize Documents You Can Trust","summary":"Get accurate summaries of long documents, pull out what matters, and research questions without falling for made-up sources.","durationMin":12,"module":4,"moduleTitle":"AI for Work & Productivity","html":"\u003csection class=\"sec sec-intro\">\u003cp>The 40-page report you&#39;re meant to read before Thursday. The meeting transcript nobody wants to go through. Three insurance quotes that use different words for the same thing. Summarizing and comparing documents is one of AI&#39;s most practical superpowers and, with the right technique, one of its most reliable.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Why documents are a sweet spot\u003c/h2>\n\u003cp>Remember the risk ladder from Module 1: AI is most reliable when it works from \u003cstrong>text you provide\u003c/strong>, and least reliable when it relies on memory. When you paste or upload a document, the source is right in front of it. That doesn&#39;t make it perfect, but it makes it far more trustworthy, especially if you ask it to show its work.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Summaries that actually help\u003c/h2>\n\u003cp>&quot;Summarize this&quot; gets you a generic summary. A summary with a \u003cstrong>purpose\u003c/strong> gets you what you need:\u003c/p>\n\u003cpre>\u003ccode>Summarize the document below for [WHO, E.G. &quot;ME, A BUSY PARENT&quot;].\nI need to know [YOUR PURPOSE, E.G. &quot;WHAT CHANGES FOR OUR FAMILY AND\nWHAT WE NEED TO DO&quot;].\n\nGive me:\n1. The 3-5 key points, in plain English\n2. Anything I need to do, with deadlines\n3. Anything surprising, unusual or easy to miss\n\n[PASTE OR ATTACH THE DOCUMENT]\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Ask it to show its evidence\u003c/h2>\n\u003cp>This is the single best habit for trustworthy summaries. Add it to any summary prompt:\u003c/p>\n\u003cpre>\u003ccode>For each key point, include a short direct quote from the document that\nsupports it. If something isn&#39;t in the document, say &quot;not in the\ndocument&quot; rather than guessing.\n\u003c/code>\u003c/pre>\n\u003cp>Quotes let you check any point in seconds by searching for them in the original. If a quote isn&#39;t there, you&#39;ve caught a problem.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Questions to ask any document\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>&quot;What does this say about [TOPIC]? Quote the relevant parts.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;What questions does this document leave unanswered?&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;Explain the section on [TOPIC] as if I&#39;m new to the subject.&quot;\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>&quot;List every date, deadline and dollar amount mentioned.&quot;\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Comparing documents\u003c/h2>\n\u003cpre>\u003ccode>Compare these [QUOTES / OFFERS / POLICIES] in a table with these rows:\n[PRICE, WHAT&#39;S INCLUDED, EXCLUSIONS, CANCELLATION TERMS, ANYTHING\nUNUSUAL]. Use only information in the documents and mark anything not\nmentioned as &quot;not stated.&quot; Then list questions I should ask each provider.\n\u003c/code>\u003c/pre>\n\u003cp>&quot;Not stated&quot; is important. It stops the AI filling gaps with assumptions, and it shows you exactly what to ask about.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Meeting notes and transcripts\u003c/h2>\n\u003cpre>\u003ccode>Here are notes from a meeting: [PASTE NOTES OR TRANSCRIPT]\nPull out the decisions made, the action items (who, what and by when),\nopen questions, and anything discussed but not resolved.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Researching questions, not just documents\u003c/h2>\n\u003cp>When there&#39;s no document and you&#39;re asking AI to find information, the risk goes up. Three habits help:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Use web search when it matters.\u003c/strong> If your assistant can search the web, ask it to for anything recent or specific, and to include links.\u003c/li>\n\u003cli>\u003cstrong>Open the sources.\u003c/strong> Check that each link works and actually says what the AI claims. Prefer original sources, like official sites or the original study, over someone else&#39;s summary.\u003c/li>\n\u003cli>\u003cstrong>Ask for disagreement.\u003c/strong> &quot;What do critics or experts who disagree say?&quot; helps you avoid a one-sided picture.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Know the limits\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Length.\u003c/strong> Very long documents can exceed what your assistant reads at once. If it seems to miss later sections, split the document and summarize it in parts.\u003c/li>\n\u003cli>\u003cstrong>Scans and photos\u003c/strong> may be read imperfectly. Spot-check the numbers.\u003c/li>\n\u003cli>\u003cstrong>Confidentiality.\u003c/strong> Don&#39;t upload confidential work documents, or files full of personal data, unless your assistant&#39;s settings and your organization&#39;s policies allow it.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Pick a real document: some terms and conditions, a school newsletter, an article you&#39;ve been meaning to read, or a work report you&#39;re allowed to share.\u003c/li>\n\u003cli>Use the purpose-driven summary prompt, plus the &quot;include a supporting quote&quot; instruction.\u003c/li>\n\u003cli>Spot-check two of the quotes against the original. Did they match?\u003c/li>\n\u003cli>Ask: &quot;What questions does this document leave unanswered?&quot;\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Summaries without a purpose.\u003c/strong> Say who the summary is for and what you need to decide or do.\u003c/li>\n\u003cli>\u003cstrong>Never checking.\u003c/strong> Spot-checking two or three quotes takes a minute and catches most problems.\u003c/li>\n\u003cli>\u003cstrong>Treating cited sources as verified.\u003c/strong> Open them, every time it matters.\u003c/li>\n\u003cli>\u003cstrong>Uploading what you shouldn&#39;t.\u003c/strong> When in doubt, remove sensitive details first.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>AI is most reliable when it works from text you provide.\u003c/li>\n\u003cli>Give every summary a purpose and a structure.\u003c/li>\n\u003cli>Ask for supporting quotes and &quot;not stated&quot; markers so you can verify quickly.\u003c/li>\n\u003cli>For open-ended research, use web search, open the sources and look for disagreement.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"The 40-page report you're meant to read before Thursday. The meeting transcript nobody wants to go through. Three insurance quotes that use different words for the same thing. Summarizing and comparing documents is one of AI's most practical superpowers and, with the right technique, one of its most reliable. Why documents are a sweet spot Remember the risk ladder from Module 1: AI is most reliable when it works from text you provide , and least reliable when it relies on memory. When you paste or upload a document, the source is right in front of it. That doesn't make it perfect, but it makes it far more trustworthy, especially if you ask it to show its work. Summaries that actually help \"Summarize this\" gets you a generic summary. A summary with a purpose gets you what you need: Summarize the document below for [WHO, E.G. \"ME, A BUSY PARENT\"]. I need to know [YOUR PURPOSE, E.G. \"WHAT CHANGES FOR OUR FAMILY AND WHAT WE NEED TO DO\"]. Give me: 1. The 3-5 key points, in plain English 2. Anything I need to do, with deadlines 3. Anything surprising, unusual or easy to miss [PASTE OR ATTACH THE DOCUMENT] Ask it to show its evidence This is the single best habit for trustworthy summaries. Add it to any summary prompt: For each key point, include a short direct quote from the document that supports it. If something isn't in the document, say \"not in the document\" rather than guessing. Quotes let you check any point in seconds by searching for them in the original. If a quote isn't there, you've caught a problem. Questions to ask any document \"What does this say about [TOPIC]? Quote the relevant parts.\" \"What questions does this document leave unanswered?\" \"Explain the section on [TOPIC] as if I'm new to the subject.\" \"List every date, deadline and dollar amount mentioned.\" Comparing documents Compare these [QUOTES / OFFERS / POLICIES] in a table with these rows: [PRICE, WHAT'S INCLUDED, EXCLUSIONS, CANCELLATION TERMS, ANYTHING UNUSUAL]. Use only information in the documents and mark anything not mentioned as \"not stated.\" Then list questions I should ask each provider. \"Not stated\" is important. It stops the AI filling gaps with assumptions, and it shows you exactly what to ask about. Meeting notes and transcripts Here are notes from a meeting: [PASTE NOTES OR TRANSCRIPT] Pull out the decisions made, the action items (who, what and by when), open questions, and anything discussed but not resolved. Researching questions, not just documents When there's no document and you're asking AI to find information, the risk goes up. Three habits help: Use web search when it matters. If your assistant can search the web, ask it to for anything recent or specific, and to include links. Open the sources. Check that each link works and actually says what the AI claims. Prefer original sources, like official sites or the original study, over someone else's summary. Ask for disagreement. \"What do critics or experts who disagree say?\" helps you avoid a one-sided picture. Know the limits Length. Very long documents can exceed what your assistant reads at once. If it seems to miss later sections, split the document and summarize it in parts. Scans and photos may be read imperfectly. Spot-check the numbers. Confidentiality. Don't upload confidential work documents, or files full of personal data, unless your assistant's settings and your organization's policies allow it. Try it now Pick a real document: some terms and conditions, a school newsletter, an article you've been meaning to read, or a work report you're allowed to share. Use the purpose-driven summary prompt, plus the \"include a supporting quote\" instruction. Spot-check two of the quotes against the original. Did they match? Ask: \"What questions does this document leave unanswered?\" Common mistakes Summaries without a purpose. Say who the summary is for and what you need to decide or do. Never checking. Spot-checking two or three quotes takes a minute and catches most problems. Treating cited sources as verified. Open them, every time it matters. Uploading what you shouldn't. When in doubt, remove sensitive details first. Key takeaways AI is most reliable when it works from text you provide. Give every summary a purpose and a structure. Ask for supporting quotes and \"not stated\" markers so you can verify quickly. For open-ended research, use web search, open the sources and look for disagreement.","blocks":[{"lang":"","text":"Summarize the document below for [WHO, E.G. \"ME, A BUSY PARENT\"].\nI need to know [YOUR PURPOSE, E.G. \"WHAT CHANGES FOR OUR FAMILY AND\nWHAT WE NEED TO DO\"].\n\nGive me:\n1. The 3-5 key points, in plain English\n2. Anything I need to do, with deadlines\n3. Anything surprising, unusual or easy to miss\n\n[PASTE OR ATTACH THE DOCUMENT]"},{"lang":"","text":"For each key point, include a short direct quote from the document that\nsupports it. If something isn't in the document, say \"not in the\ndocument\" rather than guessing."},{"lang":"","text":"Compare these [QUOTES / OFFERS / POLICIES] in a table with these rows:\n[PRICE, WHAT'S INCLUDED, EXCLUSIONS, CANCELLATION TERMS, ANYTHING\nUNUSUAL]. Use only information in the documents and mark anything not\nmentioned as \"not stated.\" Then list questions I should ask each provider."},{"lang":"","text":"Here are notes from a meeting: [PASTE NOTES OR TRANSCRIPT]\nPull out the decisions made, the action items (who, what and by when),\nopen questions, and anything discussed but not resolved."}],"quiz":[{"q":"Why is summarizing a document you provide a \"sweet spot\" for AI?","options":["AI can't make mistakes when it reads a document you paste in","AI remembers every document it was trained on, word for word","Documents are always short enough for AI to read in one go","AI is most reliable when it works from text right in front of it"],"answer":3,"explain":"AI is most reliable when it works from text you provide, and least reliable when it relies on memory. That doesn't make it perfect, but asking it to show its work makes it far more trustworthy."},{"q":"You want a summary of a long policy document that you can check quickly. What should you add to your prompt?","options":["A request to keep the whole summary to one short paragraph","A request for a short direct quote supporting each key point","A request to fill any gaps with its best guess, so nothing is missing","A request to say how confident it feels about the summary overall"],"answer":1,"explain":"Supporting quotes let you check any point in seconds by searching for them in the original. Asking it to say \"not in the document\" rather than guessing stops it filling gaps."},{"q":"You ask AI a research question and it answers with three source links. What should you do before relying on the answer?","options":["Trust it, since an answer that includes links is already verified","Ask the AI if it's sure, and accept the answer if it says yes","Open each link and check that it says what the AI claims","Find a news summary of the topic instead of the original source"],"answer":2,"explain":"Treating cited sources as verified is a common mistake. Open each source, check that it works and says what the AI claims, and prefer original sources like official sites or the original study."}],"videoUrl":null},{"n":13,"slug":"decisions-and-brainstorming","title":"Better Decisions and Brainstorming","summary":"Use AI to generate more ideas, see your blind spots and weigh options clearly, while keeping the final call firmly yours.","durationMin":11,"module":4,"moduleTitle":"AI for Work & Productivity","html":"\u003csection class=\"sec sec-intro\">\u003cp>Some of the best uses of AI don&#39;t produce anything you&#39;d send or publish. They produce better \u003cem>thinking\u003c/em>. Stuck for ideas? AI can give you twenty in a minute. Torn between two options? It can help you see trade-offs you&#39;ve been too close to notice. In this lesson you&#39;ll learn to use AI as a thinking partner: creative, honest, and never the one making the decision.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Brainstorming: go wide, then narrow\u003c/h2>\n\u003cp>Good brainstorming has two phases: \u003cstrong>diverge\u003c/strong> (lots of ideas, no judging) and \u003cstrong>converge\u003c/strong> (pick the best). AI is brilliant at the first and helpful with the second.\u003c/p>\n\u003cpre>\u003ccode>I need ideas for [GOAL]. Context: [WHO IT&#39;S FOR, CONSTRAINTS, BUDGET,\nAND WHAT I&#39;VE ALREADY TRIED OR RULED OUT].\nGive me 20 ideas: some safe, some unusual, and a few that seem almost\ntoo bold. One line each.\n\u003c/code>\u003c/pre>\n\u003cp>Then narrow it down:\u003c/p>\n\u003cpre>\u003ccode>From that list, pick the 5 that best fit my constraints. For each one,\ngive the biggest advantage, the biggest risk and a cheap way to test it.\n\u003c/code>\u003c/pre>\n\u003cp>Tips for better brainstorms:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Ask for quantity.\u003c/strong> The first few ideas are usually the obvious ones. The interesting ones come later in the list.\u003c/li>\n\u003cli>\u003cstrong>Push the edges.\u003c/strong> &quot;What would a [DIFFERENT PROFESSION] suggest?&quot; or &quot;What would this look like with half the budget?&quot;\u003c/li>\n\u003cli>\u003cstrong>Combine.\u003c/strong> &quot;Merge ideas 3 and 11 into something new.&quot;\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Decisions: structure beats agonizing\u003c/h2>\n\u003cp>When you&#39;re stuck on a decision, it&#39;s often because the options are tangled up in your head. AI helps you untangle them.\u003c/p>\n\u003ch3>The weighted comparison\u003c/h3>\n\u003cpre>\u003ccode>Help me decide between [OPTION A] and [OPTION B].\nWhat matters most to me, in order: [CRITERIA, E.G. COST, COMMUTE,\nGROWTH, FAMILY TIME].\nCreate a table scoring each option 1-5 on each criterion, with a\none-line reason for each score. Then tell me which option comes out\nahead, and what would have to be true for the other one to be better.\n\u003c/code>\u003c/pre>\n\u003cp>The last question is the powerful part. It shows you which assumptions the decision really hinges on.\u003c/p>\n\u003ch3>The pre-mortem\u003c/h3>\n\u003cpre>\u003ccode>I&#39;m planning to [DECISION]. Imagine it&#39;s one year from now and this\nturned out to be a mistake. Give me the 5 most likely reasons it went\nwrong, and for each, one thing I could do now to prevent it.\n\u003c/code>\u003c/pre>\n\u003cp>Pre-mortems surface risks that optimism hides, without talking you out of a good idea.\u003c/p>\n\u003ch3>The honest challenger\u003c/h3>\n\u003cp>Remember that assistants tend to agree with you. Counter that on purpose:\u003c/p>\n\u003cpre>\u003ccode>Here&#39;s what I&#39;m leaning toward and why: [YOUR REASONING].\nPlay devil&#39;s advocate and give me the strongest honest case against it.\nDon&#39;t soften it. Then tell me which of my reasons hold up best.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example: should I take the new job?\u003c/h2>\n\u003cp>You&#39;ve been offered a role with higher pay and a longer commute. You list your criteria: income, time with family, growth and stress. The weighted comparison shows the options are closer than you thought. The new job wins on income and growth, and your current job wins on family time. Then the &quot;what would have to be true&quot; question reveals that the decision hinges on whether you could work from home two days a week.\u003c/p>\n\u003cp>That&#39;s not a question for AI. It&#39;s a question for the hiring manager, and now you know exactly what to ask. That&#39;s the ideal outcome: AI doesn&#39;t decide; it shows you \u003cstrong>what the decision really depends on.\u003c/strong>\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Know when to stop\u003c/h2>\n\u003cp>AI can generate pros and cons forever. If you&#39;ve done a comparison and a pre-mortem and still can&#39;t decide, the options may be genuinely close, and either could work out well. At that point, gather one more piece of real-world information, sleep on it, or talk it through with someone who knows you.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Pick a real decision you&#39;re weighing, big or small.\u003c/li>\n\u003cli>Run the weighted comparison prompt with your real criteria.\u003c/li>\n\u003cli>Run the pre-mortem on your leading option.\u003c/li>\n\u003cli>Write down the one question or fact the decision hinges on, and go and find the answer.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Asking &quot;What should I do?&quot;\u003c/strong> You&#39;ll get a generic answer. Ask for structure, trade-offs and blind spots instead.\u003c/li>\n\u003cli>\u003cstrong>Leading the witness.\u003c/strong> &quot;Isn&#39;t option A better?&quot; invites agreement. Ask neutrally, or ask for the counter-argument.\u003c/li>\n\u003cli>\u003cstrong>Stopping at the first five ideas.\u003c/strong> Quantity first, judgment second.\u003c/li>\n\u003cli>\u003cstrong>Outsourcing the decision.\u003c/strong> AI only knows what you value if you tell it, and it doesn&#39;t live with the consequences. You do.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Brainstorm in two phases: go wide with lots of ideas, then narrow with clear criteria.\u003c/li>\n\u003cli>A weighted comparison untangles options and shows what the decision hinges on.\u003c/li>\n\u003cli>Run a pre-mortem, and ask for the strongest case against your favorite option.\u003c/li>\n\u003cli>AI structures the thinking; you make the call.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Some of the best uses of AI don't produce anything you'd send or publish. They produce better thinking . Stuck for ideas? AI can give you twenty in a minute. Torn between two options? It can help you see trade-offs you've been too close to notice. In this lesson you'll learn to use AI as a thinking partner: creative, honest, and never the one making the decision. Brainstorming: go wide, then narrow Good brainstorming has two phases: diverge (lots of ideas, no judging) and converge (pick the best). AI is brilliant at the first and helpful with the second. I need ideas for [GOAL]. Context: [WHO IT'S FOR, CONSTRAINTS, BUDGET, AND WHAT I'VE ALREADY TRIED OR RULED OUT]. Give me 20 ideas: some safe, some unusual, and a few that seem almost too bold. One line each. Then narrow it down: From that list, pick the 5 that best fit my constraints. For each one, give the biggest advantage, the biggest risk and a cheap way to test it. Tips for better brainstorms: Ask for quantity. The first few ideas are usually the obvious ones. The interesting ones come later in the list. Push the edges. \"What would a [DIFFERENT PROFESSION] suggest?\" or \"What would this look like with half the budget?\" Combine. \"Merge ideas 3 and 11 into something new.\" Decisions: structure beats agonizing When you're stuck on a decision, it's often because the options are tangled up in your head. AI helps you untangle them. The weighted comparison Help me decide between [OPTION A] and [OPTION B]. What matters most to me, in order: [CRITERIA, E.G. COST, COMMUTE, GROWTH, FAMILY TIME]. Create a table scoring each option 1-5 on each criterion, with a one-line reason for each score. Then tell me which option comes out ahead, and what would have to be true for the other one to be better. The last question is the powerful part. It shows you which assumptions the decision really hinges on. The pre-mortem I'm planning to [DECISION]. Imagine it's one year from now and this turned out to be a mistake. Give me the 5 most likely reasons it went wrong, and for each, one thing I could do now to prevent it. Pre-mortems surface risks that optimism hides, without talking you out of a good idea. The honest challenger Remember that assistants tend to agree with you. Counter that on purpose: Here's what I'm leaning toward and why: [YOUR REASONING]. Play devil's advocate and give me the strongest honest case against it. Don't soften it. Then tell me which of my reasons hold up best. Worked example: should I take the new job? You've been offered a role with higher pay and a longer commute. You list your criteria: income, time with family, growth and stress. The weighted comparison shows the options are closer than you thought. The new job wins on income and growth, and your current job wins on family time. Then the \"what would have to be true\" question reveals that the decision hinges on whether you could work from home two days a week. That's not a question for AI. It's a question for the hiring manager, and now you know exactly what to ask. That's the ideal outcome: AI doesn't decide; it shows you what the decision really depends on. Know when to stop AI can generate pros and cons forever. If you've done a comparison and a pre-mortem and still can't decide, the options may be genuinely close, and either could work out well. At that point, gather one more piece of real-world information, sleep on it, or talk it through with someone who knows you. Try it now Pick a real decision you're weighing, big or small. Run the weighted comparison prompt with your real criteria. Run the pre-mortem on your leading option. Write down the one question or fact the decision hinges on, and go and find the answer. Common mistakes Asking \"What should I do?\" You'll get a generic answer. Ask for structure, trade-offs and blind spots instead. Leading the witness. \"Isn't option A better?\" invites agreement. Ask neutrally, or ask for the counter-argument. Stopping at the first five ideas. Quantity first, judgment second. Outsourcing the decision. AI only knows what you value if you tell it, and it doesn't live with the consequences. You do. Key takeaways Brainstorm in two phases: go wide with lots of ideas, then narrow with clear criteria. A weighted comparison untangles options and shows what the decision hinges on. Run a pre-mortem, and ask for the strongest case against your favorite option. AI structures the thinking; you make the call.","blocks":[{"lang":"","text":"I need ideas for [GOAL]. Context: [WHO IT'S FOR, CONSTRAINTS, BUDGET,\nAND WHAT I'VE ALREADY TRIED OR RULED OUT].\nGive me 20 ideas: some safe, some unusual, and a few that seem almost\ntoo bold. One line each."},{"lang":"","text":"From that list, pick the 5 that best fit my constraints. For each one,\ngive the biggest advantage, the biggest risk and a cheap way to test it."},{"lang":"","text":"Help me decide between [OPTION A] and [OPTION B].\nWhat matters most to me, in order: [CRITERIA, E.G. COST, COMMUTE,\nGROWTH, FAMILY TIME].\nCreate a table scoring each option 1-5 on each criterion, with a\none-line reason for each score. Then tell me which option comes out\nahead, and what would have to be true for the other one to be better."},{"lang":"","text":"I'm planning to [DECISION]. Imagine it's one year from now and this\nturned out to be a mistake. Give me the 5 most likely reasons it went\nwrong, and for each, one thing I could do now to prevent it."},{"lang":"","text":"Here's what I'm leaning toward and why: [YOUR REASONING].\nPlay devil's advocate and give me the strongest honest case against it.\nDon't soften it. Then tell me which of my reasons hold up best."}],"quiz":[{"q":"In a weighted comparison, why is it so useful to ask what would have to be true for the other option to be better?","options":["It reveals which assumptions the decision really hinges on","It lets the AI make the final choice so you don't have to","It guarantees that every score in the table is accurate","It makes the AI agree with the option you already prefer"],"answer":0,"explain":"That question shows which assumptions the decision depends on. In the job-offer example, it revealed that the choice hinged on working from home two days a week, which is a question for the hiring manager."},{"q":"You need ideas for a project, and the AI's first few suggestions feel obvious. What should you do?","options":["Pick the best of those first ideas, since early ideas are the strongest","Ask the AI which single idea it thinks you should go with","Ask for 20 ideas from safe to bold, then narrow them with your criteria","Judge each idea in detail as it arrives before asking for more"],"answer":2,"explain":"Good brainstorming goes wide first, then narrows. The first few ideas are usually the obvious ones and the interesting ones come later, so ask for quantity and then pick the best fits for your constraints."},{"q":"You're leaning toward a decision and want AI to stress-test it. Which prompt follows the lesson's advice?","options":["\"Isn't my option clearly the better choice here?\"","\"Give me the strongest honest case against my choice.\"","\"What should I do? Just tell me the right answer.\"","\"Confirm my reasoning so I can feel more confident.\""],"answer":1,"explain":"Assistants tend to agree with you, so the honest challenger asks for the strongest case against your choice. Leading questions invite agreement, and \"What should I do?\" gets a generic answer."}],"videoUrl":null},{"n":14,"slug":"voice-and-images","title":"Talk, Snap & Show: Voice and Image Features","summary":"Go beyond typing: talk through ideas hands-free, get help with photos and screenshots, and create images from a description.","durationMin":10,"module":4,"moduleTitle":"AI for Work & Productivity","html":"\u003csection class=\"sec sec-intro\">\u003cp>Typing isn&#39;t the only way to use AI anymore. Many assistants can listen and talk back, look at a photo you&#39;ve taken, and even create images from a description. That turns AI into something you can use while cooking, walking, or standing in front of a confusing parking sign. Features vary between assistants and plans, and they change quickly, so check what yours offers. The techniques below work wherever the features are available.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Voice: think out loud\u003c/h2>\n\u003cp>There are usually two kinds of voice feature:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Dictation:\u003c/strong> you speak and it types your words into the message box. Great for long, rambling context that would be tedious to type.\u003c/li>\n\u003cli>\u003cstrong>Voice conversation:\u003c/strong> a spoken back-and-forth, a bit like a phone call with your assistant.\u003c/li>\n\u003c/ul>\n\u003cp>Voice shines when your hands are busy or your thoughts are messy:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Brain dumps.\u003c/strong> Talk for two minutes about everything on your mind, then say, &quot;Turn that into an organized to-do list, grouped by priority.&quot;\u003c/li>\n\u003cli>\u003cstrong>Rehearsals.\u003c/strong> Practice a salary conversation, a difficult talk or a presentation out loud.\u003c/li>\n\u003cli>\u003cstrong>Language practice.\u003c/strong> Speaking practice with instant, patient feedback.\u003c/li>\n\u003cli>\u003cstrong>Hands-free help.\u003c/strong> &quot;How do I scale this recipe up for six people?&quot; while your hands are covered in flour.\u003c/li>\n\u003c/ul>\n\u003cp>Try this as a spoken prompt:\u003c/p>\n\u003cpre>\u003ccode>I want to practice asking my manager for [REQUEST]. You play my\nmanager. Be realistic and push back a little, the way a busy manager\nmight. When we finish, tell me what I did well and what to improve.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Images in: AI that can see\u003c/h2>\n\u003cp>Many assistants let you upload or snap a photo and ask about it. It&#39;s surprisingly useful:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Your fridge or pantry:\u003c/strong> &quot;What can I make for dinner with this in 30 minutes?&quot;\u003c/li>\n\u003cli>\u003cstrong>A confusing form:\u003c/strong> &quot;What is this asking for, and what do I need to fill in?&quot;\u003c/li>\n\u003cli>\u003cstrong>A screenshot of an error message:\u003c/strong> &quot;What does this mean, and how do I fix it? I&#39;m not technical.&quot;\u003c/li>\n\u003cli>\u003cstrong>A chart:\u003c/strong> &quot;What&#39;s the main takeaway here?&quot;\u003c/li>\n\u003cli>\u003cstrong>Handwritten notes or a whiteboard:\u003c/strong> &quot;Type this up and organize it into action items.&quot;\u003c/li>\n\u003c/ul>\n\u003cp>A good image prompt still uses the five parts. Add context and a clear task:\u003c/p>\n\u003cpre>\u003ccode>[ATTACH PHOTO] This is a letter I received about [TOPIC]. In plain\nEnglish: what is it about, do I need to do anything, and by when?\nFlag anything that looks unusual or like a possible scam.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Accuracy note:\u003c/strong> AI can misread blurry text, small numbers and handwriting. For anything important, like a medication label, a bill amount or a deadline, check against the original. Identifying plants, mushrooms, insects or skin conditions from a photo is a starting point only. \u003cstrong>Never eat a wild plant or mushroom based on an AI identification.\u003c/strong>\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Images out: creating pictures\u003c/h2>\n\u003cp>Some assistants can generate images from a description: a party invitation, an illustration for a presentation, a visual idea for your garden. Describe four things:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Subject:\u003c/strong> what&#39;s in the image.\u003c/li>\n\u003cli>\u003cstrong>Style:\u003c/strong> photo, watercolor, flat illustration or cartoon.\u003c/li>\n\u003cli>\u003cstrong>Composition and mood:\u003c/strong> close-up or wide, bright or moody, colors.\u003c/li>\n\u003cli>\u003cstrong>Use:\u003c/strong> for example, &quot;for a square social media post&quot; or &quot;for a printed flyer.&quot;\u003c/li>\n\u003c/ol>\n\u003cpre>\u003ccode>Create an image for a kids&#39; science birthday party invitation: a\nfriendly cartoon rocket and planets, bright colors, playful style,\nwith empty space at the top for text. Square format.\n\u003c/code>\u003c/pre>\n\u003cp>Image generators can still struggle with exact wording, so add any text yourself in a design or document app.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Privacy and respect\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Photos can show more than you meant to share:\u003c/strong> faces, addresses, license plates and paperwork in the background. Crop first.\u003c/li>\n\u003cli>\u003cstrong>Don&#39;t create images of real people\u003c/strong> in ways that could mislead or embarrass them. Many tools restrict this anyway, and it&#39;s a bad idea regardless.\u003c/li>\n\u003cli>\u003cstrong>Ask before uploading other people&#39;s photos.\u003c/strong> Your friend&#39;s face isn&#39;t yours to share.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Take a photo of something real: your fridge, a sign, or a confusing piece of mail with personal details covered.\u003c/li>\n\u003cli>Ask a specific question about it, with context and a clear task.\u003c/li>\n\u003cli>If your assistant has voice, try a two-minute spoken brain dump and ask it to organize your thoughts.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Assuming it read everything correctly.\u003c/strong> Check numbers, dates and small print against the original.\u003c/li>\n\u003cli>\u003cstrong>Uploading photos with sensitive details.\u003c/strong> Crop or cover them first.\u003c/li>\n\u003cli>\u003cstrong>Forgetting the question.\u003c/strong> A photo with no prompt gets a generic description. Say what you want to know.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Voice is perfect for brain dumps, rehearsals and hands-free help.\u003c/li>\n\u003cli>A photo plus a clear question makes forms, letters, labels and screenshots easy to understand.\u003c/li>\n\u003cli>Check anything important against the original, and never rely on AI to tell you what&#39;s safe to eat.\u003c/li>\n\u003cli>Crop out sensitive details, and never create misleading images of real people.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Typing isn't the only way to use AI anymore. Many assistants can listen and talk back, look at a photo you've taken, and even create images from a description. That turns AI into something you can use while cooking, walking, or standing in front of a confusing parking sign. Features vary between assistants and plans, and they change quickly, so check what yours offers. The techniques below work wherever the features are available. Voice: think out loud There are usually two kinds of voice feature: Dictation: you speak and it types your words into the message box. Great for long, rambling context that would be tedious to type. Voice conversation: a spoken back-and-forth, a bit like a phone call with your assistant. Voice shines when your hands are busy or your thoughts are messy: Brain dumps. Talk for two minutes about everything on your mind, then say, \"Turn that into an organized to-do list, grouped by priority.\" Rehearsals. Practice a salary conversation, a difficult talk or a presentation out loud. Language practice. Speaking practice with instant, patient feedback. Hands-free help. \"How do I scale this recipe up for six people?\" while your hands are covered in flour. Try this as a spoken prompt: I want to practice asking my manager for [REQUEST]. You play my manager. Be realistic and push back a little, the way a busy manager might. When we finish, tell me what I did well and what to improve. Images in: AI that can see Many assistants let you upload or snap a photo and ask about it. It's surprisingly useful: Your fridge or pantry: \"What can I make for dinner with this in 30 minutes?\" A confusing form: \"What is this asking for, and what do I need to fill in?\" A screenshot of an error message: \"What does this mean, and how do I fix it? I'm not technical.\" A chart: \"What's the main takeaway here?\" Handwritten notes or a whiteboard: \"Type this up and organize it into action items.\" A good image prompt still uses the five parts. Add context and a clear task: [ATTACH PHOTO] This is a letter I received about [TOPIC]. In plain English: what is it about, do I need to do anything, and by when? Flag anything that looks unusual or like a possible scam. Accuracy note: AI can misread blurry text, small numbers and handwriting. For anything important, like a medication label, a bill amount or a deadline, check against the original. Identifying plants, mushrooms, insects or skin conditions from a photo is a starting point only. Never eat a wild plant or mushroom based on an AI identification. Images out: creating pictures Some assistants can generate images from a description: a party invitation, an illustration for a presentation, a visual idea for your garden. Describe four things: Subject: what's in the image. Style: photo, watercolor, flat illustration or cartoon. Composition and mood: close-up or wide, bright or moody, colors. Use: for example, \"for a square social media post\" or \"for a printed flyer.\" Create an image for a kids' science birthday party invitation: a friendly cartoon rocket and planets, bright colors, playful style, with empty space at the top for text. Square format. Image generators can still struggle with exact wording, so add any text yourself in a design or document app. Privacy and respect Photos can show more than you meant to share: faces, addresses, license plates and paperwork in the background. Crop first. Don't create images of real people in ways that could mislead or embarrass them. Many tools restrict this anyway, and it's a bad idea regardless. Ask before uploading other people's photos. Your friend's face isn't yours to share. Try it now Take a photo of something real: your fridge, a sign, or a confusing piece of mail with personal details covered. Ask a specific question about it, with context and a clear task. If your assistant has voice, try a two-minute spoken brain dump and ask it to organize your thoughts. Common mistakes Assuming it read everything correctly. Check numbers, dates and small print against the original. Uploading photos with sensitive details. Crop or cover them first. Forgetting the question. A photo with no prompt gets a generic description. Say what you want to know. Key takeaways Voice is perfect for brain dumps, rehearsals and hands-free help. A photo plus a clear question makes forms, letters, labels and screenshots easy to understand. Check anything important against the original, and never rely on AI to tell you what's safe to eat. Crop out sensitive details, and never create misleading images of real people.","blocks":[{"lang":"","text":"I want to practice asking my manager for [REQUEST]. You play my\nmanager. Be realistic and push back a little, the way a busy manager\nmight. When we finish, tell me what I did well and what to improve."},{"lang":"","text":"[ATTACH PHOTO] This is a letter I received about [TOPIC]. In plain\nEnglish: what is it about, do I need to do anything, and by when?\nFlag anything that looks unusual or like a possible scam."},{"lang":"","text":"Create an image for a kids' science birthday party invitation: a\nfriendly cartoon rocket and planets, bright colors, playful style,\nwith empty space at the top for text. Square format."}],"quiz":[{"q":"What is the difference between dictation and voice conversation?","options":["Dictation reads answers aloud, while voice conversation types them out","Dictation types your words, while voice conversation is a spoken back-and-forth","Dictation only works with photos, while voice conversation only works with text","There's no difference, since they're two names for the same feature"],"answer":1,"explain":"Dictation turns your speech into text in the message box, which is great for long, rambling context. Voice conversation is a spoken back-and-forth, a bit like a phone call with your assistant."},{"q":"You receive a confusing letter and want AI to explain it from a photo. What's the best approach?","options":["Attach the uncropped photo with no question and let the AI decide","Attach it and rely on whatever dates and amounts the AI reads back","Retype the whole letter instead, since AI can never read photos","Cover personal details, attach it, and ask what it means and what to do"],"answer":3,"explain":"A photo plus a clear question gets a useful answer, and covering sensitive details protects your privacy. You should still check important numbers and deadlines against the original."},{"q":"You want AI to create an image for a printed flyer that shows your event's name. What should you do?","options":["Ask for the exact wording inside the image and use whatever comes back","Describe only the subject and let the AI choose everything else","Describe the subject, style, mood and use, then add the text yourself","Base it on a photo of a real person so the flyer looks more authentic"],"answer":2,"explain":"Describe four things: subject, style, composition and mood, and use. Image generators can still struggle with exact wording, so add any text yourself in a design or document app."}],"videoUrl":null},{"n":15,"slug":"fact-check-in-three-minutes","title":"Fact-Check AI in Three Minutes","summary":"A simple, repeatable routine to catch AI mistakes before they cost you, without spending all day double-checking.","durationMin":10,"module":5,"moduleTitle":"Make It a Habit","html":"\u003csection class=\"sec sec-intro\">\u003cp>You know AI can be confidently wrong. But you can&#39;t verify every sentence, or AI would stop saving you time. The answer is a fast, focused routine: check \u003cstrong>the right things\u003c/strong>, in \u003cstrong>the right way\u003c/strong>, in about three minutes. Use it whenever an answer will inform a decision, go out under your name, or cost money.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 1: Decide whether it needs checking (10 seconds)\u003c/h2>\n\u003cp>Ask yourself one question: \u003cstrong>&quot;What happens if this is wrong?&quot;\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Low stakes\u003c/strong> (a brainstorm, a draft you&#39;ll edit, a recipe idea): a quick read-through is enough.\u003c/li>\n\u003cli>\u003cstrong>Medium stakes\u003c/strong> (an email with facts in it, a plan you&#39;ll follow, something you&#39;ll share): check the key claims.\u003c/li>\n\u003cli>\u003cstrong>High stakes\u003c/strong> (health, legal, money, safety, anything published): check every specific claim, and consider a professional.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 2: Spot the checkable claims (30 seconds)\u003c/h2>\n\u003cp>Errors hide in specifics. Scan for:\u003c/p>\n\u003cul>\n\u003cli>Names, job titles and quotes\u003c/li>\n\u003cli>Numbers, statistics, prices and dates\u003c/li>\n\u003cli>Laws, rules, policies and deadlines\u003c/li>\n\u003cli>Links, citations, and book or article titles\u003c/li>\n\u003cli>Anything that surprised you\u003c/li>\n\u003c/ul>\n\u003cp>Or let the AI do the scanning:\u003c/p>\n\u003cpre>\u003ccode>List every specific factual claim in your last answer: names, numbers,\ndates, quotes, sources and rules. For each one, tell me how confident\nyou are (high, medium or low) and the best type of source to verify it.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 3: Verify the important ones (2 minutes)\u003c/h2>\n\u003cp>For each claim that ma
