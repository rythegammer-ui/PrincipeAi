tters:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Go to the source.\u003c/strong> Official websites (government, the company, the organization itself) beat blogs and forums. For research, the original study beats news coverage of it.\u003c/li>\n\u003cli>\u003cstrong>Open every link.\u003c/strong> Does the page exist? Does it actually say what the AI claimed?\u003c/li>\n\u003cli>\u003cstrong>Search for the exact quote or title.\u003c/strong> If you can&#39;t find it anywhere, treat it as invented.\u003c/li>\n\u003cli>\u003cstrong>Redo important math.\u003c/strong> A calculator takes seconds.\u003c/li>\n\u003cli>\u003cstrong>Check the date.\u003c/strong> Is this still current? Prices, rules and anything described as &quot;the latest&quot; change fast.\u003c/li>\n\u003c/ul>\n\u003cp>A useful technique here is \u003cstrong>lateral reading\u003c/strong>: instead of studying one source closely, open a few others in new tabs and see what they say about the same claim. If reliable sources agree, you&#39;re in good shape.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 4: Let AI help check itself, carefully\u003c/h2>\n\u003cp>These prompts help surface problems. They supplement real sources; they don&#39;t replace them.\u003c/p>\n\u003cpre>\u003ccode>Which parts of your answer might be outdated, oversimplified or wrong?\nWhat would change your answer?\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>Argue against your own answer. What would a skeptical expert say?\n\u003c/code>\u003c/pre>\n\u003cp>You can also get a \u003cstrong>second opinion\u003c/strong>: paste the claim into a different assistant, or a fresh chat, and ask, &quot;Is this accurate? What&#39;s the evidence?&quot; If the answers disagree, you know exactly where to dig.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Red flags\u003c/h2>\n\u003cp>Slow down when you see:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Very precise statistics with no source\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Quotes that are a little too perfect\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Citations you can&#39;t find\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Information that only confirms what you hoped\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Confident answers about very recent events\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example\u003c/h2>\n\u003cp>You ask about the rules for bringing food through customs on an upcoming trip, and get a clear, detailed answer. Run the routine:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Stakes:\u003c/strong> medium to high. Getting it wrong could mean a fine or confiscated items.\u003c/li>\n\u003cli>\u003cstrong>Claims:\u003c/strong> which items are allowed or banned, and whether you need to declare anything.\u003c/li>\n\u003cli>\u003cstrong>Verify:\u003c/strong> find the destination country&#39;s official customs or border agency website and compare.\u003c/li>\n\u003cli>\u003cstrong>Result:\u003c/strong> most of the answer matches, but one detail is out of date. You follow the official guidance.\u003c/li>\n\u003c/ol>\n\u003cp>Three minutes, one avoided headache.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Ask your assistant a factual question you&#39;re genuinely curious about, such as a historical event, a health guideline or how a rule works where you live.\u003c/li>\n\u003cli>Use the &quot;list every specific factual claim&quot; prompt.\u003c/li>\n\u003cli>Verify the two most important claims using official or original sources.\u003c/li>\n\u003cli>Note what you found: all correct, partly outdated, or wrong?\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Checking everything, or nothing.\u003c/strong> Match your effort to the stakes.\u003c/li>\n\u003cli>\u003cstrong>Asking &quot;Are you sure?&quot; and stopping there.\u003c/strong> The AI might double down on a mistake, or back down when it was right. Check a real source.\u003c/li>\n\u003cli>\u003cstrong>Trusting a source because it looks official.\u003c/strong> Make sure the page exists and says what&#39;s claimed.\u003c/li>\n\u003cli>\u003cstrong>Forgetting dates.\u003c/strong> Correct last year can be wrong today.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Match your checking effort to the stakes: what happens if this is wrong?\u003c/li>\n\u003cli>Errors hide in specifics: names, numbers, dates, quotes, links and rules.\u003c/li>\n\u003cli>Verify with official and original sources, open every link, and redo important math.\u003c/li>\n\u003cli>AI self-checks and second opinions help you find problems; real sources settle them.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"You know AI can be confidently wrong. But you can't verify every sentence, or AI would stop saving you time. The answer is a fast, focused routine: check the right things , in the right way , in about three minutes. Use it whenever an answer will inform a decision, go out under your name, or cost money. Step 1: Decide whether it needs checking (10 seconds) Ask yourself one question: \"What happens if this is wrong?\" Low stakes (a brainstorm, a draft you'll edit, a recipe idea): a quick read-through is enough. Medium stakes (an email with facts in it, a plan you'll follow, something you'll share): check the key claims. High stakes (health, legal, money, safety, anything published): check every specific claim, and consider a professional. Step 2: Spot the checkable claims (30 seconds) Errors hide in specifics. Scan for: Names, job titles and quotes Numbers, statistics, prices and dates Laws, rules, policies and deadlines Links, citations, and book or article titles Anything that surprised you Or let the AI do the scanning: List every specific factual claim in your last answer: names, numbers, dates, quotes, sources and rules. For each one, tell me how confident you are (high, medium or low) and the best type of source to verify it. Step 3: Verify the important ones (2 minutes) For each claim that matters: Go to the source. Official websites (government, the company, the organization itself) beat blogs and forums. For research, the original study beats news coverage of it. Open every link. Does the page exist? Does it actually say what the AI claimed? Search for the exact quote or title. If you can't find it anywhere, treat it as invented. Redo important math. A calculator takes seconds. Check the date. Is this still current? Prices, rules and anything described as \"the latest\" change fast. A useful technique here is lateral reading : instead of studying one source closely, open a few others in new tabs and see what they say about the same claim. If reliable sources agree, you're in good shape. Step 4: Let AI help check itself, carefully These prompts help surface problems. They supplement real sources; they don't replace them. Which parts of your answer might be outdated, oversimplified or wrong? What would change your answer? Argue against your own answer. What would a skeptical expert say? You can also get a second opinion : paste the claim into a different assistant, or a fresh chat, and ask, \"Is this accurate? What's the evidence?\" If the answers disagree, you know exactly where to dig. Red flags Slow down when you see: Very precise statistics with no source Quotes that are a little too perfect Citations you can't find Information that only confirms what you hoped Confident answers about very recent events Worked example You ask about the rules for bringing food through customs on an upcoming trip, and get a clear, detailed answer. Run the routine: Stakes: medium to high. Getting it wrong could mean a fine or confiscated items. Claims: which items are allowed or banned, and whether you need to declare anything. Verify: find the destination country's official customs or border agency website and compare. Result: most of the answer matches, but one detail is out of date. You follow the official guidance. Three minutes, one avoided headache. Try it now Ask your assistant a factual question you're genuinely curious about, such as a historical event, a health guideline or how a rule works where you live. Use the \"list every specific factual claim\" prompt. Verify the two most important claims using official or original sources. Note what you found: all correct, partly outdated, or wrong? Common mistakes Checking everything, or nothing. Match your effort to the stakes. Asking \"Are you sure?\" and stopping there. The AI might double down on a mistake, or back down when it was right. Check a real source. Trusting a source because it looks official. Make sure the page exists and says what's claimed. Forgetting dates. Correct last year can be wrong today. Key takeaways Match your checking effort to the stakes: what happens if this is wrong? Errors hide in specifics: names, numbers, dates, quotes, links and rules. Verify with official and original sources, open every link, and redo important math. AI self-checks and second opinions help you find problems; real sources settle them.","blocks":[{"lang":"","text":"List every specific factual claim in your last answer: names, numbers,\ndates, quotes, sources and rules. For each one, tell me how confident\nyou are (high, medium or low) and the best type of source to verify it."},{"lang":"","text":"Which parts of your answer might be outdated, oversimplified or wrong?\nWhat would change your answer?"},{"lang":"","text":"Argue against your own answer. What would a skeptical expert say?"}],"quiz":[{"q":"What is the first step of the three-minute fact-check routine?","options":["Paste the answer into a second assistant for a second opinion","Open every link the AI gave you and read each one closely","Ask yourself what happens if the answer turns out to be wrong","Ask the AI \"Are you sure?\" and see whether its answer changes"],"answer":2,"explain":"Step one takes ten seconds: ask \"What happens if this is wrong?\" Low-stakes answers need only a quick read-through, while high-stakes ones call for checking every specific claim."},{"q":"AI gave you a detailed answer about what food you can bring through customs on an upcoming trip. What should you do?","options":["Compare the key claims with the official customs agency website","Ask the AI if it's sure, and trust the answer if it says yes","Check every sentence, including the general background details","Trust it, since a detailed and confident answer is usually right"],"answer":0,"explain":"Getting customs rules wrong could mean a fine or confiscated items, so verify the key claims on the destination's official customs or border agency website. Asking \"Are you sure?\" is not a real check."},{"q":"An AI answer includes a very precise statistic and a perfect-sounding expert quote, with no sources. What's the best move?","options":["Use both, since precise numbers are a sign of careful research","Ask the AI to rewrite the answer so it sounds less certain","Keep the statistic but drop the quote, since quotes are riskier","Search for the exact quote and look for a source for the statistic"],"answer":3,"explain":"Precise statistics with no source and quotes that seem a little too perfect are red flags. Search for the exact quote or source, and if you can't find it anywhere, treat it as invented."}],"videoUrl":null},{"n":16,"slug":"safety-ethics-and-what-never-to-share","title":"Safety, Ethics & What Never to Share","summary":"Protect your privacy, spot AI-powered scams, and use AI honestly and fairly at home, at school and at work.","durationMin":11,"module":5,"moduleTitle":"Make It a Habit","html":"\u003csection class=\"sec sec-intro\">\u003cp>AI is a powerful tool, and like any powerful tool it comes with a few rules worth knowing by heart. This lesson covers three things: protecting your information, protecting yourself from people who use AI against you, and using AI in a way you&#39;d be comfortable explaining to anyone.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>What never to share\u003c/h2>\n\u003cp>You learned the postcard rule in Module 1. Here&#39;s the complete list to keep handy. \u003cstrong>Never paste into an AI assistant:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Passwords, PINs, security codes or recovery codes\u003c/li>\n\u003cli>Full card numbers, bank details or government ID numbers\u003c/li>\n\u003cli>Medical record numbers, insurance policy numbers or detailed health records tied to your name\u003c/li>\n\u003cli>Other people&#39;s private information, like their address, health details or messages they shared in confidence\u003c/li>\n\u003cli>Confidential work material, such as client data, financials or unreleased plans, unless your employer has approved the tool for it\u003c/li>\n\u003c/ul>\n\u003cp>Before you paste anything, pause and ask:\u003c/p>\n\u003col>\n\u003cli>Would I be comfortable if a stranger read this?\u003c/li>\n\u003cli>Does it identify me or someone else?\u003c/li>\n\u003cli>Could I describe it instead of pasting it?\u003c/li>\n\u003c/ol>\n\u003cp>You can almost always get the same help by swapping specifics for descriptions: &quot;my client&quot; instead of a name, &quot;a mid-sized city&quot; instead of an address, rounded numbers instead of exact balances.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Scams just got smarter\u003c/h2>\n\u003cp>Scammers use AI too, and their messages are now well written, personalized and convincing. Three threats to know:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Voice cloning.\u003c/strong> Scammers can imitate someone&#39;s voice from a short recording. A panicked call from a &quot;grandchild&quot; or &quot;boss&quot; asking for urgent money or gift cards could be fake. \u003cstrong>Agree on a family code word\u003c/strong>, and if a call feels urgent and unusual, hang up and call back on a number you already know.\u003c/li>\n\u003cli>\u003cstrong>Deepfake images and video.\u003c/strong> Realistic fakes are easy to make. Be skeptical of shocking content, especially when it pushes you to act or share right away.\u003c/li>\n\u003cli>\u003cstrong>Polished phishing.\u003c/strong> Bad spelling used to be a giveaway. Not anymore. Judge a message by what it asks for: urgency, secrecy, payment by gift card, wire transfer or crypto, or a link to &quot;verify your account&quot; are red flags however professional it looks.\u003c/li>\n\u003c/ul>\n\u003cp>AI can help you spot scams, too:\u003c/p>\n\u003cpre>\u003ccode>I received this message and I&#39;m not sure it&#39;s legitimate. I haven&#39;t\nclicked anything. [PASTE THE TEXT, WITHOUT PERSONAL DETAILS]\nWhat are the warning signs, if any? How can I verify it safely without\nusing any of the contact details in the message?\n\u003c/code>\u003c/pre>\n\u003cp>Then verify through official contact details you look up yourself.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Using AI ethically\u003c/h2>\n\u003cp>A few principles keep you on solid ground:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Be honest about AI help when it matters.\u003c/strong> If your school, employer, clients or publisher have rules about AI, follow them. When people reasonably expect the work to be personally yours, tell them, or do it yourself.\u003c/li>\n\u003cli>\u003cstrong>Stay accountable.\u003c/strong> If you send it, you own it. &quot;The AI wrote that&quot; doesn&#39;t excuse a mistake or an unkind message.\u003c/li>\n\u003cli>\u003cstrong>Watch for bias.\u003c/strong> AI learned from human writing, including its stereotypes and blind spots. Take extra care when AI output affects people, like hiring, reviews or descriptions of others.\u003c/li>\n\u003cli>\u003cstrong>Respect creators.\u003c/strong> Don&#39;t pass off someone else&#39;s work as your own, or use AI to copy content you don&#39;t have the rights to.\u003c/li>\n\u003cli>\u003cstrong>Don&#39;t deceive.\u003c/strong> Never use AI to impersonate a real person or to create fake reviews, fake documents or misleading images.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Healthy habits\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Keep your own skills sharp.\u003c/strong> Use AI to support your thinking, not replace it. Now and then, write, plan or work something out without it.\u003c/li>\n\u003cli>\u003cstrong>AI isn&#39;t a therapist or a friend.\u003c/strong> It can be a helpful sounding board on a hard day, but it&#39;s no substitute for real people or professional support. If you&#39;re struggling, reach out to someone you trust or a mental health professional. In a crisis, contact your local emergency number or a crisis line.\u003c/li>\n\u003cli>\u003cstrong>Kids and AI.\u003c/strong> If children in your life use AI, explore it together at first, talk about what it gets wrong, and agree on rules for privacy and schoolwork.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Revisit your assistant&#39;s training, memory and history settings. Has anything changed since you set them?\u003c/li>\n\u003cli>Agree on a code word with your family or closest people for any urgent call asking for money.\u003c/li>\n\u003cli>Write your own three-line AI rules: what you&#39;ll never share, when you&#39;ll mention AI help, and what you&#39;ll always verify.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Assuming deleted means gone everywhere.\u003c/strong> Deleting a chat removes it from your history, but retention policies vary. Don&#39;t share what you&#39;d regret.\u003c/li>\n\u003cli>\u003cstrong>Trusting a message because it&#39;s well written.\u003c/strong> Polish is no longer proof of legitimacy.\u003c/li>\n\u003cli>\u003cstrong>Forgetting other people&#39;s privacy.\u003c/strong> Their information isn&#39;t yours to share.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Never share passwords, financial or ID numbers, health records or confidential data. Describe instead of pasting.\u003c/li>\n\u003cli>Scams now use cloned voices, deepfakes and polished messages. Verify through channels you already trust.\u003c/li>\n\u003cli>Be honest about AI help when it matters, and stay accountable for anything you send.\u003c/li>\n\u003cli>Use AI to support your thinking and your relationships, not to replace them.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"AI is a powerful tool, and like any powerful tool it comes with a few rules worth knowing by heart. This lesson covers three things: protecting your information, protecting yourself from people who use AI against you, and using AI in a way you'd be comfortable explaining to anyone. What never to share You learned the postcard rule in Module 1. Here's the complete list to keep handy. Never paste into an AI assistant: Passwords, PINs, security codes or recovery codes Full card numbers, bank details or government ID numbers Medical record numbers, insurance policy numbers or detailed health records tied to your name Other people's private information, like their address, health details or messages they shared in confidence Confidential work material, such as client data, financials or unreleased plans, unless your employer has approved the tool for it Before you paste anything, pause and ask: Would I be comfortable if a stranger read this? Does it identify me or someone else? Could I describe it instead of pasting it? You can almost always get the same help by swapping specifics for descriptions: \"my client\" instead of a name, \"a mid-sized city\" instead of an address, rounded numbers instead of exact balances. Scams just got smarter Scammers use AI too, and their messages are now well written, personalized and convincing. Three threats to know: Voice cloning. Scammers can imitate someone's voice from a short recording. A panicked call from a \"grandchild\" or \"boss\" asking for urgent money or gift cards could be fake. Agree on a family code word , and if a call feels urgent and unusual, hang up and call back on a number you already know. Deepfake images and video. Realistic fakes are easy to make. Be skeptical of shocking content, especially when it pushes you to act or share right away. Polished phishing. Bad spelling used to be a giveaway. Not anymore. Judge a message by what it asks for: urgency, secrecy, payment by gift card, wire transfer or crypto, or a link to \"verify your account\" are red flags however professional it looks. AI can help you spot scams, too: I received this message and I'm not sure it's legitimate. I haven't clicked anything. [PASTE THE TEXT, WITHOUT PERSONAL DETAILS] What are the warning signs, if any? How can I verify it safely without using any of the contact details in the message? Then verify through official contact details you look up yourself. Using AI ethically A few principles keep you on solid ground: Be honest about AI help when it matters. If your school, employer, clients or publisher have rules about AI, follow them. When people reasonably expect the work to be personally yours, tell them, or do it yourself. Stay accountable. If you send it, you own it. \"The AI wrote that\" doesn't excuse a mistake or an unkind message. Watch for bias. AI learned from human writing, including its stereotypes and blind spots. Take extra care when AI output affects people, like hiring, reviews or descriptions of others. Respect creators. Don't pass off someone else's work as your own, or use AI to copy content you don't have the rights to. Don't deceive. Never use AI to impersonate a real person or to create fake reviews, fake documents or misleading images. Healthy habits Keep your own skills sharp. Use AI to support your thinking, not replace it. Now and then, write, plan or work something out without it. AI isn't a therapist or a friend. It can be a helpful sounding board on a hard day, but it's no substitute for real people or professional support. If you're struggling, reach out to someone you trust or a mental health professional. In a crisis, contact your local emergency number or a crisis line. Kids and AI. If children in your life use AI, explore it together at first, talk about what it gets wrong, and agree on rules for privacy and schoolwork. Try it now Revisit your assistant's training, memory and history settings. Has anything changed since you set them? Agree on a code word with your family or closest people for any urgent call asking for money. Write your own three-line AI rules: what you'll never share, when you'll mention AI help, and what you'll always verify. Common mistakes Assuming deleted means gone everywhere. Deleting a chat removes it from your history, but retention policies vary. Don't share what you'd regret. Trusting a message because it's well written. Polish is no longer proof of legitimacy. Forgetting other people's privacy. Their information isn't yours to share. Key takeaways Never share passwords, financial or ID numbers, health records or confidential data. Describe instead of pasting. Scams now use cloned voices, deepfakes and polished messages. Verify through channels you already trust. Be honest about AI help when it matters, and stay accountable for anything you send. Use AI to support your thinking and your relationships, not to replace them.","blocks":[{"lang":"","text":"I received this message and I'm not sure it's legitimate. I haven't\nclicked anything. [PASTE THE TEXT, WITHOUT PERSONAL DETAILS]\nWhat are the warning signs, if any? How can I verify it safely without\nusing any of the contact details in the message?"}],"quiz":[{"q":"Now that scammers use AI, how should you judge whether a message might be a scam?","options":["By whether it contains spelling and grammar mistakes","By how professional and polished the message looks","By whether it uses your name and personal details","By what it asks for, like urgency, secrecy or gift cards"],"answer":3,"explain":"AI lets scammers write polished, personalized messages, so bad spelling is no longer a giveaway. Urgency, secrecy, payment by gift card, wire transfer or crypto, or a \"verify your account\" link are red flags however professional it looks."},{"q":"You get a panicked call that sounds exactly like your grandchild, asking for money urgently. What should you do?","options":["Send the money quickly, since the voice is clearly theirs","Hang up and call back on a number you already know","Ask the caller to text you a new number to confirm it's them","Stay on the line and ask for the details of where to send it"],"answer":1,"explain":"Scammers can clone a voice from a short recording. If a call feels urgent and unusual, hang up and call back on a number you already know, and agree on a family code word ahead of time."},{"q":"You want AI's help replying to a client, and the email thread includes their name and contract figures. What should you do?","options":["Describe it instead, using \"my client\" and rounded numbers","Paste the full thread, since AI needs every detail to help","Paste it, then delete the chat so it's gone everywhere","Avoid AI entirely, since it can never help with work email"],"answer":0,"explain":"You can almost always get the same help by swapping specifics for descriptions, like \"my client\" instead of a name and rounded numbers instead of exact figures. Deleting a chat doesn't mean it's gone everywhere."}],"videoUrl":null},{"n":17,"slug":"your-personal-ai-toolkit","title":"Build Your Personal AI Toolkit","summary":"Pull everything together into a simple personal system: your assistant, your instructions, your go-to prompts and your checking routine.","durationMin":12,"module":5,"moduleTitle":"Make It a Habit","html":"\u003csection class=\"sec sec-intro\">\u003cp>You&#39;ve learned a lot of techniques. The risk now is the same as with any course: you finish, feel inspired for a week, then slowly drift back to old habits. The fix is to turn what you&#39;ve learned into a small personal \u003cstrong>toolkit\u003c/strong>, a few things set up and saved so that using AI well becomes the easy default.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The five parts of your toolkit\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Your assistant.\u003c/strong> One main assistant you know well, plus a second for second opinions if you like.\u003c/li>\n\u003cli>\u003cstrong>Your personal instructions.\u003c/strong> The short &quot;about me and how I like answers&quot; text from Module 2.\u003c/li>\n\u003cli>\u003cstrong>Your prompt library.\u003c/strong> Eight to twelve saved prompts for the things you do most.\u003c/li>\n\u003cli>\u003cstrong>Your workspaces.\u003c/strong> One for each ongoing area of life or work, if your assistant supports them.\u003c/li>\n\u003cli>\u003cstrong>Your safety routine.\u003c/strong> What you never share, and your three-minute fact-check.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Find your highest-value uses\u003c/h2>\n\u003cp>Not everything needs AI. The best candidates pass three tests:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Is it language-heavy?\u003c/strong> Writing, reading, explaining, planning or organizing.\u003c/li>\n\u003cli>\u003cstrong>Would a good first draft help?\u003c/strong> If you&#39;d otherwise start from a blank page, yes.\u003c/li>\n\u003cli>\u003cstrong>Can I check the result?\u003c/strong> You should be able to tell whether the output is good.\u003c/li>\n\u003c/ul>\n\u003cp>Let AI help you find them:\u003c/p>\n\u003cpre>\u003ccode>Help me find my best uses for AI. Here&#39;s a typical week for me:\n[WORK, HOME, ROUTINES, RECURRING TASKS AND THINGS I DREAD].\nIdentify the 5 tasks where AI could save me the most time or stress.\nFor each, explain how, and give me a ready-to-use prompt template with\n[BRACKETS] for the details that change each time.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Build your prompt library\u003c/h2>\n\u003cp>Create or update your \u003cstrong>&quot;My AI Prompts&quot;\u003c/strong> note. A good library entry has:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>A clear name\u003c/strong> so you can find it fast, like &quot;Weekly plan,&quot; &quot;Reply helper&quot; or &quot;Explain this document.&quot;\u003c/li>\n\u003cli>\u003cstrong>The prompt itself\u003c/strong>, with [BRACKETS] for anything that changes.\u003c/li>\n\u003cli>\u003cstrong>A note\u003c/strong> on any follow-up that usually helps.\u003c/li>\n\u003c/ul>\n\u003cp>Here&#39;s a starter library drawn from this course. Pick the ones that fit your life:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Area\u003c/th>\n\u003cth>Prompts to save\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Messages\u003c/td>\n\u003ctd>Reply helper; &quot;How will this come across?&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Planning\u003c/td>\n\u003ctd>Weekly plan; meal plan and grocery list\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Learning\u003c/td>\n\u003ctd>Explain it at my level; quiz me\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Serious topics\u003c/td>\n\u003ctd>Appointment prep; plain-English clause explainer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Writing\u003c/td>\n\u003ctd>Edit for clarity and list the changes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Documents\u003c/td>\n\u003ctd>Summary with a purpose and supporting quotes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Decisions\u003c/td>\n\u003ctd>Weighted comparison; pre-mortem\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Checking\u003c/td>\n\u003ctd>List every factual claim\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Add the prompts from the free AI Starter Kit that suit you, and you&#39;ll have a library most people never get around to building.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Make your templates better over time\u003c/h2>\n\u003cp>Once a prompt works, improve it with AI:\u003c/p>\n\u003cpre>\u003ccode>Here&#39;s a prompt I use regularly: [PASTE PROMPT]. Here&#39;s what I usually\nhave to fix in the answers: [ISSUES]. Improve the prompt so I get better\nresults the first time. Keep it short and keep the [BRACKETS].\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Remove the friction\u003c/h2>\n\u003cp>Small setup choices decide whether you actually use AI day to day:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Pin your assistant\u003c/strong> to your phone&#39;s home screen and your browser&#39;s bookmarks bar.\u003c/li>\n\u003cli>\u003cstrong>Keep your prompt library one tap away\u003c/strong> in the notes app you already open every day.\u003c/li>\n\u003cli>\u003cstrong>Use dictation\u003c/strong> when typing out context feels like a chore.\u003c/li>\n\u003cli>\u003cstrong>Set up one workspace\u003c/strong> for your biggest current project.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Worked example: a toolkit on one page\u003c/h2>\n\u003cp>Picture a freelance designer with two kids. Their toolkit: one main assistant on phone and laptop. Personal instructions that say &quot;freelance designer, two kids, prefers short bullet-point answers, based in the US.&quot; A library of nine prompts covering client emails, quote follow-ups, the weekly plan, the meal plan, a homework explainer, invoice reminders, social captions, a decision helper and a fact-check. One workspace for their biggest client project. And a sticky note on the monitor: &quot;Context in. Check specifics. Never paste passwords.&quot;\u003c/p>\n\u003cp>That&#39;s it. Simple enough to use daily, and powerful enough to save real time every week.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Run the &quot;find my best uses&quot; prompt and pick your top three.\u003c/li>\n\u003cli>Create or update your &quot;My AI Prompts&quot; note with at least \u003cstrong>eight\u003c/strong> prompts.\u003c/li>\n\u003cli>Review and refresh your personal instructions.\u003c/li>\n\u003cli>Write a one-line rule for safe use, and put it somewhere you&#39;ll see it.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Collecting prompts you never use.\u003c/strong> A short library you use beats a huge one you don&#39;t.\u003c/li>\n\u003cli>\u003cstrong>Never updating.\u003c/strong> When you notice you&#39;re fixing the same thing every time, improve the prompt.\u003c/li>\n\u003cli>\u003cstrong>Chasing every new tool.\u003c/strong> New features are fun, but mastering one assistant beats dabbling in five.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Your toolkit has five parts: assistant, personal instructions, prompt library, workspaces and safety routine.\u003c/li>\n\u003cli>Focus AI on tasks that are language-heavy, benefit from a draft, and that you can check.\u003c/li>\n\u003cli>Save prompts with [BRACKETS] and keep improving them.\u003c/li>\n\u003cli>Remove friction so using AI well becomes your default.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"You've learned a lot of techniques. The risk now is the same as with any course: you finish, feel inspired for a week, then slowly drift back to old habits. The fix is to turn what you've learned into a small personal toolkit , a few things set up and saved so that using AI well becomes the easy default. The five parts of your toolkit Your assistant. One main assistant you know well, plus a second for second opinions if you like. Your personal instructions. The short \"about me and how I like answers\" text from Module 2. Your prompt library. Eight to twelve saved prompts for the things you do most. Your workspaces. One for each ongoing area of life or work, if your assistant supports them. Your safety routine. What you never share, and your three-minute fact-check. Find your highest-value uses Not everything needs AI. The best candidates pass three tests: Is it language-heavy? Writing, reading, explaining, planning or organizing. Would a good first draft help? If you'd otherwise start from a blank page, yes. Can I check the result? You should be able to tell whether the output is good. Let AI help you find them: Help me find my best uses for AI. Here's a typical week for me: [WORK, HOME, ROUTINES, RECURRING TASKS AND THINGS I DREAD]. Identify the 5 tasks where AI could save me the most time or stress. For each, explain how, and give me a ready-to-use prompt template with [BRACKETS] for the details that change each time. Build your prompt library Create or update your \"My AI Prompts\" note. A good library entry has: A clear name so you can find it fast, like \"Weekly plan,\" \"Reply helper\" or \"Explain this document.\" The prompt itself , with [BRACKETS] for anything that changes. A note on any follow-up that usually helps. Here's a starter library drawn from this course. Pick the ones that fit your life: Area Prompts to save Messages Reply helper; \"How will this come across?\" Planning Weekly plan; meal plan and grocery list Learning Explain it at my level; quiz me Serious topics Appointment prep; plain-English clause explainer Writing Edit for clarity and list the changes Documents Summary with a purpose and supporting quotes Decisions Weighted comparison; pre-mortem Checking List every factual claim Add the prompts from the free AI Starter Kit that suit you, and you'll have a library most people never get around to building. Make your templates better over time Once a prompt works, improve it with AI: Here's a prompt I use regularly: [PASTE PROMPT]. Here's what I usually have to fix in the answers: [ISSUES]. Improve the prompt so I get better results the first time. Keep it short and keep the [BRACKETS]. Remove the friction Small setup choices decide whether you actually use AI day to day: Pin your assistant to your phone's home screen and your browser's bookmarks bar. Keep your prompt library one tap away in the notes app you already open every day. Use dictation when typing out context feels like a chore. Set up one workspace for your biggest current project. Worked example: a toolkit on one page Picture a freelance designer with two kids. Their toolkit: one main assistant on phone and laptop. Personal instructions that say \"freelance designer, two kids, prefers short bullet-point answers, based in the US.\" A library of nine prompts covering client emails, quote follow-ups, the weekly plan, the meal plan, a homework explainer, invoice reminders, social captions, a decision helper and a fact-check. One workspace for their biggest client project. And a sticky note on the monitor: \"Context in. Check specifics. Never paste passwords.\" That's it. Simple enough to use daily, and powerful enough to save real time every week. Try it now Run the \"find my best uses\" prompt and pick your top three. Create or update your \"My AI Prompts\" note with at least eight prompts. Review and refresh your personal instructions. Write a one-line rule for safe use, and put it somewhere you'll see it. Common mistakes Collecting prompts you never use. A short library you use beats a huge one you don't. Never updating. When you notice you're fixing the same thing every time, improve the prompt. Chasing every new tool. New features are fun, but mastering one assistant beats dabbling in five. Key takeaways Your toolkit has five parts: assistant, personal instructions, prompt library, workspaces and safety routine. Focus AI on tasks that are language-heavy, benefit from a draft, and that you can check. Save prompts with [BRACKETS] and keep improving them. Remove friction so using AI well becomes your default.","blocks":[{"lang":"","text":"Help me find my best uses for AI. Here's a typical week for me:\n[WORK, HOME, ROUTINES, RECURRING TASKS AND THINGS I DREAD].\nIdentify the 5 tasks where AI could save me the most time or stress.\nFor each, explain how, and give me a ready-to-use prompt template with\n[BRACKETS] for the details that change each time."},{"lang":"","text":"Here's a prompt I use regularly: [PASTE PROMPT]. Here's what I usually\nhave to fix in the answers: [ISSUES]. Improve the prompt so I get better\nresults the first time. Keep it short and keep the [BRACKETS]."}],"quiz":[{"q":"Which three tests does the lesson use to spot a task that's a good candidate for AI?","options":["It's language-heavy, a first draft would help, and you can check the result","It's urgent, it involves numbers, and nobody else is available to help","It's creative, it's brand new to you, and the stakes are very high","It's repetitive, it takes hours, and you won't need to review the output"],"answer":0,"explain":"The best candidates are language-heavy, like writing, reading, explaining, planning or organizing. They also benefit from a first draft, and you can tell whether the output is good."},{"q":"Your prompt library has grown to 40 saved prompts, but you only ever use a few of them. What does the lesson suggest?","options":["Keep adding more, since a bigger library covers more situations","Delete the library and write every prompt from scratch each time","Keep a short library of the prompts you actually use","Switch to a new assistant, since a fresh start will help"],"answer":2,"explain":"Collecting prompts you never use is a common mistake, and a short library you use beats a huge one you don't. The lesson suggests eight to twelve prompts for the things you do most."},{"q":"You keep fixing the same problem in the answers from one of your saved prompts. What should you do?","options":["Keep fixing it by hand, since saved prompts shouldn't change","Ask AI to improve the prompt, keeping it short with the brackets","Stop using that prompt and type a new one from scratch each time","Try a different assistant each time until one gets it right"],"answer":1,"explain":"When you notice you're fixing the same thing every time, improve the prompt. Paste it along with the usual issues and ask AI to improve it, keeping it short and keeping the brackets."}],"videoUrl":null},{"n":18,"slug":"your-30-day-ai-habit-plan","title":"Your 30-Day AI Habit Plan","summary":"A simple four-week plan, about ten minutes a day, to turn everything you've learned into a lasting habit.","durationMin":10,"module":5,"moduleTitle":"Make It a Habit","html":"\u003csection class=\"sec sec-intro\">\u003cp>Knowing how to use AI and actually using it are two different things. The people who get the most from AI aren&#39;t necessarily the most technical. They&#39;re the ones who made it a habit. This final lesson gives you a 30-day plan to do exactly that, in about ten minutes a day.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>How to make it stick\u003c/h2>\n\u003cp>Three simple principles make this plan work:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Attach it to something you already do.\u003c/strong> &quot;After my morning coffee, I&#39;ll use AI for one task.&quot; An existing routine is the best trigger for a new one.\u003c/li>\n\u003cli>\u003cstrong>Start small.\u003c/strong> Ten minutes and one task. Small wins build momentum, and momentum builds the habit.\u003c/li>\n\u003cli>\u003cstrong>Make progress visible.\u003c/strong> Keep a simple log: the date, the task, a rough guess at the time saved, and one thing you learned.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Week 1: Daily wins (days 1-7)\u003c/h2>\n\u003cp>\u003cstrong>Goal:\u003c/strong> use AI once a day for something real.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Day 1:\u003c/strong> Draft a message you&#39;ve been putting off.\u003c/li>\n\u003cli>\u003cstrong>Day 2:\u003c/strong> Plan tomorrow from a brain dump of everything on your mind.\u003c/li>\n\u003cli>\u003cstrong>Day 3:\u003c/strong> Get an explanation of something you&#39;ve always wondered about, then have the AI quiz you.\u003c/li>\n\u003cli>\u003cstrong>Day 4:\u003c/strong> Plan this week&#39;s dinners and grocery list.\u003c/li>\n\u003cli>\u003cstrong>Day 5:\u003c/strong> Edit something you wrote for clarity, and ask what changed and why.\u003c/li>\n\u003cli>\u003cstrong>Day 6:\u003c/strong> Summarize a long article or document with a clear purpose.\u003c/li>\n\u003cli>\u003cstrong>Day 7:\u003c/strong> Review your log. Which task saved you the most time?\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Week 2: Build your system (days 8-14)\u003c/h2>\n\u003cp>\u003cstrong>Goal:\u003c/strong> set up your toolkit so good habits take no effort.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Days 8-9:\u003c/strong> Write or refine your personal instructions.\u003c/li>\n\u003cli>\u003cstrong>Days 10-11:\u003c/strong> Save your five most useful prompts as templates.\u003c/li>\n\u003cli>\u003cstrong>Day 12:\u003c/strong> Set up a workspace, or a briefing note, for one ongoing project.\u003c/li>\n\u003cli>\u003cstrong>Day 13:\u003c/strong> Try voice or images for one real task.\u003c/li>\n\u003cli>\u003cstrong>Day 14:\u003c/strong> Run the three-minute fact-check on an answer you&#39;re relying on.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Week 3: Go deeper (days 15-21)\u003c/h2>\n\u003cp>\u003cstrong>Goal:\u003c/strong> use AI for something bigger than a single task.\u003c/p>\n\u003cp>Pick \u003cstrong>one meaningful project\u003c/strong> to move forward with AI this week: planning a trip, preparing for an important conversation, learning a new skill or organizing a home project. Each day:\u003c/p>\n\u003col>\n\u003cli>Spend ten minutes moving it forward with AI.\u003c/li>\n\u003cli>Try a technique you haven&#39;t used yet: the Socratic tutor, a pre-mortem, a weighted comparison or a self-critique.\u003c/li>\n\u003cli>Note what worked.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Week 4: Refine and expand (days 22-30)\u003c/h2>\n\u003cp>\u003cstrong>Goal:\u003c/strong> make AI a natural part of how you work and live.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Days 22-24:\u003c/strong> Improve your three most-used templates with the &quot;improve my prompt&quot; technique.\u003c/li>\n\u003cli>\u003cstrong>Days 25-26:\u003c/strong> Try AI in an area of your life you haven&#39;t used it for yet.\u003c/li>\n\u003cli>\u003cstrong>Days 27-28:\u003c/strong> Teach someone else one thing you&#39;ve learned. Teaching locks in your own skills.\u003c/li>\n\u003cli>\u003cstrong>Day 29:\u003c/strong> Review your privacy settings and your never-share rules.\u003c/li>\n\u003cli>\u003cstrong>Day 30:\u003c/strong> Reflect with the prompt below, and plan your next month.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>Here&#39;s my log from 30 days of using AI: [PASTE YOUR LOG]\nHelp me reflect: which uses saved me the most time or stress, which\ndidn&#39;t help, and what patterns do you notice? Then suggest 3 new ways\nto use AI next month, based on what has worked for me, each with a\nprompt template.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>When you miss a day\u003c/h2>\n\u003cp>You will, and that&#39;s fine. Don&#39;t restart the plan; pick up where you left off. Missing a day doesn&#39;t break a habit, but quitting does. If ten minutes feels like too much on a busy day, do a two-minute version: one message, or one quick question.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Staying current without the overwhelm\u003c/h2>\n\u003cp>AI tools change fast, with new features, new names and new models. You don&#39;t need to chase every announcement. The skills you&#39;ve built in this course last: giving context, iterating, verifying and protecting your privacy work with any assistant, today and in the years ahead. When a new feature appears, ask your assistant to explain it, then try it on one real task. That&#39;s all it takes to keep up.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Try it now\u003c/h2>\n\u003col>\n\u003cli>Choose your trigger: &quot;After I [EXISTING HABIT], I&#39;ll use AI for one task.&quot;\u003c/li>\n\u003cli>Create your log in your notes app with four columns: date, task, time saved and lesson learned.\u003c/li>\n\u003cli>Put a reminder in your calendar for Day 30.\u003c/li>\n\u003cli>Do Day 1 today.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-mistakes\">\u003ch2>Common mistakes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Waiting for the perfect use case.\u003c/strong> Small everyday tasks build the habit. Start with a message.\u003c/li>\n\u003cli>\u003cstrong>All-or-nothing thinking.\u003c/strong> A missed day is a pause, not a failure.\u003c/li>\n\u003cli>\u003cstrong>Only doing what&#39;s comfortable.\u003c/strong> Each week, try one technique you haven&#39;t used yet.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Tie AI to an existing routine, start with ten minutes a day, and log your wins.\u003c/li>\n\u003cli>Week 1 builds the habit, Week 2 builds the system, Week 3 goes deeper and Week 4 refines.\u003c/li>\n\u003cli>Missed days don&#39;t matter much. Consistency over time does.\u003c/li>\n\u003cli>Your core skills (context, iteration, verification and privacy) work with any AI tool, now and in the future.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>You did it\u003c/h2>\n\u003cp>Congratulations on finishing \u003cstrong>AI Essentials\u003c/strong>. You now have the skills, the toolkit and a plan to make AI genuinely useful in your everyday life. Mark this lesson complete to unlock your certificate of completion, and keep your toolkit close. Ready for the next step, whether that&#39;s AI for your business or hands-on help? \u003ca href=\"https://principeai.vercel.app/courses\">Explore our other courses\u003c/a>.\u003c/p>\n\u003c/section>","text":"Knowing how to use AI and actually using it are two different things. The people who get the most from AI aren't necessarily the most technical. They're the ones who made it a habit. This final lesson gives you a 30-day plan to do exactly that, in about ten minutes a day. How to make it stick Three simple principles make this plan work: Attach it to something you already do. \"After my morning coffee, I'll use AI for one task.\" An existing routine is the best trigger for a new one. Start small. Ten minutes and one task. Small wins build momentum, and momentum builds the habit. Make progress visible. Keep a simple log: the date, the task, a rough guess at the time saved, and one thing you learned. Week 1: Daily wins (days 1-7) Goal: use AI once a day for something real. Day 1: Draft a message you've been putting off. Day 2: Plan tomorrow from a brain dump of everything on your mind. Day 3: Get an explanation of something you've always wondered about, then have the AI quiz you. Day 4: Plan this week's dinners and grocery list. Day 5: Edit something you wrote for clarity, and ask what changed and why. Day 6: Summarize a long article or document with a clear purpose. Day 7: Review your log. Which task saved you the most time? Week 2: Build your system (days 8-14) Goal: set up your toolkit so good habits take no effort. Days 8-9: Write or refine your personal instructions. Days 10-11: Save your five most useful prompts as templates. Day 12: Set up a workspace, or a briefing note, for one ongoing project. Day 13: Try voice or images for one real task. Day 14: Run the three-minute fact-check on an answer you're relying on. Week 3: Go deeper (days 15-21) Goal: use AI for something bigger than a single task. Pick one meaningful project to move forward with AI this week: planning a trip, preparing for an important conversation, learning a new skill or organizing a home project. Each day: Spend ten minutes moving it forward with AI. Try a technique you haven't used yet: the Socratic tutor, a pre-mortem, a weighted comparison or a self-critique. Note what worked. Week 4: Refine and expand (days 22-30) Goal: make AI a natural part of how you work and live. Days 22-24: Improve your three most-used templates with the \"improve my prompt\" technique. Days 25-26: Try AI in an area of your life you haven't used it for yet. Days 27-28: Teach someone else one thing you've learned. Teaching locks in your own skills. Day 29: Review your privacy settings and your never-share rules. Day 30: Reflect with the prompt below, and plan your next month. Here's my log from 30 days of using AI: [PASTE YOUR LOG] Help me reflect: which uses saved me the most time or stress, which didn't help, and what patterns do you notice? Then suggest 3 new ways to use AI next month, based on what has worked for me, each with a prompt template. When you miss a day You will, and that's fine. Don't restart the plan; pick up where you left off. Missing a day doesn't break a habit, but quitting does. If ten minutes feels like too much on a busy day, do a two-minute version: one message, or one quick question. Staying current without the overwhelm AI tools change fast, with new features, new names and new models. You don't need to chase every announcement. The skills you've built in this course last: giving context, iterating, verifying and protecting your privacy work with any assistant, today and in the years ahead. When a new feature appears, ask your assistant to explain it, then try it on one real task. That's all it takes to keep up. Try it now Choose your trigger: \"After I [EXISTING HABIT], I'll use AI for one task.\" Create your log in your notes app with four columns: date, task, time saved and lesson learned. Put a reminder in your calendar for Day 30. Do Day 1 today. Common mistakes Waiting for the perfect use case. Small everyday tasks build the habit. Start with a message. All-or-nothing thinking. A missed day is a pause, not a failure. Only doing what's comfortable. Each week, try one technique you haven't used yet. Key takeaways Tie AI to an existing routine, start with ten minutes a day, and log your wins. Week 1 builds the habit, Week 2 builds the system, Week 3 goes deeper and Week 4 refines. Missed days don't matter much. Consistency over time does. Your core skills (context, iteration, verification and privacy) work with any AI tool, now and in the future. You did it Congratulations on finishing AI Essentials . You now have the skills, the toolkit and a plan to make AI genuinely useful in your everyday life. Mark this lesson complete to unlock your certificate of completion, and keep your toolkit close. Ready for the next step, whether that's AI for your business or hands-on help? Explore our other courses .","blocks":[{"lang":"","text":"Here's my log from 30 days of using AI: [PASTE YOUR LOG]\nHelp me reflect: which uses saved me the most time or stress, which\ndidn't help, and what patterns do you notice? Then suggest 3 new ways\nto use AI next month, based on what has worked for me, each with a\nprompt template."}],"quiz":[{"q":"Which principle does the lesson recommend for making a new AI habit stick?","options":["Wait until you find a big, perfect use case before you start","Spend at least an hour a day so the habit builds faster","Attach it to a routine you already have, like your morning coffee","Restart the whole plan from Day 1 whenever you miss a day"],"answer":2,"explain":"An existing routine is the best trigger for a new one, as in \"After my morning coffee, I'll use AI for one task.\" Starting small and keeping a simple log also help the habit stick."},{"q":"You're on Day 12 of the plan and a busy week makes you miss three days in a row. What should you do?","options":["Start the 30-day plan over from Day 1 so you do it properly","Make up for the missed days by doing all of them at once","Stop the plan, since missed days mean the habit has failed","Pick up where you left off, with a two-minute version if needed"],"answer":3,"explain":"Don't restart the plan; pick up where you left off. Missing a day doesn't break a habit, but quitting does, and on a busy day you can do a two-minute version."},{"q":"A new AI feature is announced and you're worried about falling behind. What does the lesson suggest?","options":["Ask your assistant to explain it, then try it on one real task","Switch to whichever assistant launched the newest feature","Follow every announcement closely so you never miss a change","Ignore it, since new features never matter for everyday use"],"answer":0,"explain":"You don't need to chase every announcement, because context, iteration, verification and privacy work with any assistant. When a new feature appears, ask your assistant to explain it, then try it on one real task."}],"videoUrl":null}],"totalMin":194,"siteUrl":"https://principeai.vercel.app","contactEmail":"principeconsults@gmail.com","licensee":null,"welcomeVideoUrl":null,"builtAt":"2026-10-20T13:53:29.124Z"}</script>

  /* ── State ─────────────────────────────────────────── */
  function loadState() {
    try {

    }
    return {};
  }
  const state = Object.assign({ done: {}, checks: {}, notes: {}, quiz: {}, last: null, name: "", theme: "system", completedAt: null }, loadState());
  function save() {
    try {

    }
  }

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const doneCount = () => LESSONS.filter((l) => state.done[l.slug]).length;

  function fmtDuration(min) {

    const m = min % 60;
    return h ? h + "h " + String(m).padStart(2, "0") + "m" : m + " min";
  }
  function splitTitle(t) {
    const i = t.indexOf(":");
    return i < 0 ? esc(t) : esc(t.slice(0, i + 1)) + " <em>" + esc(t.slice(i + 1).trim()) + "</em>";
  }
  function nextUp() {
    const last = state.last && BY_SLUG.get(state.last);
    if (last && !state.done[last.slug]) return last;
    const start = last ? last.n - 1 : 0;
    return LESSONS.slice(start).concat(LESSONS.slice(0, start)).find((l) => !state.done[l.slug]) || null;
  }

    '<form class="side-search" role="search" id="search-form"><label class="sr-only" for="q">Search lessons and prompts</label>' + ICON.search +

    "</aside>" +

    '<div class="view" id="view"></div>' +
    "</main></div>" +
    '<div class="toast" id="toast" role="status" aria-live="polite"></div>';

  const $ = (sel, root) => (root || document).querySelector(sel);

  const app = $("#app");

  /* Theme */
  const dark = window.matchMedia("(prefers-color-scheme: dark)");
  function applyTheme() {
    const mode = state.theme === "system" ? (dark.matches ? "dark" : "light") : state.theme;

  }
  if (dark.addEventListener) dark.addEventListener("change", applyTheme);
  $("#theme-btn").addEventListener("click", () => {
    state.theme = { system: "light", light: "dark", dark: "system" }[state.theme] || "system";
    save();

  applyTheme();

  $("#reset-btn").addEventListener("click", () => {
    if (!window.confirm("Reset your progress, quiz answers, checklists and notes for this course on this device?")) return;
    Object.assign(state, { done: {}, checks: {}, notes: {}, quiz: {}, last: null, completedAt: null });
    save();
    location.hash = "#/";

  /* Mobile drawer */
  function setNav(open) {
    app.classList.toggle("nav-open", open);

  }
  $("#menu-btn").addEventListener("click", () => setNav(!app.classList.contains("nav-open")));

  /* Search box */
  const q = $("#q");
  let searchTimer;
  function goSearch(value, push) {
    const target = value.trim() ? "#/search/" + encodeURIComponent(value.trim()) : "#/";
    if (push) location.hash = target;
    else {
      history.replaceState(null, "", target);
      render();
    }
  }
  q.addEventListener("input", () => {
    clearTimeout(searchTimer);

  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if (e.key === "Escape") setNav(false);
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") {
      e.preventDefault();
      setNav(true);
      q.focus();
    }
    const lesson = currentLesson();
    if (lesson && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const target = LESSONS[lesson.n - 1 + (e.key === "ArrowRight" ? 1 : -1)];
      if (target) location.hash = lessonHref(target);

  });

  /* ── Router ────────────────────────────────────────── */
  function parseRoute() {
    const parts = location.hash.replace(/^#\/?/, "").split("/");
    return { name: parts[0] || "home", arg: decodeURIComponent(parts.slice(1).join("/")) };
  }
  function currentLesson() {
    const r = parseRoute();
    return r.name === "lesson" ? BY_SLUG.get(r.arg) : null;
  }
  function render() {
    const r = parseRoute();
    view.className = "view";
    if (r.name === "lesson" && BY_SLUG.has(r.arg)) renderLesson(BY_SLUG.get(r.arg));
    else if (r.name === "prompts") renderPrompts(r.arg);
    else if (r.name === "search") renderSearch(r.arg);
    else if (r.name === "notes") renderNotes();
    else if (r.name === "certificate") renderCertificate();
    else renderHome();
    if (r.name !== "search" && document.activeElement !== q) q.value = "";
    updateSide(r);
    setNav(false);
    window.scrollTo(0, 0);
    const h1 = $("h1", view);
    if (h1 && r.name !== "search") {
      h1.setAttribute("tabindex", "-1");
      h1.focus({ preventScroll: true });
    }
  }
  window.addEventListener("hashchange", render);

  function updateSide(r) {
    const done = doneCount();
    $("#side-progress").textContent = done + " of " + LESSONS.length + " lessons complete";
    $("#side-bar").style.width = pct() + "%";
    $("#top-pct").textContent = pct() + "%";
    $$(".nav a").forEach((a) => a.toggleAttribute("aria-current", a.dataset.nav === r.name || (r.name === "home" && a.dataset.nav === "home")));
    $$(".nav a[aria-current]").forEach((a) => a.setAttribute("aria-current", "page"));
    $$(".lessons a").forEach((a) => {
      const active = r.name === "lesson" && a.dataset.lesson === r.arg;
      a.toggleAttribute("aria-current", active);
      if (active) a.setAttribute("aria-current", "page");
      a.parentElement.classList.toggle("done", !!state.done[a.dataset.lesson]);
    });
    DATA.modules.forEach((m) => {
      const n = m.lessons.filter((s) => state.done[s]).length;
      $('[data-mod="' + m.n + '"]').textContent = n + "/" + m.lessons.length;
    });
    const active = $(".lessons a[aria-current]");
    if (active && window.innerWidth > 960) active.scrollIntoView({ block: "nearest" });
  }

  /* ── Home ──────────────────────────────────────────── */
  function renderHome() {
    document.title = DATA.title + " · Principe AI";
    const done = doneCount();
    const next = nextUp();
    const started = done > 0 || !!state.last;
    const cta = next || LESSONS[0];
    const ctaLabel = !started ? "Start the course" : next ? "Continue: Lesson " + next.n : "Review the course";
    view.innerHTML =
      '<section class="hero">' +
      '<div class="hero-emoji" aria-hidden="true">' + esc(DATA.emoji) + "</div>" +

      '<p class="lead">' + esc(DATA.subtitle) + "</p>" +
      '<div class="chips">' +
      '<span class="chip">' + ICON.signal + esc(DATA.level) + "</span>" +
      '<span class="chip">' + ICON.layers + DATA.modules.length + " modules · " + LESSONS.length + " lessons</span>" +
      '<span class="chip">' + ICON.clock + fmtDuration(DATA.totalMin) + "</span>" +
      '<span class="chip">' + ICON.wifi + "Works offline</span></div>" +
      '<div class="hero-cta"><a class="btn primary" href="' + lessonHref(cta) + '">' + ctaLabel + ICON.right + "</a>" +
      '<a class="btn secondary" href="#/prompts">' + ICON.sparkles + "Browse " + TOTAL_PROMPTS + " prompts</a></div>" +
      (started
        ? '<div class="hero-progress"><div>' + done + " of " + LESSONS.length + " lessons complete · " + pct() + '%</div><div class="bar"><span style="width:' + pct() + '%"></span></div></div>'
        : "") +
      "</section>" +
      (DATA.welcomeVideoUrl
        ? '<a class="video" href="' + esc(DATA.welcomeVideoUrl) + '" target="_blank" rel="noopener"><span class="play">' + ICON.play + "</span><span><strong>Watch the welcome video</strong><span>Opens in your browser · needs an internet connection</span></span></a>"
        : "") +
      '<section class="section"><h2>What you\'ll be able to do</h2><p class="sub">By the end of this course you\'ll be able to:</p><div class="grid2">' +

      "</div></section>" +
      '<section class="section"><h2>How this course works</h2><p class="sub">Short lessons, real practice, and a clear finish line.</p><div class="steps">' +
      step("Learn the idea", "Read each short lesson" + (LESSONS.some((l) => l.videoUrl) ? " and watch its video" : "") + ". Every one ends with the key takeaways.") +
      step("Try it with AI", "Copy the ready-made prompts into Claude, ChatGPT, Gemini or Copilot and adapt them to you.") +
      step("Check yourself", "Answer three quick questions at the end of each lesson and keep notes as you go.") +
      step("Get certified", "Mark every lesson complete to unlock your certificate of completion.") +
      "</div></section>" +
      '<section class="section"><h2>Course map</h2><p class="sub">' + DATA.modules.length + " modules, " + LESSONS.length + " lessons. Take them in order or jump to what you need.</p><div class=\"modmap\">" +
      DATA.modules
        .map((m) => {
          const ls = m.lessons.map((s) => BY_SLUG.get(s));
          const n = ls.filter((l) => state.done[l.slug]).length;
          return (
            '<div class="card modcard"><header><span class="modnum">' + m.n + '</span><div><h3>' + esc(m.title) + '</h3><div class="faint">' + ls.length + " lessons · " +
            fmtDuration(ls.reduce((s, l) => s + l.durationMin, 0)) + '</div></div><span class="mini">' + n + "/" + ls.length + " done</span></header><ul class=\"rows\">" +
            ls
              .map(
                (l) =>
                  '<li><a href="' + lessonHref(l) + '"><span class="n">' + l.n + '</span><span class="nm">' + esc(l.title) + "</span>" +
                  (state.done[l.slug] ? '<span class="pill">Done</span>' : '<span class="du">' + l.durationMin + " min</span>") + "</a></li>",
              )

            "</ul></div>"

        })
        .join("") +
      "</div></section>" +
      '<section class="section"><h2>About this course</h2><div class="about">' + DATA.descriptionHtml + "</div></section>" +
      '<section class="section"><div class="card help"><p><strong>Questions or stuck on something?</strong><br><span class="muted">Email <a href="mailto:' + esc(DATA.contactEmail) + '">' + esc(DATA.contactEmail) + "</a> and we'll help.</span></p>" +
      '<a class="btn secondary" href="' + esc(DATA.siteUrl) + '/book" target="_blank" rel="noopener">Book a free strategy call</a></div></section>';
  }
  function step(title, text) {

  }

  /* ── Lesson ────────────────────────────────────────── */
  function renderLesson(l) {
    document.title = l.title + " · " + DATA.shortTitle;
    state.last = l.slug;
    save();
    const prev = LESSONS[l.n - 2];
    const next = LESSONS[l.n];
    const done = !!state.done[l.slug];
    view.innerHTML =
      '<article class="lesson">' +
      '<div class="crumbs"><a href="#/">' + esc(DATA.shortTitle) + '</a><span class="dot">/</span><span>Module ' + l.module + " · " + esc(l.moduleTitle) + "</span></div>" +
      '<p class="kicker">Lesson ' + l.n + " of " + LESSONS.length + "</p>" +
      '<h1 class="display">' + esc(l.title) + "</h1>" +
      '<p class="lead">' + esc(l.summary) + "</p>" +
      '<div class="lesson-meta"><span class="chip">' + ICON.clock + l.durationMin + " min read</span>" +
      (l.blocks.length ? '<span class="chip">' + ICON.sparkles + l.blocks.length + " ready-to-copy " + (l.blocks.length === 1 ? "block" : "blocks") + "</span>" : "") +
      (done ? '<span class="pill">Completed</span>' : "") + "</div>" +
      (l.videoUrl
        ? '<a class="video" href="' + esc(l.videoUrl) + '" target="_blank" rel="noopener"><span class="play">' + ICON.play + "</span><span><strong>Watch the lesson video</strong><span>Opens in your browser · needs an internet connection</span></span></a>"
        : "") +
      '<div class="prose" id="lesson-body">' + l.html + "</div>" +
      quizHtml(l) +
      '<div class="notes"><label for="note">Your notes <span id="note-status">Saved on this device</span></label>' +
      '<textarea id="note" placeholder="Ideas, prompts that worked for you, things to try next…">' + esc(state.notes[l.slug] || "") + "</textarea></div>" +
      '<nav class="pager" aria-label="Lesson navigation"><div>' +
      (prev ? '<a class="btn ghost prev" href="' + lessonHref(prev) + '">' + ICON.left + "Previous</a>" : "") +
      '</div><div class="right">' +
      '<button type="button" class="btn ' + (done ? "done" : "secondary") + '" data-toggle>' + (done ? ICON.check + "Completed" : "Mark complete") + "</button>" +
      (next
        ? '<button type="button" class="btn primary" data-next>' + (done ? "Next lesson" : "Complete & continue") + ICON.right + "</button>"
        : '<button type="button" class="btn primary" data-finish>' + (done ? "Get your certificate" : "Finish the course") + ICON.right + "</button>") +
      "</div></nav></article>";

    enhance($("#lesson-body"), l);
    const quiz = $(".quiz", view);
    if (quiz) {
      paintQuiz(quiz, l);
      quiz.addEventListener("click", (e) => {
        const opt = e.target.closest(".opt");
        if (opt && !opt.disabled) {
          const qi = +opt.closest(".q").dataset.q;
          state.quiz[l.slug] = Object.assign({}, state.quiz[l.slug], { [qi]: +opt.dataset.o });
          save();
          paintQuiz(quiz, l);
        } else if (e.target.closest("[data-retake]")) {
          delete state.quiz[l.slug];
          save();
          paintQuiz(quiz, l);
          $(".opt", quiz).focus();
        }
      });

    const note = $("#note");
    let noteTimer;
    note.addEventListener("input", () => {
      $("#note-status").textContent = "Saving…";
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => {
        if (note.value.trim()) state.notes[l.slug] = note.value;
        else delete state.notes[l.slug];
        save();
        $("#note-status").textContent = "Saved on this device";
      }, 400);
    });

    $("[data-toggle]", view).addEventListener("click", () => {
      setDone(l, !state.done[l.slug]);
      renderLessonState(l);
    });
    const nextBtn = $("[data-next]", view);
    if (nextBtn)
      nextBtn.addEventListener("click", () => {
        if (!state.done[l.slug]) setDone(l, true);
        location.hash = lessonHref(next);
      });
    const finish = $("[data-finish]", view);
    if (finish)
      finish.addEventListener("click", () => {
        if (!state.done[l.slug]) setDone(l, true);
        location.hash = "#/certificate";
      });
  }
  function renderLessonState(l) {
    const y = window.scrollY;
    renderLesson(l);
    updateSide(parseRoute());
    window.scrollTo(0, y);
  }
  function setDone(l, value) {
    if (value) state.done[l.slug] = 1;
    else delete state.done[l.slug];
    if (doneCount() === LESSONS.length && !state.completedAt) state.completedAt = new Date().toISOString();
    save();
    if (value) toast("Lesson " + l.n + " complete · " + doneCount() + " of " + LESSONS.length + " done");
  }

  function blockHtml(text, lang) {
    return (
      '<div class="block"><div class="block-head">' + ICON.sparkles + "<span>" + (LANGS[lang] || "Ready to copy") + "</span>" +
      '<button type="button" class="copy" aria-label="Copy to clipboard">' + ICON.copy + "<span>Copy</span></button></div><pre><code>" + esc(text) + "</code></pre></div>"
    );
  }
  function enhance(root, l) {
    $$("pre", root).forEach((pre) => {
      const code = pre.querySelector("code");
      const lang = ((code && code.className.match(/language-(\w+)/)) || [])[1];
      const wrap = document.createElement("div");
      wrap.innerHTML = blockHtml("", lang);
      const block = wrap.firstChild;
      const placeholder = block.querySelector("pre");
      pre.replaceWith(block);
      placeholder.replaceWith(pre);
    });
    $$("table", root).forEach((t) => {
      const w = document.createElement("div");
      w.className = "table-wrap";
      t.replaceWith(w);
      w.appendChild(t);
    });
    $$('a[href^="http"]', root).forEach((a) => {
      a.target = "_blank";
      a.rel = "noopener";
    });
    $$(".sec-exercise", root).forEach((sec, si) => {
      $$(":scope > ol > li, :scope > ul > li", sec).forEach((li, i) => {
        const key = l.slug + ":" + si + ":" + i;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.className = "cbx";
        cb.setAttribute("aria-label", "Mark step " + (i + 1) + " done");
        cb.checked = !!state.checks[key];
        li.classList.add("chk");
        li.classList.toggle("is-done", cb.checked);
        cb.addEventListener("change", () => {
          if (cb.checked) state.checks[key] = 1;
          else delete state.checks[key];
          li.classList.toggle("is-done", cb.checked);
          save();
        });
        li.prepend(cb);
      });
    });
  }
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".copy");
    if (!btn) return;
    copyText(btn.closest(".block").querySelector("pre").textContent, btn);
  });
  function copyText(text, btn) {
    const ok = () => {
      btn.classList.add("ok");
      btn.querySelector("span").textContent = "Copied";
      setTimeout(() => {
        btn.classList.remove("ok");
        btn.querySelector("span").textContent = "Copy";
      }, 1600);
    };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch {
        copied = false;
      }
      ta.remove();
      if (copied) ok();
      else toast("Couldn't copy automatically. Select the text and copy it.");
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  function quizHtml(l) {
    if (!l.quiz.length) return "";
    return (
      '<section class="quiz" aria-labelledby="quiz-h"><div class="quiz-head"><p class="kicker">Knowledge check</p><h2 id="quiz-h">Check your understanding</h2>' +
      "<p>" + l.quiz.length + " quick questions. Pick an answer to see why it's right.</p></div><ol>" +
