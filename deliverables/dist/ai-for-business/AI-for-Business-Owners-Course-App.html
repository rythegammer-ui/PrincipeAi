r first three from that shortlist in the next lesson.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Score every opportunity on Impact, Ease and Risk with shared rubrics, then rank by Impact × Ease × (6 − Risk).\u003c/li>\n\u003cli>The best first project is often work that isn&#39;t happening at all, like consistent follow-up.\u003c/li>\n\u003cli>High-risk tasks aren&#39;t banned; they&#39;re sequenced later, with guardrails.\u003c/li>\n\u003cli>Lower the risk or raise the ease, then re-score. Scoring is a tool for thinking, not a verdict.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Your inventory probably has 30 or more tasks, and you can't tackle them all. The most common mistake at this stage is starting with the most exciting idea rather than the most valuable one. A simple scoring model keeps you honest and gives you a ranked list you can defend to your team, your business partner or yourself. The three scores Score each task from 1 to 5 on three dimensions. Use the rubrics so everyone scores the same way. Impact: how much value if it works? Consider all four payoffs from Lesson 1. Score Impact means 1 A minor convenience; saves under an hour a month 2 Saves 1 to 4 hours a month, or slightly improves quality 3 Saves 4 to 10 hours a month, or is noticeably faster or better for customers 4 Saves 10 to 20 hours a month, or directly affects leads and sales 5 Saves 20+ hours a month, or materially changes revenue, capacity or customer experience Ease: how easy is it to implement with off-the-shelf tools? Score Ease means 5 Works with a good prompt in an assistant you already use; the inputs are at hand 4 Needs a template, a couple of examples and a short written process 3 Needs a reference document set up first (price list, FAQ, voice guide) or a simple no-code automation 2 Needs several tools connected, or data cleaned up first 1 Needs custom development, or the knowledge isn't written down anywhere Risk: what happens if it goes wrong? Here, a higher number means more risk. Score Risk means 1 Internal only, easy to check, no sensitive data 2 Internal; a mistake costs a little time 3 Customer-facing, but a person reviews it before it goes out 4 Involves personal or confidential data, or mistakes could cost money or trust 5 Legal, financial, health, safety or employment consequences, or a regulated activity The formula Priority = Impact × Ease × (6 − Risk) Subtracting risk from 6 flips it, so a safer task scores higher. Scores range from 1 to 125. As a rough guide: 60 and above: strong candidate for your first projects 30 to 59: worth doing later, or after you reduce the risk or raise the ease Below 30: park it for now High-risk tasks score low by design. That doesn't mean \"never.\" It means \"not first, and not without strong guardrails and, where relevant, professional advice.\" A worked example Imagine a hypothetical nine-person home renovation company. Here's part of its scored inventory: Task Hours/month Impact Ease Risk Priority Follow up after sending a quote 6 4 5 2 4 × 5 × 4 = 80 Weekly progress emails to clients 12 4 4 3 4 × 4 × 3 = 48 Draft quotes from site-visit notes 24 5 3 3 5 × 3 × 3 = 45 Turn job photos into social posts 5 2 5 2 2 × 5 × 4 = 40 Reply to common inquiry questions 10 3 4 3 3 × 4 × 3 = 36 Summarize supplier contracts 2 2 4 4 2 × 4 × 2 = 16 Screen job applicants 4 3 3 5 3 × 3 × 1 = 9 What the scores reveal: Quote follow-up wins even though it takes few hours today, because it touches revenue directly, is easy to set up and is low risk. Often the biggest opportunity is work that isn't happening. Quote drafting has the most hours but scores lower because it needs a usable price list and scope templates first. That makes it a perfect second project once those exist. Applicant screening ranks last. Employment decisions carry legal and fairness risk. AI can help write the job ad and interview guide (Module 5) without judging candidates. Adjust for reality Scores are a starting point, not a verdict. Before you finalize, run three checks: Gut check. If a ranking feels wrong, look for a scoring error or a hidden factor, such as a task being someone's favorite part of their job. Dependencies. Some projects unlock others. A brand voice guide improves every marketing task; a written price list makes quote drafting possible. Give enabling projects a bump. Reduce risk to raise the score. Remove personal data, keep it internal at first, or add a review step, then score again. Many 30s become 60s this way. Let AI challenge your scores You know your business better than any AI, but a sparring partner helps you spot blind spots. Act as a skeptical operations consultant. Below is my AI opportunity list with Impact, Ease and Risk scores from 1 to 5 (for Risk, 5 = highest risk). Priority = Impact x Ease x (6 - Risk). For each task: 1. Say whether any score looks too optimistic or too pessimistic, and why. 2. Name the biggest risk I may have missed. 3. Suggest one practical way to lower the risk or raise the ease. Then list my top five tasks in priority order. Be direct and don't flatter my choices. My list: \"\"\" [PASTE YOUR SCORED TABLE] \"\"\" Treat the response as input, not instruction. If the AI raises a fair point, change the score. If it doesn't understand your business, ignore it. Do this now Add Impact, Ease, Risk and Priority columns to your inventory. Score every task that takes two or more hours a month (or your top 20 by hours), calculate the priority, and sort from highest to lowest. Highlight your top eight. You'll choose your first three from that shortlist in the next lesson. Key takeaways Score every opportunity on Impact, Ease and Risk with shared rubrics, then rank by Impact × Ease × (6 − Risk). The best first project is often work that isn't happening at all, like consistent follow-up. High-risk tasks aren't banned; they're sequenced later, with guardrails. Lower the risk or raise the ease, then re-score. Scoring is a tool for thinking, not a verdict.","blocks":[{"lang":"","text":"Act as a skeptical operations consultant. Below is my AI opportunity list with Impact, Ease and Risk scores from 1 to 5 (for Risk, 5 = highest risk). Priority = Impact x Ease x (6 - Risk).\n\nFor each task:\n1. Say whether any score looks too optimistic or too pessimistic, and why.\n2. Name the biggest risk I may have missed.\n3. Suggest one practical way to lower the risk or raise the ease.\n\nThen list my top five tasks in priority order. Be direct and don't flatter my choices.\n\nMy list:\n\"\"\"\n[PASTE YOUR SCORED TABLE]\n\"\"\""}],"quiz":[{"q":"In the lesson's formula, Priority = Impact × Ease × (6 − Risk), why is Risk subtracted from 6?","options":["To keep every priority score at or below a maximum of 60","To give risky tasks a bonus, because they usually matter most","To make Risk count for less than Impact and Ease combined","To flip the scale, so a safer task gets a higher priority score"],"answer":3,"explain":"The lesson explains that subtracting Risk from 6 flips it, so a lower-risk task produces a higher priority score."},{"q":"A bakery owner scores 'Reply to wholesale inquiries' as Impact 4, Ease 4, Risk 3. What is its priority, and where does it land in the lesson's rough guide?","options":["48: a strong candidate for the first projects","48: worth doing later, or after lowering risk or raising ease","64: a strong candidate for the first projects","16: low enough that it should be parked for now"],"answer":1,"explain":"4 × 4 × (6 − 3) = 48, and the lesson's guide puts 30 to 59 in the 'worth doing later, or after you reduce the risk or raise the ease' band."},{"q":"A car repair shop's task 'Summarize customer complaints' scores in the 30s, mainly because the complaints include customers' names and contact details. What does the lesson suggest?","options":["Drop it for good, since anything under 60 is off the table","Raise its Impact score until the priority clears 60","Remove the personal data or add a review step, then re-score","Move it to the top, because complaints affect revenue"],"answer":2,"explain":"One of the lesson's reality checks is to reduce risk to raise the score, for example by removing personal data, keeping it internal or adding a review step, then scoring again; many 30s become 60s this way."}],"videoUrl":null},{"n":4,"slug":"choose-your-first-three","title":"Choose Your First Three Projects","summary":"Pick a balanced starting portfolio (a quick win, a core workflow and a growth bet) and write a one-page brief for each.","durationMin":13,"module":1,"moduleTitle":"The AI Opportunity Audit","html":"\u003csection class=\"sec sec-intro\">\u003cp>The top of your scored list is a shortlist, not a plan. Choosing well matters more than it looks, because your first projects shape how your whole team feels about AI. A visible early win builds momentum. A messy, overambitious first project can set adoption back by months.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Why three, and not ten\u003c/h2>\n\u003cp>Each project needs an owner, a little setup, testing and a change in someone&#39;s habits. Three projects in parallel is about as much as a small business can carry while still running day to day. Start ten and you&#39;ll likely finish none.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The balanced portfolio\u003c/h2>\n\u003cp>Pick one project from each category:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>The quick win (live within days).\u003c/strong> High ease, low risk. It proves AI works in \u003cem>your\u003c/em> business and builds confidence. Examples: meeting summaries, first drafts of inquiry replies, turning notes into tidy documents.\u003c/li>\n\u003cli>\u003cstrong>The core workflow (two to four weeks).\u003c/strong> A high-hours process that eats real time every week. Examples: quotes and proposals, weekly client updates, writing SOPs.\u003c/li>\n\u003cli>\u003cstrong>The growth bet (two to four weeks).\u003c/strong> Something tied to revenue. Examples: consistent lead follow-up, reactivating past customers, a content engine that keeps you visible.\u003c/li>\n\u003c/ol>\n\u003cp>This mix gives you an early success, meaningful time back and a shot at measurable growth, without betting everything on one idea.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Selection filters\u003c/h2>\n\u003cp>Before you commit, every project should pass these checks:\u003c/p>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> There&#39;s a named owner who does this work today and wants it improved\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> You can measure a baseline now (time, response speed, volume or conversion)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> The inputs are already digital, or easy to make digital\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> A person can review the output in much less time than creating it from scratch\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Failure would be cheap and reversible\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> It needs no sensitive data, or you have an approved tool and process for that data (Lesson 7)\u003c/li>\n\u003c/ul>\n\u003cp>If a project fails a check, either fix the gap or swap in the next project on your list.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Write a one-page project brief\u003c/h2>\n\u003cp>A short brief turns a good idea into a project someone can actually run. Copy this into a document for each project:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Section\u003c/th>\n\u003cth>Your answer\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Project name\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Payoff type\u003c/td>\n\u003ctd>Time / Quality / Speed / Revenue\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Problem today\u003c/td>\n\u003ctd>What&#39;s slow, inconsistent or not happening?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Current process\u003c/td>\n\u003ctd>The steps as they happen today\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>New process with AI\u003c/td>\n\u003ctd>The new steps, including where AI drafts and where a person reviews\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Owner\u003c/td>\n\u003ctd>One person, not a committee\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tools\u003c/td>\n\u003ctd>Which assistant, templates and reference documents\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Baseline metric\u003c/td>\n\u003ctd>For example, 90 minutes per proposal, or replies within one business day\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Target\u003c/td>\n\u003ctd>For example, 40 minutes per proposal including review\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Human review rule\u003c/td>\n\u003ctd>Who checks what before anything goes out\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Data rules\u003c/td>\n\u003ctd>What may and may not go into the AI tool\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What done looks like\u003c/td>\n\u003ctd>The concrete outcome at the end of the pilot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Review date\u003c/td>\n\u003ctd>When you&#39;ll compare results with the baseline\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>A hypothetical example\u003c/h2>\n\u003cp>Imagine a four-person bookkeeping firm choosing its first three:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Quick win:\u003c/strong> client emails explaining common topics (deadlines, documents needed, what a report shows) are drafted from a library of approved explanations. A partner reviews every one before it&#39;s sent.\u003c/li>\n\u003cli>\u003cstrong>Core workflow:\u003c/strong> monthly report commentary. The firm&#39;s accounting software produces the numbers; AI drafts a plain-English summary; the accountant checks every figure against the report.\u003c/li>\n\u003cli>\u003cstrong>Growth bet:\u003c/strong> a quarterly newsletter and a friendly check-in email to past clients, produced with the content engine from Module 3.\u003c/li>\n\u003c/ul>\n\u003cp>Notice what&#39;s missing: anything where AI gives financial advice or touches raw client data in an unapproved tool.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Avoid the classic first-project traps\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>A fully automated customer-facing chatbot as project one.\u003c/strong> Start with drafts a person sends. Earn the right to automate.\u003c/li>\n\u003cli>\u003cstrong>The pet project.\u003c/strong> If the owner&#39;s favorite idea scored 30, it waits like everything else.\u003c/li>\n\u003cli>\u003cstrong>Buying a new tool first.\u003c/strong> Prove the workflow with the assistant you already have, then decide what to buy.\u003c/li>\n\u003cli>\u003cstrong>No baseline.\u003c/strong> If you don&#39;t measure &quot;before,&quot; you can&#39;t prove &quot;after.&quot;\u003c/li>\n\u003cli>\u003cstrong>Side-of-desk projects.\u003c/strong> Give each owner protected time, even just two hours a week.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Use AI to draft your briefs\u003c/h2>\n\u003cpre>\u003ccode>Help me write a one-page project brief for an AI pilot in my business.\n\nProject: [NAME]\nWhat happens today, step by step: [DESCRIBE THE CURRENT PROCESS]\nWho does it, how often and how long it takes: [DETAILS]\n\nBefore writing, ask me up to eight questions to fill any gaps. Then produce the brief with these sections: Payoff type, Problem today, Current process, New process with AI, Owner, Tools, Baseline metric, Target, Human review rule, Data rules, What done looks like, Review date.\n\nKeep the new process realistic for off-the-shelf AI tools and a small team, and flag anything that sounds risky.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Choose your three projects using the portfolio and filters above, then write a brief for each. This week, before changing anything, measure the baseline for all three. Finally, put a 30-minute review in your calendar four weeks from today. Module 6 shows you exactly what to do in that meeting.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Start with three projects: a quick win, a core workflow and a growth bet.\u003c/li>\n\u003cli>Every project needs an owner, a baseline, digital inputs, a review rule and cheap failure.\u003c/li>\n\u003cli>A one-page brief turns an idea into something that actually gets done.\u003c/li>\n\u003cli>Earn the right to automate: begin with AI drafts that a person reviews and sends.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"The top of your scored list is a shortlist, not a plan. Choosing well matters more than it looks, because your first projects shape how your whole team feels about AI. A visible early win builds momentum. A messy, overambitious first project can set adoption back by months. Why three, and not ten Each project needs an owner, a little setup, testing and a change in someone's habits. Three projects in parallel is about as much as a small business can carry while still running day to day. Start ten and you'll likely finish none. The balanced portfolio Pick one project from each category: The quick win (live within days). High ease, low risk. It proves AI works in your business and builds confidence. Examples: meeting summaries, first drafts of inquiry replies, turning notes into tidy documents. The core workflow (two to four weeks). A high-hours process that eats real time every week. Examples: quotes and proposals, weekly client updates, writing SOPs. The growth bet (two to four weeks). Something tied to revenue. Examples: consistent lead follow-up, reactivating past customers, a content engine that keeps you visible. This mix gives you an early success, meaningful time back and a shot at measurable growth, without betting everything on one idea. Selection filters Before you commit, every project should pass these checks: There's a named owner who does this work today and wants it improved You can measure a baseline now (time, response speed, volume or conversion) The inputs are already digital, or easy to make digital A person can review the output in much less time than creating it from scratch Failure would be cheap and reversible It needs no sensitive data, or you have an approved tool and process for that data (Lesson 7) If a project fails a check, either fix the gap or swap in the next project on your list. Write a one-page project brief A short brief turns a good idea into a project someone can actually run. Copy this into a document for each project: Section Your answer Project name Payoff type Time / Quality / Speed / Revenue Problem today What's slow, inconsistent or not happening? Current process The steps as they happen today New process with AI The new steps, including where AI drafts and where a person reviews Owner One person, not a committee Tools Which assistant, templates and reference documents Baseline metric For example, 90 minutes per proposal, or replies within one business day Target For example, 40 minutes per proposal including review Human review rule Who checks what before anything goes out Data rules What may and may not go into the AI tool What done looks like The concrete outcome at the end of the pilot Review date When you'll compare results with the baseline A hypothetical example Imagine a four-person bookkeeping firm choosing its first three: Quick win: client emails explaining common topics (deadlines, documents needed, what a report shows) are drafted from a library of approved explanations. A partner reviews every one before it's sent. Core workflow: monthly report commentary. The firm's accounting software produces the numbers; AI drafts a plain-English summary; the accountant checks every figure against the report. Growth bet: a quarterly newsletter and a friendly check-in email to past clients, produced with the content engine from Module 3. Notice what's missing: anything where AI gives financial advice or touches raw client data in an unapproved tool. Avoid the classic first-project traps A fully automated customer-facing chatbot as project one. Start with drafts a person sends. Earn the right to automate. The pet project. If the owner's favorite idea scored 30, it waits like everything else. Buying a new tool first. Prove the workflow with the assistant you already have, then decide what to buy. No baseline. If you don't measure \"before,\" you can't prove \"after.\" Side-of-desk projects. Give each owner protected time, even just two hours a week. Use AI to draft your briefs Help me write a one-page project brief for an AI pilot in my business. Project: [NAME] What happens today, step by step: [DESCRIBE THE CURRENT PROCESS] Who does it, how often and how long it takes: [DETAILS] Before writing, ask me up to eight questions to fill any gaps. Then produce the brief with these sections: Payoff type, Problem today, Current process, New process with AI, Owner, Tools, Baseline metric, Target, Human review rule, Data rules, What done looks like, Review date. Keep the new process realistic for off-the-shelf AI tools and a small team, and flag anything that sounds risky. Do this now Choose your three projects using the portfolio and filters above, then write a brief for each. This week, before changing anything, measure the baseline for all three. Finally, put a 30-minute review in your calendar four weeks from today. Module 6 shows you exactly what to do in that meeting. Key takeaways Start with three projects: a quick win, a core workflow and a growth bet. Every project needs an owner, a baseline, digital inputs, a review rule and cheap failure. A one-page brief turns an idea into something that actually gets done. Earn the right to automate: begin with AI drafts that a person reviews and sends.","blocks":[{"lang":"","text":"Help me write a one-page project brief for an AI pilot in my business.\n\nProject: [NAME]\nWhat happens today, step by step: [DESCRIBE THE CURRENT PROCESS]\nWho does it, how often and how long it takes: [DETAILS]\n\nBefore writing, ask me up to eight questions to fill any gaps. Then produce the brief with these sections: Payoff type, Problem today, Current process, New process with AI, Owner, Tools, Baseline metric, Target, Human review rule, Data rules, What done looks like, Review date.\n\nKeep the new process realistic for off-the-shelf AI tools and a small team, and flag anything that sounds risky."}],"quiz":[{"q":"Why does the lesson recommend starting with three AI projects rather than ten?","options":["Each needs an owner, setup and new habits, and three is what a small team can carry","Most AI tools limit how many separate projects a single account can run at once","With ten projects running, it becomes impossible to measure any of the baselines","Three projects is the minimum a business needs to justify buying a new AI tool"],"answer":0,"explain":"The lesson says each project needs an owner, a little setup, testing and a change in someone's habits, and three in parallel is about as much as a small business can carry while still running day to day."},{"q":"A four-person marketing agency has chosen meeting summaries as its quick win and weekly client reports as its core workflow. Which third project best completes the balanced portfolio?","options":["Writing SOPs for the office's internal onboarding checklist","A fully automated chatbot that answers client questions alone","Reactivating past clients with a consistent check-in campaign","Summarizing the transcripts of internal team meetings"],"answer":2,"explain":"The third slot is a growth bet tied to revenue, and the lesson gives reactivating past customers as an example; a fully automated customer-facing chatbot is listed as a first-project trap."},{"q":"Two weeks into an AI pilot for drafting quotes, a pet-grooming business owner feels it's saving time but can't show by how much. Which first-project trap from the lesson did she fall into?","options":["The pet project","No baseline","Side-of-desk projects","Buying a new tool first"],"answer":1,"explain":"The lesson warns that if you don't measure 'before,' you can't prove 'after,' which is why every project needs a baseline measured before anything changes."}],"videoUrl":null},{"n":5,"slug":"business-prompt-framework","title":"The Business Brief: Prompts That Produce Usable Work","summary":"A six-part prompt structure that turns AI from a novelty into a dependable assistant, plus templates you can reuse today.","durationMin":16,"module":2,"moduleTitle":"Prompting for Business","html":"\u003csection class=\"sec sec-intro\">\u003cp>The difference between &quot;AI is a toy&quot; and &quot;AI saves me five hours a week&quot; is almost always the brief. Treat a prompt the way you&#39;d delegate to a capable new hire: they&#39;re smart and fast, but they know nothing about your business, your customers or your standards unless you tell them. Vague delegation gets vague work, from people and from AI.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The six-part business brief\u003c/h2>\n\u003cp>Strong business prompts cover six things. You won&#39;t need all six every time, but the more the task matters, the more of them you should include.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Goal:\u003c/strong> what the output is for and what success looks like. &quot;Draft a follow-up email that gets the prospect to book a second call&quot; beats &quot;write a follow-up email.&quot;\u003c/li>\n\u003cli>\u003cstrong>Context:\u003c/strong> who you are, who the audience is, and any background that changes the answer.\u003c/li>\n\u003cli>\u003cstrong>Inputs:\u003c/strong> the material to work from, such as notes, a transcript, data or a previous document, clearly separated from your instructions.\u003c/li>\n\u003cli>\u003cstrong>Constraints:\u003c/strong> length, tone, what must be included, what must be avoided, and which facts must not be invented.\u003c/li>\n\u003cli>\u003cstrong>Format:\u003c/strong> exactly what to return, such as a table, three options, or an email with a subject line.\u003c/li>\n\u003cli>\u003cstrong>Examples:\u003c/strong> one or two samples of &quot;good.&quot; This is the single most powerful thing you can add.\u003c/li>\n\u003c/ol>\n\u003cp>A practical tip: label each part clearly and wrap pasted material in triple quotes or simple tags, so the AI can tell your instructions apart from the content it&#39;s working on.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Before and after\u003c/h2>\n\u003cp>Here&#39;s a typical first attempt:\u003c/p>\n\u003cpre>\u003ccode>Write a follow-up email to a prospect.\n\u003c/code>\u003c/pre>\n\u003cp>You&#39;ll get something polite, generic and unusable. Now the same request as a business brief:\u003c/p>\n\u003cpre>\u003ccode>GOAL: Draft a follow-up email to a prospect after a discovery call. Success = they book a 30-minute proposal review.\n\nCONTEXT: We are [COMPANY], a [WHAT YOU DO] for [WHO YOU SERVE]. The prospect is [NAME, ROLE, COMPANY]. They&#39;re comparing us with one other provider.\n\nINPUTS (my call notes):\n&quot;&quot;&quot;\n[PASTE NOTES]\n&quot;&quot;&quot;\n\nCONSTRAINTS:\n- Under 150 words. Warm, direct, no hype.\n- Reference two specific things they told us.\n- Use only facts from my notes. If something is missing, write [CHECK] instead of guessing.\n- One clear call to action using this link: [BOOKING LINK]\n\nFORMAT: Subject line, then the email, then one alternative subject line.\n\nEXAMPLE OF OUR TONE:\n&quot;&quot;&quot;\n[PASTE A PAST EMAIL YOU LIKED]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>That&#39;s longer to write the first time, but it becomes a reusable template, and the output is something you can send after a quick review.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Four techniques the pros use\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Ask me questions first.\u003c/strong> For anything complex, end your prompt with: &quot;Before you start, ask me up to five questions about anything you need to do this well.&quot; The questions often reveal what you forgot to say.\u003c/li>\n\u003cli>\u003cstrong>Break big jobs into steps.\u003c/strong> Ask for an outline, approve it, then draft section by section. Each step is easier to check than one giant answer.\u003c/li>\n\u003cli>\u003cstrong>Ask for options, then choose.\u003c/strong> &quot;Give me three subject lines in different styles&quot; turns you from writer into editor, which is faster and usually better.\u003c/li>\n\u003cli>\u003cstrong>Make it critique itself.\u003c/strong> After a draft, ask: &quot;Check your draft against my constraints, list anything it misses, then fix it.&quot; Or: &quot;What would a skeptical customer object to in this?&quot;\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The [CHECK] rule\u003c/h2>\n\u003cp>AI fills gaps with plausible guesses. In business, a plausible guess about a price, a date or a promise is a liability. So build this line into every prompt that touches facts:\u003c/p>\n\u003cblockquote>\n\u003cp>Use only the information I&#39;ve provided. If something is missing or unclear, write [CHECK] instead of guessing.\u003c/p>\n\u003c/blockquote>\n\u003cp>Then search the draft for [CHECK] before anything goes out. It&#39;s a tiny habit that makes invented details far easier to catch.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Three templates to save now\u003c/h2>\n\u003cp>\u003cstrong>Template A: turn messy notes into a clean document.\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Turn the notes below into a [TYPE OF DOCUMENT] for [AUDIENCE].\nStructure: [HEADINGS OR SECTIONS].\nKeep every fact, number and name exactly as written. Don&#39;t add facts. Mark anything unclear with [CHECK].\n\nNotes:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Template B: reply to a customer message.\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>You&#39;re drafting a reply on behalf of [COMPANY]. Our relevant policies:\n&quot;&quot;&quot;\n[PASTE POLICY OR FAQ]\n&quot;&quot;&quot;\nCustomer message:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\nWrite a reply that answers every question they asked, follows our policies exactly and sounds [TONE]. If our policies don&#39;t cover something, put a note to me above the draft instead of making up an answer.\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Template C: get a second opinion.\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>Here is a [PLAN / EMAIL / OFFER / PROCESS] I&#39;ve written for [PURPOSE]:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\nAct as [A SKEPTICAL CUSTOMER / AN EXPERIENCED OPERATIONS MANAGER / A COMPETITOR]. List the five biggest weaknesses in order of importance and suggest a specific fix for each. Be blunt.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Take one task from your first three projects. Write a full six-part brief for it and run it. Then run it again with one real example of &quot;good&quot; added, and compare the two results side by side. Save the better prompt; it becomes the first entry in your team prompt library in the next lesson.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Prompt like you delegate: goal, context, inputs, constraints, format and examples.\u003c/li>\n\u003cli>Examples of &quot;good&quot; are the most powerful thing you can add to a prompt.\u003c/li>\n\u003cli>Ask for questions, work in steps, request options and have AI critique its own draft.\u003c/li>\n\u003cli>Use the [CHECK] rule so missing facts are flagged instead of invented.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"The difference between \"AI is a toy\" and \"AI saves me five hours a week\" is almost always the brief. Treat a prompt the way you'd delegate to a capable new hire: they're smart and fast, but they know nothing about your business, your customers or your standards unless you tell them. Vague delegation gets vague work, from people and from AI. The six-part business brief Strong business prompts cover six things. You won't need all six every time, but the more the task matters, the more of them you should include. Goal: what the output is for and what success looks like. \"Draft a follow-up email that gets the prospect to book a second call\" beats \"write a follow-up email.\" Context: who you are, who the audience is, and any background that changes the answer. Inputs: the material to work from, such as notes, a transcript, data or a previous document, clearly separated from your instructions. Constraints: length, tone, what must be included, what must be avoided, and which facts must not be invented. Format: exactly what to return, such as a table, three options, or an email with a subject line. Examples: one or two samples of \"good.\" This is the single most powerful thing you can add. A practical tip: label each part clearly and wrap pasted material in triple quotes or simple tags, so the AI can tell your instructions apart from the content it's working on. Before and after Here's a typical first attempt: Write a follow-up email to a prospect. You'll get something polite, generic and unusable. Now the same request as a business brief: GOAL: Draft a follow-up email to a prospect after a discovery call. Success = they book a 30-minute proposal review. CONTEXT: We are [COMPANY], a [WHAT YOU DO] for [WHO YOU SERVE]. The prospect is [NAME, ROLE, COMPANY]. They're comparing us with one other provider. INPUTS (my call notes): \"\"\" [PASTE NOTES] \"\"\" CONSTRAINTS: - Under 150 words. Warm, direct, no hype. - Reference two specific things they told us. - Use only facts from my notes. If something is missing, write [CHECK] instead of guessing. - One clear call to action using this link: [BOOKING LINK] FORMAT: Subject line, then the email, then one alternative subject line. EXAMPLE OF OUR TONE: \"\"\" [PASTE A PAST EMAIL YOU LIKED] \"\"\" That's longer to write the first time, but it becomes a reusable template, and the output is something you can send after a quick review. Four techniques the pros use Ask me questions first. For anything complex, end your prompt with: \"Before you start, ask me up to five questions about anything you need to do this well.\" The questions often reveal what you forgot to say. Break big jobs into steps. Ask for an outline, approve it, then draft section by section. Each step is easier to check than one giant answer. Ask for options, then choose. \"Give me three subject lines in different styles\" turns you from writer into editor, which is faster and usually better. Make it critique itself. After a draft, ask: \"Check your draft against my constraints, list anything it misses, then fix it.\" Or: \"What would a skeptical customer object to in this?\" The [CHECK] rule AI fills gaps with plausible guesses. In business, a plausible guess about a price, a date or a promise is a liability. So build this line into every prompt that touches facts: Use only the information I've provided. If something is missing or unclear, write [CHECK] instead of guessing. Then search the draft for [CHECK] before anything goes out. It's a tiny habit that makes invented details far easier to catch. Three templates to save now Template A: turn messy notes into a clean document. Turn the notes below into a [TYPE OF DOCUMENT] for [AUDIENCE]. Structure: [HEADINGS OR SECTIONS]. Keep every fact, number and name exactly as written. Don't add facts. Mark anything unclear with [CHECK]. Notes: \"\"\" [PASTE] \"\"\" Template B: reply to a customer message. You're drafting a reply on behalf of [COMPANY]. Our relevant policies: \"\"\" [PASTE POLICY OR FAQ] \"\"\" Customer message: \"\"\" [PASTE] \"\"\" Write a reply that answers every question they asked, follows our policies exactly and sounds [TONE]. If our policies don't cover something, put a note to me above the draft instead of making up an answer. Template C: get a second opinion. Here is a [PLAN / EMAIL / OFFER / PROCESS] I've written for [PURPOSE]: \"\"\" [PASTE] \"\"\" Act as [A SKEPTICAL CUSTOMER / AN EXPERIENCED OPERATIONS MANAGER / A COMPETITOR]. List the five biggest weaknesses in order of importance and suggest a specific fix for each. Be blunt. Do this now Take one task from your first three projects. Write a full six-part brief for it and run it. Then run it again with one real example of \"good\" added, and compare the two results side by side. Save the better prompt; it becomes the first entry in your team prompt library in the next lesson. Key takeaways Prompt like you delegate: goal, context, inputs, constraints, format and examples. Examples of \"good\" are the most powerful thing you can add to a prompt. Ask for questions, work in steps, request options and have AI critique its own draft. Use the [CHECK] rule so missing facts are flagged instead of invented.","blocks":[{"lang":"","text":"Write a follow-up email to a prospect."},{"lang":"","text":"GOAL: Draft a follow-up email to a prospect after a discovery call. Success = they book a 30-minute proposal review.\n\nCONTEXT: We are [COMPANY], a [WHAT YOU DO] for [WHO YOU SERVE]. The prospect is [NAME, ROLE, COMPANY]. They're comparing us with one other provider.\n\nINPUTS (my call notes):\n\"\"\"\n[PASTE NOTES]\n\"\"\"\n\nCONSTRAINTS:\n- Under 150 words. Warm, direct, no hype.\n- Reference two specific things they told us.\n- Use only facts from my notes. If something is missing, write [CHECK] instead of guessing.\n- One clear call to action using this link: [BOOKING LINK]\n\nFORMAT: Subject line, then the email, then one alternative subject line.\n\nEXAMPLE OF OUR TONE:\n\"\"\"\n[PASTE A PAST EMAIL YOU LIKED]\n\"\"\""},{"lang":"","text":"Turn the notes below into a [TYPE OF DOCUMENT] for [AUDIENCE].\nStructure: [HEADINGS OR SECTIONS].\nKeep every fact, number and name exactly as written. Don't add facts. Mark anything unclear with [CHECK].\n\nNotes:\n\"\"\"\n[PASTE]\n\"\"\""},{"lang":"","text":"You're drafting a reply on behalf of [COMPANY]. Our relevant policies:\n\"\"\"\n[PASTE POLICY OR FAQ]\n\"\"\"\nCustomer message:\n\"\"\"\n[PASTE]\n\"\"\"\nWrite a reply that answers every question they asked, follows our policies exactly and sounds [TONE]. If our policies don't cover something, put a note to me above the draft instead of making up an answer."},{"lang":"","text":"Here is a [PLAN / EMAIL / OFFER / PROCESS] I've written for [PURPOSE]:\n\"\"\"\n[PASTE]\n\"\"\"\nAct as [A SKEPTICAL CUSTOMER / AN EXPERIENCED OPERATIONS MANAGER / A COMPETITOR]. List the five biggest weaknesses in order of importance and suggest a specific fix for each. Be blunt."}],"quiz":[{"q":"According to the lesson, which part of the six-part business brief is the single most powerful thing you can add to a prompt?","options":["Constraints on length, tone and what to avoid","One or two examples of what 'good' looks like","A detailed description of the goal and success","A precise output format, such as a table"],"answer":1,"explain":"The lesson calls examples, one or two samples of 'good,' the single most powerful thing you can add to a prompt."},{"q":"A property manager asks AI to draft a lease renewal letter, but her notes don't include the new rent amount. Under the lesson's [CHECK] rule, what should the AI do?","options":["Estimate a typical rent increase based on the local market","Leave the rent out and avoid mentioning any change at all","Use last year's rent, since it's the closest known figure","Write [CHECK] where the rent belongs instead of guessing"],"answer":3,"explain":"The [CHECK] rule tells the AI to use only the information provided and write [CHECK] where something is missing or unclear, so the gap is easy to find and fix before anything goes out."},{"q":"A gym owner's prompt 'Write a welcome email for new members' keeps producing generic drafts. Which change best applies the lesson?","options":["Ask the AI to make the email longer and more enthusiastic","Run the same prompt several times until one sounds right","Add the goal, context, constraints, format and a past email he liked","Switch to a different AI assistant for all customer emails"],"answer":2,"explain":"The lesson says vague delegation gets vague work; a full brief with goal, context, inputs, constraints and format, plus an example of 'good,' produces usable output."}],"videoUrl":null},{"n":6,"slug":"brand-voice-and-prompt-library","title":"Your Brand Voice Guide and Team Prompt Library","summary":"Capture how your business sounds in a guide AI can follow, and turn your best prompts into a shared library the whole team can use.","durationMin":16,"module":2,"moduleTitle":"Prompting for Business","html":"\u003csection class=\"sec sec-intro\">\u003cp>Once a team starts using AI, two complaints show up almost immediately: &quot;it doesn&#39;t sound like us,&quot; and &quot;everyone gets different results.&quot; Both have the same fix: shared assets. In this lesson you&#39;ll build the two that matter most, a \u003cstrong>brand voice guide\u003c/strong> and a \u003cstrong>team prompt library\u003c/strong>.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Part 1: The brand voice guide\u003c/h2>\n\u003cp>AI writes in an average voice by default, because it has learned from an enormous range of writing. To get \u003cem>your\u003c/em> voice, you have to describe it explicitly and show examples.\u003c/p>\n\u003ch3>Step 1: Gather samples\u003c/h3>\n\u003cp>Collect five to ten pieces of writing you&#39;re proud of: emails, web pages, social posts, proposals, even a great text to a customer. Mix authors and formats if you can, as long as each piece sounds right.\u003c/p>\n\u003ch3>Step 2: Let AI extract the voice\u003c/h3>\n\u003cpre>\u003ccode>Below are samples of writing from my business that represent how we want to sound. Analyze them and create a brand voice guide with these sections:\n\n1. Who we are (one paragraph)\n2. Who we&#39;re talking to\n3. Our voice in four traits, each written as &quot;this, not that&quot; (for example, &quot;confident, not arrogant&quot;)\n4. Words and phrases we use, and words we never use\n5. Sentence style: length, contractions, jargon, emojis, exclamation marks\n6. Formatting habits: headings, bullet points, greetings and sign-offs\n7. Two short before-and-after examples that rewrite generic copy into our voice\n\nBase everything on the samples. Don&#39;t invent claims about the business.\n\nSAMPLES (separated by ---):\n&quot;&quot;&quot;\n[PASTE 5-10 SAMPLES]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003ch3>Step 3: Edit it by hand\u003c/h3>\n\u003cp>The draft will be a good start, not a finished guide. Add the things only you know: phrases that grate on you, claims you legally can&#39;t make, and the overused AI phrases you never want to see (for many brands that list includes &quot;in today&#39;s fast-paced world,&quot; &quot;unlock,&quot; &quot;elevate&quot; and &quot;game-changer&quot;).\u003c/p>\n\u003ch3>Step 4: Test it\u003c/h3>\n\u003cp>Ask AI to rewrite three real pieces of content using the guide. Where the result doesn&#39;t sound like you, add that example to the guide as a &quot;not this.&quot; A good voice guide is short enough to paste into any prompt, usually one page.\u003c/p>\n\u003cp>Here&#39;s what a few entries might look like for a hypothetical neighborhood bakery:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Section\u003c/th>\n\u003cth>Example entry\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Personality\u003c/td>\n\u003ctd>Warm, local and a little playful; never fussy\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>This, not that\u003c/td>\n\u003ctd>Friendly, not cutesy. Proud, not boastful.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We say\u003c/td>\n\u003ctd>&quot;fresh this morning,&quot; &quot;see you Saturday,&quot; &quot;our neighbors&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>We never say\u003c/td>\n\u003ctd>&quot;artisanal experience,&quot; &quot;indulge,&quot; &quot;elevate your mornings&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Format\u003c/td>\n\u003ctd>Short paragraphs. At most one emoji on social, none in email.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Where to keep it\u003c/h3>\n\u003cp>Keep the master copy in a shared document with an owner and a &quot;last updated&quot; date. Then make it effortless to use: most assistants let you save reusable instructions and reference files in a workspace (called projects, custom GPTs, Gems or custom instructions, depending on the tool), and business plans usually let you share these with your team.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Part 2: The team prompt library\u003c/h2>\n\u003cp>A prompt library is a shared collection of tested prompts for your recurring tasks. It turns one person&#39;s skill into a team capability, makes onboarding easier and makes quality consistent.\u003c/p>\n\u003ch3>The entry format\u003c/h3>\n\u003cp>Every prompt in the library gets the same fields:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Field\u003c/th>\n\u003cth>What to write\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Name\u003c/td>\n\u003ctd>Task plus stage, such as &quot;Quote follow-up email (day 3)&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Use when\u003c/td>\n\u003ctd>The trigger for using it\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Owner\u003c/td>\n\u003ctd>Who maintains it\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Inputs needed\u003c/td>\n\u003ctd>For example, call notes, the quote and the client&#39;s first name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prompt\u003c/td>\n\u003ctd>The full prompt, with [PLACEHOLDERS] for anything that changes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Review rule\u003c/td>\n\u003ctd>What a person must check before using the output\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Data rule\u003c/td>\n\u003ctd>Green, Amber or Red (explained in the next lesson)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Last tested\u003c/td>\n\u003ctd>Date and tool\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Conventions that keep it usable\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Organize by workflow, not by person.\u003c/strong> Use folders such as Marketing, Sales, Customer Service, Operations, People and Leadership.\u003c/li>\n\u003cli>\u003cstrong>Use [SQUARE BRACKETS IN CAPITALS] for placeholders.\u003c/strong> The rest of the prompt stays fixed, so people only change what&#39;s in brackets.\u003c/li>\n\u003cli>\u003cstrong>Set a quality bar.\u003c/strong> A prompt joins the library only after it has produced good results at least three times.\u003c/li>\n\u003cli>\u003cstrong>Review it monthly.\u003c/strong> Fifteen minutes is enough: retire prompts nobody uses, fix ones that drift, add new winners.\u003c/li>\n\u003cli>\u003cstrong>Re-test after tool updates.\u003c/strong> When your assistant changes models or features, re-run your top ten prompts.\u003c/li>\n\u003cli>\u003cstrong>Record wins.\u003c/strong> When a prompt saves real time, note it next to the entry. You&#39;ll use this in Module 6 to measure ROI.\u003c/li>\n\u003c/ul>\n\u003ch3>Improve weak prompts with AI\u003c/h3>\n\u003cpre>\u003ccode>Here&#39;s a prompt my team uses for [TASK]. It works, but the results are inconsistent: [DESCRIBE THE PROBLEM].\n&quot;&quot;&quot;\n[PASTE PROMPT]\n&quot;&quot;&quot;\nRewrite it so anyone on my team gets consistent results. Keep [PLACEHOLDERS] for anything that changes each time, add clear constraints and an output format, and explain what you changed and why.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003col>\n\u003cli>Draft your brand voice guide using the four steps above. Give it 30 minutes; you&#39;ll refine it as you go.\u003c/li>\n\u003cli>Create your prompt library in a shared document or wiki with the six workflow folders and the entry format. Add the prompt you built in the last lesson as entry number one.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>AI defaults to an average voice; a one-page voice guide with examples makes it sound like you.\u003c/li>\n\u003cli>Store the guide where it&#39;s effortless to use, such as a shared workspace in your AI tool.\u003c/li>\n\u003cli>A prompt library turns individual skill into team capability.\u003c/li>\n\u003cli>Use a consistent entry format, bracketed placeholders, a quality bar and a monthly review.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Once a team starts using AI, two complaints show up almost immediately: \"it doesn't sound like us,\" and \"everyone gets different results.\" Both have the same fix: shared assets. In this lesson you'll build the two that matter most, a brand voice guide and a team prompt library . Part 1: The brand voice guide AI writes in an average voice by default, because it has learned from an enormous range of writing. To get your voice, you have to describe it explicitly and show examples. Step 1: Gather samples Collect five to ten pieces of writing you're proud of: emails, web pages, social posts, proposals, even a great text to a customer. Mix authors and formats if you can, as long as each piece sounds right. Step 2: Let AI extract the voice Below are samples of writing from my business that represent how we want to sound. Analyze them and create a brand voice guide with these sections: 1. Who we are (one paragraph) 2. Who we're talking to 3. Our voice in four traits, each written as \"this, not that\" (for example, \"confident, not arrogant\") 4. Words and phrases we use, and words we never use 5. Sentence style: length, contractions, jargon, emojis, exclamation marks 6. Formatting habits: headings, bullet points, greetings and sign-offs 7. Two short before-and-after examples that rewrite generic copy into our voice Base everything on the samples. Don't invent claims about the business. SAMPLES (separated by ---): \"\"\" [PASTE 5-10 SAMPLES] \"\"\" Step 3: Edit it by hand The draft will be a good start, not a finished guide. Add the things only you know: phrases that grate on you, claims you legally can't make, and the overused AI phrases you never want to see (for many brands that list includes \"in today's fast-paced world,\" \"unlock,\" \"elevate\" and \"game-changer\"). Step 4: Test it Ask AI to rewrite three real pieces of content using the guide. Where the result doesn't sound like you, add that example to the guide as a \"not this.\" A good voice guide is short enough to paste into any prompt, usually one page. Here's what a few entries might look like for a hypothetical neighborhood bakery: Section Example entry Personality Warm, local and a little playful; never fussy This, not that Friendly, not cutesy. Proud, not boastful. We say \"fresh this morning,\" \"see you Saturday,\" \"our neighbors\" We never say \"artisanal experience,\" \"indulge,\" \"elevate your mornings\" Format Short paragraphs. At most one emoji on social, none in email. Where to keep it Keep the master copy in a shared document with an owner and a \"last updated\" date. Then make it effortless to use: most assistants let you save reusable instructions and reference files in a workspace (called projects, custom GPTs, Gems or custom instructions, depending on the tool), and business plans usually let you share these with your team. Part 2: The team prompt library A prompt library is a shared collection of tested prompts for your recurring tasks. It turns one person's skill into a team capability, makes onboarding easier and makes quality consistent. The entry format Every prompt in the library gets the same fields: Field What to write Name Task plus stage, such as \"Quote follow-up email (day 3)\" Use when The trigger for using it Owner Who maintains it Inputs needed For example, call notes, the quote and the client's first name Prompt The full prompt, with [PLACEHOLDERS] for anything that changes Review rule What a person must check before using the output Data rule Green, Amber or Red (explained in the next lesson) Last tested Date and tool Conventions that keep it usable Organize by workflow, not by person. Use folders such as Marketing, Sales, Customer Service, Operations, People and Leadership. Use [SQUARE BRACKETS IN CAPITALS] for placeholders. The rest of the prompt stays fixed, so people only change what's in brackets. Set a quality bar. A prompt joins the library only after it has produced good results at least three times. Review it monthly. Fifteen minutes is enough: retire prompts nobody uses, fix ones that drift, add new winners. Re-test after tool updates. When your assistant changes models or features, re-run your top ten prompts. Record wins. When a prompt saves real time, note it next to the entry. You'll use this in Module 6 to measure ROI. Improve weak prompts with AI Here's a prompt my team uses for [TASK]. It works, but the results are inconsistent: [DESCRIBE THE PROBLEM]. \"\"\" [PASTE PROMPT] \"\"\" Rewrite it so anyone on my team gets consistent results. Keep [PLACEHOLDERS] for anything that changes each time, add clear constraints and an output format, and explain what you changed and why. Do this now Draft your brand voice guide using the four steps above. Give it 30 minutes; you'll refine it as you go. Create your prompt library in a shared document or wiki with the six workflow folders and the entry format. Add the prompt you built in the last lesson as entry number one. Key takeaways AI defaults to an average voice; a one-page voice guide with examples makes it sound like you. Store the guide where it's effortless to use, such as a shared workspace in your AI tool. A prompt library turns individual skill into team capability. Use a consistent entry format, bracketed placeholders, a quality bar and a monthly review.","blocks":[{"lang":"","text":"Below are samples of writing from my business that represent how we want to sound. Analyze them and create a brand voice guide with these sections:\n\n1. Who we are (one paragraph)\n2. Who we're talking to\n3. Our voice in four traits, each written as \"this, not that\" (for example, \"confident, not arrogant\")\n4. Words and phrases we use, and words we never use\n5. Sentence style: length, contractions, jargon, emojis, exclamation marks\n6. Formatting habits: headings, bullet points, greetings and sign-offs\n7. Two short before-and-after examples that rewrite generic copy into our voice\n\nBase everything on the samples. Don't invent claims about the business.\n\nSAMPLES (separated by ---):\n\"\"\"\n[PASTE 5-10 SAMPLES]\n\"\"\""},{"lang":"","text":"Here's a prompt my team uses for [TASK]. It works, but the results are inconsistent: [DESCRIBE THE PROBLEM].\n\"\"\"\n[PASTE PROMPT]\n\"\"\"\nRewrite it so anyone on my team gets consistent results. Keep [PLACEHOLDERS] for anything that changes each time, add clear constraints and an output format, and explain what you changed and why."}],"quiz":[{"q":"According to the lesson, why does AI write in an 'average' voice by default?","options":["AI tools are set to a neutral tone for legal reasons","Businesses usually paste in too many writing samples","It has learned from an enormous range of writing","Voice settings only exist on paid business plans"],"answer":2,"explain":"The lesson says AI defaults to an average voice because it has learned from an enormous range of writing, so you have to describe your voice explicitly and show examples."},{"q":"A team member at a landscaping firm wrote a prompt that worked well the first time she used it. When should it join the team prompt library?","options":["After it has produced good results at least three times","Right away, so the rest of the team can start testing it","Once the owner approves its wording at a team meeting","After every person on the team has tried it at least once"],"answer":0,"explain":"The lesson sets a quality bar: a prompt joins the library only after it has produced good results at least three times."},{"q":"A florist tests her new brand voice guide, and the AI's rewrite of a product page still sounds stiff and salesy. What does the lesson suggest?","options":["Make the guide longer by adding every past email as a sample","Ask the AI to rewrite the page in a more casual style instead","Stop using the guide and write all product pages by hand","Add that rewrite to the guide as a 'not this' example"],"answer":3,"explain":"In the testing step, the lesson says that wherever the result doesn't sound like you, add that example to the guide as a 'not this,' while keeping the guide to about one page."}],"videoUrl":null},{"n":7,"slug":"business-context-safely","title":"Give AI Your Business Context, Safely","summary":"Build a reusable business context pack, and learn the simple traffic-light rules for what information can go into which AI tools.","durationMin":14,"module":2,"moduleTitle":"Prompting for Business","html":"\u003csection class=\"sec sec-intro\">\u003cp>AI output gets dramatically better when the AI understands your business: what you sell, who you serve, how you work and what you never promise. But not every piece of information belongs in every tool. This lesson shows you how to give AI the context it needs without putting customer trust or confidential information at risk.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Part 1: Build your business context pack\u003c/h2>\n\u003cp>A context pack is a one-page document you attach, paste or save into your assistant&#39;s workspace, so every task starts with the AI already knowing the basics. Write it once, update it quarterly.\u003c/p>\n\u003cpre>\u003ccode>BUSINESS CONTEXT PACK - [COMPANY NAME] - updated [DATE]\n\nWhat we do: [one or two sentences]\nWho we serve: [ideal customers, industries, locations]\nOur offers: [main services or products, who each is for, public price ranges]\nWhat makes us different: [three honest points]\nHow we work: [the journey from first contact to delivery]\nCommon customer questions: [top five, with our standard answers]\nTone: [see our brand voice guide]\nThings we never do or promise: [for example, guaranteed results, legal or financial advice]\nKey terms: [industry or internal jargon, with meanings]\n\u003c/code>\u003c/pre>\n\u003cp>Keep the pack to information you&#39;d be comfortable publishing on your website. That way it&#39;s safe to use in any approved tool, and you never have to think twice about it.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Part 2: The traffic-light data rules\u003c/h2>\n\u003cp>Most data mistakes happen because people don&#39;t have a simple rule to follow. This one is easy to remember:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>What it includes\u003c/th>\n\u003cth>Rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Green: public\u003c/strong>\u003c/td>\n\u003ctd>Website content, published prices, marketing materials, general industry questions\u003c/td>\n\u003ctd>OK in any approved AI tool\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Amber: internal\u003c/strong>\u003c/td>\n\u003ctd>Internal processes, unpublished pricing, non-personal business data, anonymized customer scenarios\u003c/td>\n\u003ctd>Only in business-grade tools your company has approved, with training on your data turned off\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Red: restricted\u003c/strong>\u003c/td>\n\u003ctd>Personal data about customers or staff, health or financial details, ID and account numbers, payment details, passwords and API keys, legal matters, anything under a confidentiality agreement\u003c/td>\n\u003ctd>Never in a general AI assistant unless the business has approved a specific tool and process for it in writing\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>You&#39;ll formalize these rules in your AI usage policy in Module 6. For now, use them yourself and share them with anyone already experimenting.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Know your tool&#39;s settings\u003c/h2>\n\u003cp>Before Amber information goes into any AI tool, find out the answers to these questions. Providers change their terms and settings, so check the current version rather than relying on memory or on what a colleague heard.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Training:\u003c/strong> is our data used to improve the provider&#39;s models, and can we switch that off? Consumer and business plans often differ here.\u003c/li>\n\u003cli>\u003cstrong>Retention:\u003c/strong> how long are conversations stored, and who in our company can see them?\u003c/li>\n\u003cli>\u003cstrong>Admin controls:\u003c/strong> is there a team or business plan with central accounts, permissions and the data processing terms we need (for example, under GDPR)?\u003c/li>\n\u003cli>\u003cstrong>Location:\u003c/strong> where is the data processed and stored, if your clients or industry care about that?\u003c/li>\n\u003cli>\u003cstrong>Connections:\u003c/strong> if you connect email, files or your CRM, does the AI get access to more than you intended?\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Anonymize before you paste\u003c/h2>\n\u003cp>Most tasks don&#39;t need the identifying details. Strip them out \u003cem>before\u003c/em> the text goes anywhere, rather than pasting raw data and asking the AI to clean it up, because by then it has already been shared.\u003c/p>\n\u003cul>\n\u003cli>Replace names with roles: &quot;the customer,&quot; &quot;Client A,&quot; &quot;the site manager&quot;\u003c/li>\n\u003cli>Remove email addresses, phone numbers, street addresses and account numbers\u003c/li>\n\u003cli>Round or bucket figures when exact values don&#39;t matter\u003c/li>\n\u003cli>Summarize a long thread instead of pasting all of it\u003c/li>\n\u003cli>Change identifying details that don&#39;t affect the task\u003c/li>\n\u003c/ul>\n\u003cp>For example, instead of pasting a complaint containing a customer&#39;s full name, address, invoice number and card details, write: &quot;A residential customer was charged twice for the same invoice of about $2,400 and is frustrated that she had to call twice. Draft an apologetic reply confirming we found the duplicate charge and that the refund will arrive within [REFUND TIMEFRAME].&quot; The AI can write an excellent reply, and nothing sensitive left your hands.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>A note on outside content\u003c/h2>\n\u003cp>When AI reads content from outside your business, such as incoming emails, web pages or documents someone sends you, treat its output with extra care. Text in those sources can include instructions designed to steer the AI (sometimes called prompt injection). The safeguard is simple: keep a human approval step before any AI action that sends, deletes, pays for or shares anything.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003col>\n\u003cli>Write your business context pack using the template, sticking to Green information. Save it where your team can reach it and, if your tool allows, in a shared workspace.\u003c/li>\n\u003cli>Make a list of every AI tool your team is using right now. Ask people directly, including about personal accounts, and make it safe to answer honestly. For each tool, note the plan type and the training setting. You&#39;ll use this list when you write your AI usage policy.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>A one-page context pack of public-safe facts makes every AI task better.\u003c/li>\n\u003cli>Green is public, Amber is internal and goes only in approved business tools, Red stays out unless explicitly approved.\u003c/li>\n\u003cli>Check each tool&#39;s training, retention, admin and connection settings yourself; terms change.\u003c/li>\n\u003cli>Anonymize before you paste, and keep a human approval step on any AI action that affects the outside world.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"AI output gets dramatically better when the AI understands your business: what you sell, who you serve, how you work and what you never promise. But not every piece of information belongs in every tool. This lesson shows you how to give AI the context it needs without putting customer trust or confidential information at risk. Part 1: Build your business context pack A context pack is a one-page document you attach, paste or save into your assistant's workspace, so every task starts with the AI already knowing the basics. Write it once, update it quarterly. BUSINESS CONTEXT PACK - [COMPANY NAME] - updated [DATE] What we do: [one or two sentences] Who we serve: [ideal customers, industries, locations] Our offers: [main services or products, who each is for, public price ranges] What makes us different: [three honest points] How we work: [the journey from first contact to delivery] Common customer questions: [top five, with our standard answers] Tone: [see our brand voice guide] Things we never do or promise: [for example, guaranteed results, legal or financial advice] Key terms: [industry or internal jargon, with meanings] Keep the pack to information you'd be comfortable publishing on your website. That way it's safe to use in any approved tool, and you never have to think twice about it. Part 2: The traffic-light data rules Most data mistakes happen because people don't have a simple rule to follow. This one is easy to remember: Level What it includes Rule Green: public Website content, published prices, marketing materials, general industry questions OK in any approved AI tool Amber: internal Internal processes, unpublished pricing, non-personal business data, anonymized customer scenarios Only in business-grade tools your company has approved, with training on your data turned off Red: restricted Personal data about customers or staff, health or financial details, ID and account numbers, payment details, passwords and API keys, legal matters, anything under a confidentiality agreement Never in a general AI assistant unless the business has approved a specific tool and process for it in writing You'll formalize these rules in your AI usage policy in Module 6. For now, use them yourself and share them with anyone already experimenting. Know your tool's settings Before Amber information goes into any AI tool, find out the answers to these questions. Providers change their terms and settings, so check the current version rather than relying on memory or on what a colleague heard. Training: is our data used to improve the provider's models, and can we switch that off? Consumer and business plans often differ here. Retention: how long are conversations stored, and who in our company can see them? Admin controls: is there a team or business plan with central accounts, permissions and the data processing terms we need (for example, under GDPR)? Location: where is the data processed and stored, if your clients or industry care about that? Connections: if you connect email, files or your CRM, does the AI get access to more than you intended? Anonymize before you paste Most tasks don't need the identifying details. Strip them out before the text goes anywhere, rather than pasting raw data and asking the AI to clean it up, because by then it has already been shared. Replace names with roles: \"the customer,\" \"Client A,\" \"the site manager\" Remove email addresses, phone numbers, street addresses and account numbers Round or bucket figures when exact values don't matter Summarize a long thread instead of pasting all of it Change identifying details that don't affect the task For example, instead of pasting a complaint containing a customer's full name, address, invoice number and card details, write: \"A residential customer was charged twice for the same invoice of about $2,400 and is frustrated that she had to call twice. Draft an apologetic reply confirming we found the duplicate charge and that the refund will arrive within [REFUND TIMEFRAME].\" The AI can write an excellent reply, and nothing sensitive left your hands. A note on outside content When AI reads content from outside your business, such as incoming emails, web pages or documents someone sends you, treat its output with extra care. Text in those sources can include instructions designed to steer the AI (sometimes called prompt injection). The safeguard is simple: keep a human approval step before any AI action that sends, deletes, pays for or shares anything. Do this now Write your business context pack using the template, sticking to Green information. Save it where your team can reach it and, if your tool allows, in a shared workspace. Make a list of every AI tool your team is using right now. Ask people directly, including about personal accounts, and make it safe to answer honestly. For each tool, note the plan type and the training setting. You'll use this list when you write your AI usage policy. Key takeaways A one-page context pack of public-safe facts makes every AI task better. Green is public, Amber is internal and goes only in approved business tools, Red stays out unless explicitly approved. Check each tool's training, retention, admin and connection settings yourself; terms change. Anonymize before you paste, and keep a human approval step on any AI action that affects the outside world.","blocks":[{"lang":"","text":"BUSINESS CONTEXT PACK - [COMPANY NAME] - updated [DATE]\n\nWhat we do: [one or two sentences]\nWho we serve: [ideal customers, industries, locations]\nOur offers: [main services or products, who each is for, public price ranges]\nWhat makes us different: [three honest points]\nHow we work: [the journey from first contact to delivery]\nCommon customer questions: [top five, with our standard answers]\nTone: [see our brand voice guide]\nThings we never do or promise: [for example, guaranteed results, legal or financial advice]\nKey terms: [industry or internal jargon, with meanings]"}],"quiz":[{"q":"Under the lesson's traffic-light rules, where can Amber (internal) information go?","options":["Into any AI tool, as long as people's names are removed first","Nowhere, unless a written exception has been approved","Into personal AI accounts that only the owner uses","Only into approved business-grade tools with training turned off"],"answer":3,"explain":"The lesson says Amber information, such as internal processes and unpublished pricing, goes only in business-grade tools the company has approved, with training on its data turned off."},{"q":"The office manager at a cleaning company wants AI's help replying to a customer who was charged twice. What does the lesson recommend?","options":["Paste the full email thread and ask the AI to strip out personal details","Describe the situation without names, contact details or account numbers","Paste the customer's details, since a reply email is low risk","Avoid AI entirely, because billing complaints can't be drafted with it"],"answer":1,"explain":"The lesson says to anonymize before you paste, rather than pasting raw data and asking AI to clean it up, because by then it has already been shared; a described scenario still gets an excellent reply."},{"q":"A consultancy connects its AI assistant to its inbox so the AI can work with incoming emails. Which safeguard does the lesson recommend?","options":["A human approval step before any AI action that sends, deletes, pays or shares","Letting the AI act freely, but only on emails from known senders","Removing the business context pack while the inbox is connected","Telling the AI to ignore any instructions it finds in the emails"],"answer":0,"explain":"Outside content can include instructions designed to steer the AI (prompt injection), so the lesson's safeguard is a human approval step before any AI action that sends, deletes, pays for or shares anything."}],"videoUrl":null},{"n":8,"slug":"content-engine","title":"The Content Engine: One Idea, Many Assets","summary":"A repeatable system for turning one strong idea into a month of on-brand content, without sounding like everyone else's AI content.","durationMin":15,"module":3,"moduleTitle":"Marketing & Content","html":"\u003csection class=\"sec sec-intro\">\u003cp>Most owners know they should publish consistently. Very few have the time. AI won&#39;t give you something worth saying (that part has to come from you), but it is exceptionally good at reshaping one strong idea into many formats. That&#39;s the content engine: \u003cstrong>you supply the thinking once, AI handles the reshaping, and you edit before anything goes out.\u003c/strong>\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Why AI-only content falls flat\u003c/h2>\n\u003cp>If you ask AI to &quot;write a blog post about kitchen renovations,&quot; you&#39;ll get the same generic article everyone else gets. It has no point of view, no experience behind it and nothing a customer couldn&#39;t find anywhere else. Readers notice, and so do search engines.\u003c/p>\n\u003cp>The fix is to feed the engine with raw material only you have:\u003c/p>\n\u003cul>\n\u003cli>The questions customers ask you on calls and in emails\u003c/li>\n\u003cli>The mistakes you see people make before they hire you\u003c/li>\n\u003cli>Your opinions, including where you disagree with common advice in your industry\u003c/li>\n\u003cli>Stories from your work (anonymized), and how you approach a typical job\u003c/li>\n\u003cli>Behind-the-scenes details about how you do things and why\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The engine in five steps\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Capture (10 minutes).\u003c/strong> Record a voice memo or short video answering one question your customers often ask. Talk naturally, as if explaining it to a client across the table.\u003c/li>\n\u003cli>\u003cstrong>Transcribe.\u003c/strong> Most phones, meeting tools and AI assistants can turn audio into text.\u003c/li>\n\u003cli>\u003cstrong>Build the pillar.\u003c/strong> AI turns your transcript into one long-form piece in your voice: a blog post, a newsletter or a video script.\u003c/li>\n\u003cli>\u003cstrong>Repurpose.\u003c/strong> From the pillar, AI creates the smaller pieces.\u003c/li>\n\u003cli>\u003cstrong>Edit and schedule.\u003c/strong> A person edits every piece, then schedules it in your email or social tool.\u003c/li>\n\u003c/ol>\n\u003cp>From one pillar, a realistic set of derivatives looks like this:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Asset\u003c/th>\n\u003cth>How many\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Blog post or article\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>The pillar; the next lesson covers SEO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Email newsletter\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>A personal angle plus a link to the article\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Social posts\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>Different hooks: a story, a tip, a myth you disagree with\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Short video scripts\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>30 to 60 seconds, one point each\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Carousel or slide post\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>Six to eight slides\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FAQ entries\u003c/td>\n\u003ctd>1 to 2\u003c/td>\n\u003ctd>For your website and your support knowledge base\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The prompts\u003c/h2>\n\u003cp>\u003cstrong>The pillar:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>You&#39;re helping me turn my own thinking into a [BLOG POST / NEWSLETTER] for [AUDIENCE].\n\nFollow the brand voice guide below. Keep my opinions, stories and examples. Don&#39;t add new claims, statistics or examples I didn&#39;t give you; where a point needs support I didn&#39;t provide, write [ADD EXAMPLE].\n\nStructure: a hook that names the reader&#39;s problem, three to five sections with clear subheadings, a practical takeaway, and a closing call to action to [CTA].\nLength: about [800-1,200] words.\n\nBRAND VOICE GUIDE:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\nMY TRANSCRIPT:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>The derivatives:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode>From the article below, create:\n1. Three social posts for [PLATFORM], each under [150] words, each with a different hook: a short story, a practical tip, and a common myth we disagree with.\n2. Two 45-second video scripts, each making one point, written to be spoken naturally.\n3. A newsletter introduction of about 120 words that links to the full article.\n4. Two FAQ entries (question plus a 60-word answer) for our website.\n\nFollow our voice guide. At most three hashtags per post, no emojis unless the voice guide allows them, and no claims that aren&#39;t in the article.\n\nARTICLE:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The human edit pass\u003c/h2>\n\u003cp>Never skip this. It&#39;s where AI content becomes \u003cem>your\u003c/em> content.\u003c/p>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Read it aloud. Does it sound like us?\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Every fact, number and claim is true, and ours\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> All [ADD EXAMPLE] and [CHECK] markers are resolved\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Filler and AI clichés are cut\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> There&#39;s one clear call to action\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Nothing reveals confidential client details\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> We have the rights to every image and quote we use\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>A monthly rhythm\u003c/h2>\n\u003cp>A simple routine beats bursts of enthusiasm:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Week\u003c/th>\n\u003cth>What happens\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Week 1\u003c/td>\n\u003ctd>Record four voice memos (one per upcoming week) and build the pillars\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Week 2\u003c/td>\n\u003ctd>Generate derivatives, run the edit pass and schedule everything\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Weeks 3 and 4
