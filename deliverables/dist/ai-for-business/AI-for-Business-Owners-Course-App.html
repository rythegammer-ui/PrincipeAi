\u003c/td>\n\u003ctd>Publish, reply to comments, and note which topics got the best response\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Budget roughly half a day a month to start, then adjust once you see what your team can sustain.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>A hypothetical example\u003c/h2>\n\u003cp>Imagine a family-run heating and cooling company. In October the owner records a ten-minute voice memo on &quot;five signs your furnace needs attention before winter.&quot; That becomes a blog post, a newsletter to past customers, three social posts, two short videos filmed on job sites and two new FAQ entries. One recording, one month of useful, seasonal content, all in the owner&#39;s voice.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Record a five to ten minute voice memo answering the question your customers ask most often. Transcribe it, run the pillar prompt, then the derivatives prompt. Edit everything using the checklist, and publish at least one piece this week.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>You supply the ideas and experience; AI reshapes them into many formats.\u003c/li>\n\u003cli>Feed the engine with customer questions, opinions and stories only you have.\u003c/li>\n\u003cli>One recorded idea can produce a pillar article plus a set of emails, posts, scripts and FAQs.\u003c/li>\n\u003cli>A human edit pass is non-negotiable: voice, facts, markers, clichés and rights.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Most owners know they should publish consistently. Very few have the time. AI won't give you something worth saying (that part has to come from you), but it is exceptionally good at reshaping one strong idea into many formats. That's the content engine: you supply the thinking once, AI handles the reshaping, and you edit before anything goes out. Why AI-only content falls flat If you ask AI to \"write a blog post about kitchen renovations,\" you'll get the same generic article everyone else gets. It has no point of view, no experience behind it and nothing a customer couldn't find anywhere else. Readers notice, and so do search engines. The fix is to feed the engine with raw material only you have: The questions customers ask you on calls and in emails The mistakes you see people make before they hire you Your opinions, including where you disagree with common advice in your industry Stories from your work (anonymized), and how you approach a typical job Behind-the-scenes details about how you do things and why The engine in five steps Capture (10 minutes). Record a voice memo or short video answering one question your customers often ask. Talk naturally, as if explaining it to a client across the table. Transcribe. Most phones, meeting tools and AI assistants can turn audio into text. Build the pillar. AI turns your transcript into one long-form piece in your voice: a blog post, a newsletter or a video script. Repurpose. From the pillar, AI creates the smaller pieces. Edit and schedule. A person edits every piece, then schedules it in your email or social tool. From one pillar, a realistic set of derivatives looks like this: Asset How many Notes Blog post or article 1 The pillar; the next lesson covers SEO Email newsletter 1 A personal angle plus a link to the article Social posts 3 Different hooks: a story, a tip, a myth you disagree with Short video scripts 2 30 to 60 seconds, one point each Carousel or slide post 1 Six to eight slides FAQ entries 1 to 2 For your website and your support knowledge base The prompts The pillar: You're helping me turn my own thinking into a [BLOG POST / NEWSLETTER] for [AUDIENCE]. Follow the brand voice guide below. Keep my opinions, stories and examples. Don't add new claims, statistics or examples I didn't give you; where a point needs support I didn't provide, write [ADD EXAMPLE]. Structure: a hook that names the reader's problem, three to five sections with clear subheadings, a practical takeaway, and a closing call to action to [CTA]. Length: about [800-1,200] words. BRAND VOICE GUIDE: \"\"\" [PASTE] \"\"\" MY TRANSCRIPT: \"\"\" [PASTE] \"\"\" The derivatives: From the article below, create: 1. Three social posts for [PLATFORM], each under [150] words, each with a different hook: a short story, a practical tip, and a common myth we disagree with. 2. Two 45-second video scripts, each making one point, written to be spoken naturally. 3. A newsletter introduction of about 120 words that links to the full article. 4. Two FAQ entries (question plus a 60-word answer) for our website. Follow our voice guide. At most three hashtags per post, no emojis unless the voice guide allows them, and no claims that aren't in the article. ARTICLE: \"\"\" [PASTE] \"\"\" The human edit pass Never skip this. It's where AI content becomes your content. Read it aloud. Does it sound like us? Every fact, number and claim is true, and ours All [ADD EXAMPLE] and [CHECK] markers are resolved Filler and AI clichés are cut There's one clear call to action Nothing reveals confidential client details We have the rights to every image and quote we use A monthly rhythm A simple routine beats bursts of enthusiasm: Week What happens Week 1 Record four voice memos (one per upcoming week) and build the pillars Week 2 Generate derivatives, run the edit pass and schedule everything Weeks 3 and 4 Publish, reply to comments, and note which topics got the best response Budget roughly half a day a month to start, then adjust once you see what your team can sustain. A hypothetical example Imagine a family-run heating and cooling company. In October the owner records a ten-minute voice memo on \"five signs your furnace needs attention before winter.\" That becomes a blog post, a newsletter to past customers, three social posts, two short videos filmed on job sites and two new FAQ entries. One recording, one month of useful, seasonal content, all in the owner's voice. Do this now Record a five to ten minute voice memo answering the question your customers ask most often. Transcribe it, run the pillar prompt, then the derivatives prompt. Edit everything using the checklist, and publish at least one piece this week. Key takeaways You supply the ideas and experience; AI reshapes them into many formats. Feed the engine with customer questions, opinions and stories only you have. One recorded idea can produce a pillar article plus a set of emails, posts, scripts and FAQs. A human edit pass is non-negotiable: voice, facts, markers, clichés and rights.","blocks":[{"lang":"","text":"You're helping me turn my own thinking into a [BLOG POST / NEWSLETTER] for [AUDIENCE].\n\nFollow the brand voice guide below. Keep my opinions, stories and examples. Don't add new claims, statistics or examples I didn't give you; where a point needs support I didn't provide, write [ADD EXAMPLE].\n\nStructure: a hook that names the reader's problem, three to five sections with clear subheadings, a practical takeaway, and a closing call to action to [CTA].\nLength: about [800-1,200] words.\n\nBRAND VOICE GUIDE:\n\"\"\"\n[PASTE]\n\"\"\"\nMY TRANSCRIPT:\n\"\"\"\n[PASTE]\n\"\"\""},{"lang":"","text":"From the article below, create:\n1. Three social posts for [PLATFORM], each under [150] words, each with a different hook: a short story, a practical tip, and a common myth we disagree with.\n2. Two 45-second video scripts, each making one point, written to be spoken naturally.\n3. A newsletter introduction of about 120 words that links to the full article.\n4. Two FAQ entries (question plus a 60-word answer) for our website.\n\nFollow our voice guide. At most three hashtags per post, no emojis unless the voice guide allows them, and no claims that aren't in the article.\n\nARTICLE:\n\"\"\"\n[PASTE]\n\"\"\""}],"quiz":[{"q":"In the content engine, how is the work divided between you and AI?","options":["You supply the thinking once, AI reshapes it, and you edit before publishing","AI comes up with the ideas, and you approve the monthly calendar","AI writes and publishes everything, and you review the results monthly","You write every piece yourself, and AI only schedules the posts"],"answer":0,"explain":"The lesson defines the content engine as you supplying the thinking once, AI handling the reshaping into many formats, and a person editing before anything goes out."},{"q":"A kitchen remodeler asks AI to 'write a blog post about kitchen renovations' and gets a generic article. What fix does the lesson recommend?","options":["Ask for a longer article with more keywords and subheadings","Generate ten versions and publish whichever performs best","Feed it customer questions, his opinions and anonymized job stories","Ask the AI to add statistics so the article stands out"],"answer":2,"explain":"The lesson says AI-only content has no point of view or experience, and the fix is feeding the engine raw material only you have: customer questions, your opinions and anonymized stories from your work."},{"q":"A pet-supply store owner's AI-drafted newsletter contains an [ADD EXAMPLE] marker and a statistic she doesn't recognize. What should happen before it goes out?","options":["Send it as is, since the pillar prompt already used the voice guide","Resolve the marker and remove or verify the unfamiliar statistic","Delete the marker but keep the statistic, since it adds credibility","Ask the AI whether the statistic is accurate and trust its answer"],"answer":1,"explain":"The human edit pass requires every fact, number and claim to be true and yours, and every [ADD EXAMPLE] and [CHECK] marker to be resolved before anything is published."}],"videoUrl":null},{"n":9,"slug":"seo-and-website-copy","title":"SEO and Website Copy That Converts","summary":"Use AI to write clearer service pages, answer the questions customers search for, and improve your site without publishing thin, generic content.","durationMin":15,"module":3,"moduleTitle":"Marketing & Content","html":"\u003csection class=\"sec sec-intro\">\u003cp>Your website works around the clock as either your best salesperson or your weakest. AI can help you rewrite pages so they&#39;re clearer, more persuasive and easier to find in search, as long as you use it for the right jobs and keep the expertise yours.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>What AI can and can&#39;t do for SEO\u003c/h2>\n\u003cp>\u003cstrong>AI is great at:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Brainstorming the questions customers ask at each stage of buying\u003c/li>\n\u003cli>Structuring and drafting service pages, FAQs and articles\u003c/li>\n\u003cli>Writing title tags and meta descriptions within length limits\u003c/li>\n\u003cli>Auditing a page for clarity, gaps and weak calls to action\u003c/li>\n\u003cli>Suggesting internal links between your pages\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>AI can&#39;t reliably:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Tell you real search volumes or your rankings, unless it&#39;s connected to an SEO data source (and even then, check the source)\u003c/li>\n\u003cli>Know your local competition or what your customers actually type\u003c/li>\n\u003cli>Add first-hand experience, real photos or proof you haven&#39;t given it\u003c/li>\n\u003c/ul>\n\u003cp>Use real data, such as the Performance report in Google Search Console, your SEO tool, and the words customers use in emails, for decisions. Use AI for thinking and writing.\u003c/p>\n\u003cp>What about search engines and AI content? Google&#39;s published guidance focuses on whether content is helpful and made for people, not on whether AI helped write it. Mass-producing pages mainly to manipulate rankings is treated as spam. The winning approach is the same one that has always worked: useful pages with specifics only you can provide.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 1: Map customer questions to pages\u003c/h2>\n\u003cpre>\u003ccode>I run a [BUSINESS TYPE] serving [LOCATION OR MARKET]. My main services are [LIST].\n\nList the questions a potential customer might type into a search engine or ask an AI assistant at each stage:\n1. Problem-aware (they have a problem but don&#39;t know the solution)\n2. Solution-aware (they&#39;re comparing options)\n3. Ready to buy (they&#39;re choosing a provider)\n\nGroup the questions by service. For each one, suggest whether it belongs on a service page, in an FAQ or in a blog article. Don&#39;t estimate search volumes; I&#39;ll check demand separately.\n\u003c/code>\u003c/pre>\n\u003cp>Then sanity-check the list against reality: the queries in Search Console, the questions in your inbox and the objections from sales calls. Keep the questions real customers ask.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 2: Write service pages with a proven structure\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Section\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Headline\u003c/td>\n\u003ctd>The outcome, who it&#39;s for and, for local businesses, where\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Subheadline\u003c/td>\n\u003ctd>How you deliver it, in one sentence\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The problem\u003c/td>\n\u003ctd>The reader&#39;s situation in their own words\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What&#39;s included\u003c/td>\n\u003ctd>Scope, process and timeline\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Proof\u003c/td>\n\u003ctd>Real reviews, photos, credentials and guarantees you actually offer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FAQs\u003c/td>\n\u003ctd>Real objections, answered plainly\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Call to action\u003c/td>\n\u003ctd>One clear next step, repeated at the end\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre>\u003ccode>Write a service page for [SERVICE] for [IDEAL CUSTOMER] in [LOCATION].\nStructure: headline, subheadline, the problem, what&#39;s included, how it works (three to five steps), proof, five FAQs, call to action.\n\nUse only these facts about us:\n&quot;&quot;&quot;\n[PASTE FROM YOUR CONTEXT PACK]\n&quot;&quot;&quot;\nIn the proof section, write placeholders such as [INSERT REAL REVIEW] instead of inventing testimonials, numbers or credentials.\n\nMain topic: [PHRASE]. Use it naturally in the headline, the first paragraph and one subheading; don&#39;t stuff it.\nAlso give me a title tag (under 60 characters) and a meta description (under 155 characters).\n\nVOICE GUIDE:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 3: Audit the pages you already have\u003c/h2>\n\u003cpre>\u003ccode>Here is the text of a page on my website. It&#39;s meant for: [IDEAL CUSTOMER].\nAudit it as a conversion copywriter and an SEO editor:\n1. Within five seconds, would a reader know what we do, who it&#39;s for and what to do next?\n2. What questions would a buyer still have after reading it?\n3. Point out vague claims, jargon and filler.\n4. Suggest three better headlines and a stronger call to action.\n5. Recommend three internal links to add, chosen from these pages: [LIST URLS].\n\nPAGE TEXT:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Bonus for local businesses\u003c/h2>\n\u003cul>\n\u003cli>Keep your business name, address and phone number identical everywhere you&#39;re listed.\u003c/li>\n\u003cli>Use AI to draft review responses, then personalize each one; never respond with an obvious template.\u003c/li>\n\u003cli>Create location pages only for areas you genuinely serve, with something specific to say about each. Pages that just swap the town name are the kind of thin content that hurts more than helps.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Before you publish\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Facts, prices and claims are verified\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> No invented reviews, statistics or credentials\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> It reads naturally out loud\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> It includes something only you could say: an example, a photo, a process detail\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> There&#39;s one clear call to action near the top and again at the end\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> The title tag and meta description are set\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Pick your most important service page. Run the audit prompt on it, then rewrite it with the service page prompt and your context pack. Edit the result, publish it, and note the date so you can compare inquiries from that page before and after.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Use real search data for decisions and AI for structuring, drafting and auditing.\u003c/li>\n\u003cli>Helpful, specific, experience-rich pages win; mass-produced filler doesn&#39;t.\u003c/li>\n\u003cli>A clear service page structure does much of the persuasion work for you.\u003c/li>\n\u003cli>Never let AI invent proof. Use placeholders and insert the real thing.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Your website works around the clock as either your best salesperson or your weakest. AI can help you rewrite pages so they're clearer, more persuasive and easier to find in search, as long as you use it for the right jobs and keep the expertise yours. What AI can and can't do for SEO AI is great at: Brainstorming the questions customers ask at each stage of buying Structuring and drafting service pages, FAQs and articles Writing title tags and meta descriptions within length limits Auditing a page for clarity, gaps and weak calls to action Suggesting internal links between your pages AI can't reliably: Tell you real search volumes or your rankings, unless it's connected to an SEO data source (and even then, check the source) Know your local competition or what your customers actually type Add first-hand experience, real photos or proof you haven't given it Use real data, such as the Performance report in Google Search Console, your SEO tool, and the words customers use in emails, for decisions. Use AI for thinking and writing. What about search engines and AI content? Google's published guidance focuses on whether content is helpful and made for people, not on whether AI helped write it. Mass-producing pages mainly to manipulate rankings is treated as spam. The winning approach is the same one that has always worked: useful pages with specifics only you can provide. Step 1: Map customer questions to pages I run a [BUSINESS TYPE] serving [LOCATION OR MARKET]. My main services are [LIST]. List the questions a potential customer might type into a search engine or ask an AI assistant at each stage: 1. Problem-aware (they have a problem but don't know the solution) 2. Solution-aware (they're comparing options) 3. Ready to buy (they're choosing a provider) Group the questions by service. For each one, suggest whether it belongs on a service page, in an FAQ or in a blog article. Don't estimate search volumes; I'll check demand separately. Then sanity-check the list against reality: the queries in Search Console, the questions in your inbox and the objections from sales calls. Keep the questions real customers ask. Step 2: Write service pages with a proven structure Section Purpose Headline The outcome, who it's for and, for local businesses, where Subheadline How you deliver it, in one sentence The problem The reader's situation in their own words What's included Scope, process and timeline Proof Real reviews, photos, credentials and guarantees you actually offer FAQs Real objections, answered plainly Call to action One clear next step, repeated at the end Write a service page for [SERVICE] for [IDEAL CUSTOMER] in [LOCATION]. Structure: headline, subheadline, the problem, what's included, how it works (three to five steps), proof, five FAQs, call to action. Use only these facts about us: \"\"\" [PASTE FROM YOUR CONTEXT PACK] \"\"\" In the proof section, write placeholders such as [INSERT REAL REVIEW] instead of inventing testimonials, numbers or credentials. Main topic: [PHRASE]. Use it naturally in the headline, the first paragraph and one subheading; don't stuff it. Also give me a title tag (under 60 characters) and a meta description (under 155 characters). VOICE GUIDE: \"\"\" [PASTE] \"\"\" Step 3: Audit the pages you already have Here is the text of a page on my website. It's meant for: [IDEAL CUSTOMER]. Audit it as a conversion copywriter and an SEO editor: 1. Within five seconds, would a reader know what we do, who it's for and what to do next? 2. What questions would a buyer still have after reading it? 3. Point out vague claims, jargon and filler. 4. Suggest three better headlines and a stronger call to action. 5. Recommend three internal links to add, chosen from these pages: [LIST URLS]. PAGE TEXT: \"\"\" [PASTE] \"\"\" Bonus for local businesses Keep your business name, address and phone number identical everywhere you're listed. Use AI to draft review responses, then personalize each one; never respond with an obvious template. Create location pages only for areas you genuinely serve, with something specific to say about each. Pages that just swap the town name are the kind of thin content that hurts more than helps. Before you publish Facts, prices and claims are verified No invented reviews, statistics or credentials It reads naturally out loud It includes something only you could say: an example, a photo, a process detail There's one clear call to action near the top and again at the end The title tag and meta description are set Do this now Pick your most important service page. Run the audit prompt on it, then rewrite it with the service page prompt and your context pack. Edit the result, publish it, and note the date so you can compare inquiries from that page before and after. Key takeaways Use real search data for decisions and AI for structuring, drafting and auditing. Helpful, specific, experience-rich pages win; mass-produced filler doesn't. A clear service page structure does much of the persuasion work for you. Never let AI invent proof. Use placeholders and insert the real thing.","blocks":[{"lang":"","text":"I run a [BUSINESS TYPE] serving [LOCATION OR MARKET]. My main services are [LIST].\n\nList the questions a potential customer might type into a search engine or ask an AI assistant at each stage:\n1. Problem-aware (they have a problem but don't know the solution)\n2. Solution-aware (they're comparing options)\n3. Ready to buy (they're choosing a provider)\n\nGroup the questions by service. For each one, suggest whether it belongs on a service page, in an FAQ or in a blog article. Don't estimate search volumes; I'll check demand separately."},{"lang":"","text":"Write a service page for [SERVICE] for [IDEAL CUSTOMER] in [LOCATION].\nStructure: headline, subheadline, the problem, what's included, how it works (three to five steps), proof, five FAQs, call to action.\n\nUse only these facts about us:\n\"\"\"\n[PASTE FROM YOUR CONTEXT PACK]\n\"\"\"\nIn the proof section, write placeholders such as [INSERT REAL REVIEW] instead of inventing testimonials, numbers or credentials.\n\nMain topic: [PHRASE]. Use it naturally in the headline, the first paragraph and one subheading; don't stuff it.\nAlso give me a title tag (under 60 characters) and a meta description (under 155 characters).\n\nVOICE GUIDE:\n\"\"\"\n[PASTE]\n\"\"\""},{"lang":"","text":"Here is the text of a page on my website. It's meant for: [IDEAL CUSTOMER].\nAudit it as a conversion copywriter and an SEO editor:\n1. Within five seconds, would a reader know what we do, who it's for and what to do next?\n2. What questions would a buyer still have after reading it?\n3. Point out vague claims, jargon and filler.\n4. Suggest three better headlines and a stronger call to action.\n5. Recommend three internal links to add, chosen from these pages: [LIST URLS].\n\nPAGE TEXT:\n\"\"\"\n[PASTE]\n\"\"\""}],"quiz":[{"q":"According to the lesson, what should drive SEO decisions such as which customer questions and topics to target?","options":["The search volumes an AI assistant estimates for each phrase","Real data, like Search Console queries and customers' own words","Whatever topics businesses in other regions are writing about","The longest keyword list the AI can generate for each service"],"answer":1,"explain":"The lesson says AI can't reliably tell you search volumes or what customers actually type, so real data such as Search Console and the words customers use should drive decisions, with AI used for thinking and writing."},{"q":"An electrician's AI-drafted service page needs a proof section, but he hasn't provided any reviews yet. What does the lesson's service page prompt tell the AI to do?","options":["Write placeholders like [INSERT REAL REVIEW] instead of inventing proof","Write two sample reviews that sound like typical happy customers","Leave the proof section out of the page structure entirely","Summarize what customers of electricians usually say online"],"answer":0,"explain":"The lesson's prompt asks for placeholders such as [INSERT REAL REVIEW] instead of invented testimonials, numbers or credentials, so the real thing can be inserted before publishing."},{"q":"A cleaning company serves three towns but wants to show up in searches for 12 nearby towns as well. Which approach fits the lesson's advice on location pages?","options":["Create 12 matching pages that each swap in a different town name","Write one page that lists all 15 town names as keywords","Create pages for all 15 towns, with AI-written local details","Create pages only for the towns it genuinely serves, each with specifics"],"answer":3,"explain":"The lesson says to create location pages only for areas you genuinely serve, with something specific to say about each; pages that just swap the town name are thin content that hurts more than it helps."}],"videoUrl":null},{"n":10,"slug":"campaigns-ads-and-offers","title":"Email, Social and Ad Campaigns (With Human Review)","summary":"Plan and draft complete campaigns faster, from the offer to the emails, posts and ads, with the review steps that keep you honest and compliant.","durationMin":16,"module":3,"moduleTitle":"Marketing & Content","html":"\u003csection class=\"sec sec-intro\">\u003cp>A campaign is a coordinated push toward one goal: filling a workshop, launching a service, promoting a seasonal offer or winning back past customers. Planning and writing one used to take days. AI compresses the drafting to an hour or two, which leaves your time for the parts that decide results: the offer and the review.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Start with the offer, not the copy\u003c/h2>\n\u003cp>Great copy can&#39;t rescue a weak offer. Before writing anything, fill in this worksheet:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Element\u003c/th>\n\u003cth>Your answer\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Who it&#39;s for\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>The problem it solves\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What they get\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Price and terms\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Why now\u003c/td>\n\u003ctd>An honest reason, such as a season, a real deadline or limited capacity\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Risk reversal\u003c/td>\n\u003ctd>A guarantee, trial or promise you can genuinely keep\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Call to action\u003c/td>\n\u003ctd>The one thing you want them to do\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Then pressure-test it:\u003c/p>\n\u003cpre>\u003ccode>Here is an offer I&#39;m planning:\n&quot;&quot;&quot;\n[PASTE WORKSHEET]\n&quot;&quot;&quot;\nAct as my target customer: [DESCRIBE THEM]. Tell me honestly:\n1. What would make you say yes right away?\n2. What would make you hesitate or ignore it?\n3. What would you need answered before buying?\nThen suggest three ways to make the offer clearer or more compelling without discounting it.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Plan the campaign\u003c/h2>\n\u003cpre>\u003ccode>Plan a [TWO-WEEK] campaign to [GOAL] for [AUDIENCE].\nChannels: [FOR EXAMPLE: EMAIL LIST OF ABOUT 800 PEOPLE, INSTAGRAM, LINKEDIN, A SMALL PAID AD BUDGET].\nOffer:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\nGive me a day-by-day calendar as a table (day, channel, message angle, call to action) and a short note explaining the order. Keep it realistic for a small team: no more than [NUMBER] pieces per week.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Email sequences\u003c/h2>\n\u003cp>A simple, effective launch sequence has five emails:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Announcement:\u003c/strong> what it is, who it&#39;s for and how to get it\u003c/li>\n\u003cli>\u003cstrong>The problem:\u003c/strong> a story or scenario your audience recognizes\u003c/li>\n\u003cli>\u003cstrong>Proof and details:\u003c/strong> what&#39;s included, how it works, real reviews if you have them\u003c/li>\n\u003cli>\u003cstrong>Objections:\u003c/strong> answer the top two or three reasons people hesitate\u003c/li>\n\u003cli>\u003cstrong>Last call:\u003c/strong> only if there&#39;s a real deadline\u003c/li>\n\u003c/ol>\n\u003cp>Ask AI to write each one with a subject line, preview text and a body of no more than 200 words with a single call to action, plus three alternative subject lines so you can test them.\u003c/p>\n\u003cp>Follow the email rules where you operate. Broadly: only email people who agreed to hear from you or who have a relationship with you that the law recognizes, include a working unsubscribe link and the business details required, and keep subject lines honest. The specifics vary by country (for example, CAN-SPAM in the US, CASL in Canada, and GDPR together with the electronic marketing rules in the UK (PECR) and the EU), so check the rules where you and your subscribers are.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Social posts and ads\u003c/h2>\n\u003cp>AI is excellent at producing variations to test: different hooks, angles and audiences.\u003c/p>\n\u003cpre>\u003ccode>Write ad copy for [PLATFORM] promoting [OFFER] to [AUDIENCE].\nGive me six variations across three angles: (a) the problem, (b) the outcome, (c) the main objection.\nFor each: primary text under [125] characters, a headline under [40] characters, and an image idea.\n\nRules: no claims we can&#39;t prove, no guaranteed results, no fake urgency, and no wording that asserts or implies the viewer&#39;s personal characteristics (for example, &quot;Struggling with your debt?&quot;). Follow [PLATFORM]&#39;s advertising policies.\n\u003c/code>\u003c/pre>\n\u003cp>That last rule matters: major ad platforms reject ads that call out sensitive personal attributes such as health, finances or age. Run two or three variations on a small budget and let real results, not the AI&#39;s opinion, pick the winner.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The human review step\u003c/h2>\n\u003cp>Before anything goes live, someone checks it against this list. If you work alone, review it the next morning with fresh eyes.\u003c/p>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Every claim is true and provable, including words like &quot;best,&quot; &quot;fastest&quot; and &quot;guaranteed&quot;\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Scarcity is real: deadlines and limited spots actually exist\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> No invented testimonials, reviews or endorsements. In the US, the FTC&#39;s rule on fake reviews explicitly covers AI-generated ones\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Prices, dates, links and promo codes are tested\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Industry rules are checked if you&#39;re in a regulated field such as health, finance, legal or real estate\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> It sounds like your brand\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Email consent and unsubscribe requirements are met\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Learn from every campaign\u003c/h2>\n\u003cpre>\u003ccode>Here are the results of our campaign:\n&quot;&quot;&quot;\n[PASTE METRICS: opens, clicks, replies and sales by email or ad]\n&quot;&quot;&quot;\nSummarize what worked and what didn&#39;t, suggest three possible reasons, and propose one test for the next campaign. Only draw conclusions the numbers support, and flag where the sample is too small to tell.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Choose one upcoming promotion. Complete the offer worksheet, pressure-test it with the customer prompt, then generate the campaign plan and the first email. Run everything through the review checklist before it goes out.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Fix the offer before you write the copy; AI is a fast way to pressure-test it.\u003c/li>\n\u003cli>Plan the whole campaign as a calendar, then draft each piece with clear limits.\u003c/li>\n\u003cli>Use AI for variations and let real results choose the winners.\u003c/li>\n\u003cli>A human reviews every claim, deadline, testimonial and consent rule before launch.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"A campaign is a coordinated push toward one goal: filling a workshop, launching a service, promoting a seasonal offer or winning back past customers. Planning and writing one used to take days. AI compresses the drafting to an hour or two, which leaves your time for the parts that decide results: the offer and the review. Start with the offer, not the copy Great copy can't rescue a weak offer. Before writing anything, fill in this worksheet: Element Your answer Who it's for The problem it solves What they get Price and terms Why now An honest reason, such as a season, a real deadline or limited capacity Risk reversal A guarantee, trial or promise you can genuinely keep Call to action The one thing you want them to do Then pressure-test it: Here is an offer I'm planning: \"\"\" [PASTE WORKSHEET] \"\"\" Act as my target customer: [DESCRIBE THEM]. Tell me honestly: 1. What would make you say yes right away? 2. What would make you hesitate or ignore it? 3. What would you need answered before buying? Then suggest three ways to make the offer clearer or more compelling without discounting it. Plan the campaign Plan a [TWO-WEEK] campaign to [GOAL] for [AUDIENCE]. Channels: [FOR EXAMPLE: EMAIL LIST OF ABOUT 800 PEOPLE, INSTAGRAM, LINKEDIN, A SMALL PAID AD BUDGET]. Offer: \"\"\" [PASTE] \"\"\" Give me a day-by-day calendar as a table (day, channel, message angle, call to action) and a short note explaining the order. Keep it realistic for a small team: no more than [NUMBER] pieces per week. Email sequences A simple, effective launch sequence has five emails: Announcement: what it is, who it's for and how to get it The problem: a story or scenario your audience recognizes Proof and details: what's included, how it works, real reviews if you have them Objections: answer the top two or three reasons people hesitate Last call: only if there's a real deadline Ask AI to write each one with a subject line, preview text and a body of no more than 200 words with a single call to action, plus three alternative subject lines so you can test them. Follow the email rules where you operate. Broadly: only email people who agreed to hear from you or who have a relationship with you that the law recognizes, include a working unsubscribe link and the business details required, and keep subject lines honest. The specifics vary by country (for example, CAN-SPAM in the US, CASL in Canada, and GDPR together with the electronic marketing rules in the UK (PECR) and the EU), so check the rules where you and your subscribers are. Social posts and ads AI is excellent at producing variations to test: different hooks, angles and audiences. Write ad copy for [PLATFORM] promoting [OFFER] to [AUDIENCE]. Give me six variations across three angles: (a) the problem, (b) the outcome, (c) the main objection. For each: primary text under [125] characters, a headline under [40] characters, and an image idea. Rules: no claims we can't prove, no guaranteed results, no fake urgency, and no wording that asserts or implies the viewer's personal characteristics (for example, \"Struggling with your debt?\"). Follow [PLATFORM]'s advertising policies. That last rule matters: major ad platforms reject ads that call out sensitive personal attributes such as health, finances or age. Run two or three variations on a small budget and let real results, not the AI's opinion, pick the winner. The human review step Before anything goes live, someone checks it against this list. If you work alone, review it the next morning with fresh eyes. Every claim is true and provable, including words like \"best,\" \"fastest\" and \"guaranteed\" Scarcity is real: deadlines and limited spots actually exist No invented testimonials, reviews or endorsements. In the US, the FTC's rule on fake reviews explicitly covers AI-generated ones Prices, dates, links and promo codes are tested Industry rules are checked if you're in a regulated field such as health, finance, legal or real estate It sounds like your brand Email consent and unsubscribe requirements are met Learn from every campaign Here are the results of our campaign: \"\"\" [PASTE METRICS: opens, clicks, replies and sales by email or ad] \"\"\" Summarize what worked and what didn't, suggest three possible reasons, and propose one test for the next campaign. Only draw conclusions the numbers support, and flag where the sample is too small to tell. Do this now Choose one upcoming promotion. Complete the offer worksheet, pressure-test it with the customer prompt, then generate the campaign plan and the first email. Run everything through the review checklist before it goes out. Key takeaways Fix the offer before you write the copy; AI is a fast way to pressure-test it. Plan the whole campaign as a calendar, then draft each piece with clear limits. Use AI for variations and let real results choose the winners. A human reviews every claim, deadline, testimonial and consent rule before launch.","blocks":[{"lang":"","text":"Here is an offer I'm planning:\n\"\"\"\n[PASTE WORKSHEET]\n\"\"\"\nAct as my target customer: [DESCRIBE THEM]. Tell me honestly:\n1. What would make you say yes right away?\n2. What would make you hesitate or ignore it?\n3. What would you need answered before buying?\nThen suggest three ways to make the offer clearer or more compelling without discounting it."},{"lang":"","text":"Plan a [TWO-WEEK] campaign to [GOAL] for [AUDIENCE].\nChannels: [FOR EXAMPLE: EMAIL LIST OF ABOUT 800 PEOPLE, INSTAGRAM, LINKEDIN, A SMALL PAID AD BUDGET].\nOffer:\n\"\"\"\n[PASTE]\n\"\"\"\nGive me a day-by-day calendar as a table (day, channel, message angle, call to action) and a short note explaining the order. Keep it realistic for a small team: no more than [NUMBER] pieces per week."},{"lang":"","text":"Write ad copy for [PLATFORM] promoting [OFFER] to [AUDIENCE].\nGive me six variations across three angles: (a) the problem, (b) the outcome, (c) the main objection.\nFor each: primary text under [125] characters, a headline under [40] characters, and an image idea.\n\nRules: no claims we can't prove, no guaranteed results, no fake urgency, and no wording that asserts or implies the viewer's personal characteristics (for example, \"Struggling with your debt?\"). Follow [PLATFORM]'s advertising policies."},{"lang":"","text":"Here are the results of our campaign:\n\"\"\"\n[PASTE METRICS: opens, clicks, replies and sales by email or ad]\n\"\"\"\nSummarize what worked and what didn't, suggest three possible reasons, and propose one test for the next campaign. Only draw conclusions the numbers support, and flag where the sample is too small to tell."}],"quiz":[{"q":"Why does the lesson say to complete the offer worksheet before writing any campaign copy?","options":["Because AI can't write copy until a full price list exists","Because email rules require the offer to be documented first","Because even great copy can't rescue a weak offer","Because the worksheet replaces the need for a human review"],"answer":2,"explain":"The lesson's first principle is to start with the offer, not the copy, because great copy can't rescue a weak offer; AI can then help pressure-test it."},{"q":"A yoga studio's AI-drafted ad reads: 'Struggling with back pain? Join our class.' What's the problem, according to the lesson?","options":["It's too short to meet the platform's minimum length for ads","It doesn't include a guarantee of results for new members","It uses the problem angle instead of the outcome angle","It implies the viewer's health condition, which platforms reject"],"answer":3,"explain":"The lesson's ad rules forbid wording that asserts or implies the viewer's personal characteristics, and notes that major ad platforms reject ads that call out sensitive attributes such as health."},{"q":"A solo bookkeeper's AI-drafted 'last call' email says only five spots remain, but she has no real limit. What should she do before sending?","options":["Remove the false scarcity, since deadlines and limits must be real","Keep it, since urgency is a normal part of any last-call email","Ask AI to soften the wording so the limit sounds less certain","Send it now, then review it with fresh eyes the next morning"],"answer":0,"explain":"The lesson's review checklist requires scarcity to be real, and the last-call email belongs in a sequence only if there's a real deadline."}],"videoUrl":null},{"n":11,"slug":"lead-response-and-follow-up","title":"Respond to Leads Fast and Follow Up Consistently","summary":"Use AI to answer new inquiries quickly, personalize follow-ups and stop good leads going cold, with a person always in control.","durationMin":15,"module":4,"moduleTitle":"Sales & Customer Service","html":"\u003csection class=\"sec sec-intro\">\u003cp>For many small businesses, the cheapest new revenue comes from leads they already have. Inquiries get answered late, quotes never get followed up, &quot;not right now&quot; prospects are never contacted again. That&#39;s not a marketing problem; it&#39;s a follow-up problem. And follow-up is mostly writing and remembering, which is exactly what AI and a little structure handle well.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Where leads leak\u003c/h2>\n\u003cp>Sketch your lead journey from first inquiry to decision, then look for the gaps. The usual leaks are:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Slow first replies,\u003c/strong> especially evenings, weekends and busy weeks\u003c/li>\n\u003cli>\u003cstrong>Generic replies\u003c/strong> that don&#39;t answer the question the person actually asked\u003c/li>\n\u003cli>\u003cstrong>No follow-up after a quote,\u003c/strong> because everyone assumes the prospect will get in touch\u003c/li>\n\u003cli>\u003cstrong>No system for &quot;not now&quot; leads,\u003c/strong> who were interested but not ready\u003c/li>\n\u003cli>\u003cstrong>Lost leads and past customers\u003c/strong> who are never contacted again\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Level 1: AI-drafted replies (start here)\u003c/h2>\n\u003cp>Combine your context pack, FAQ answers and voice guide with a reply prompt. AI drafts; a person reviews and sends.\u003c/p>\n\u003cpre>\u003ccode>You&#39;re drafting a first reply to a new inquiry for [COMPANY].\nOur services, pricing guidance and FAQs:\n&quot;&quot;&quot;\n[PASTE OR ATTACH]\n&quot;&quot;&quot;\nOur goal for this first reply: [BOOK A CALL / BOOK A SITE VISIT / COMPLETE A QUOTE REQUEST FORM].\n\nInquiry:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\nWrite a reply that:\n- Thanks them by name and shows we read their message by referencing one specific detail\n- Answers their direct questions using only our information; if we can&#39;t answer something, say we&#39;ll confirm it on the call\n- Asks at most two qualifying questions: [FOR EXAMPLE, TIMELINE, BUDGET RANGE, LOCATION]\n- Ends with one clear next step and this link: [BOOKING LINK]\nKeep it under 140 words.\n\nThen, separately, write a one-line lead summary for our CRM: need, timeline, budget signal, fit (high, medium or low) and why.\n\u003c/code>\u003c/pre>\n\u003cp>The second part is a quiet time-saver: every lead arrives in your CRM with a consistent summary, which makes pipeline reviews much faster.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Level 2: A follow-up system\u003c/h2>\n\u003cp>Write your cadence down once, so follow-up stops depending on memory. Here&#39;s a starting point for after a quote; adjust the timing to your sales cycle.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>When\u003c/th>\n\u003cth>Channel\u003c/th>\n\u003cth>Purpose\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Day 0\u003c/td>\n\u003ctd>Email\u003c/td>\n\u003ctd>Send the quote with a short recap of their goals\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Day 2\u003c/td>\n\u003ctd>Email, or text if they&#39;ve agreed to texts\u003c/td>\n\u003ctd>Any questions? Offer a 15-minute walkthrough\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Day 6\u003c/td>\n\u003ctd>Email\u003c/td>\n\u003ctd>Add value: answer a common concern or share a relevant FAQ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Day 12\u003c/td>\n\u003ctd>Phone or personal email\u003c/td>\n\u003ctd>A direct, friendly question: is this still a priority?\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Day 25\u003c/td>\n\u003ctd>Email\u003c/td>\n\u003ctd>Close the loop politely: &quot;Should I close your file for now?&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>After that\u003c/td>\n\u003ctd>Newsletter\u003c/td>\n\u003ctd>Stay in touch, with their consent\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre>\u003ccode>Write a follow-up sequence for a prospect who received our quote for [SERVICE].\nContext:\n&quot;&quot;&quot;\n[PASTE CALL NOTES OR CRM SUMMARY]\n&quot;&quot;&quot;\nUse this cadence: [PASTE CADENCE].\nEach message: under 100 words, adds something useful, references their specific situation and ends with one low-pressure question. No guilt-tripping and no fake deadlines. The final message is a polite close-the-loop.\n\u003c/code>\u003c/pre>\n\u003cp>One rule makes follow-up work: \u003cstrong>every message must reference something specific to that person.\u003c/strong> A generic &quot;just checking in&quot; is noise. A message that mentions their timeline or their concern about disruption is service.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Level 3: Connect the handoffs, with approval\u003c/h2>\n\u003cp>Once drafted replies and follow-ups have worked manually for a few weeks, connect the steps with your CRM&#39;s built-in automation or a no-code platform such as Zapier or Make:\u003c/p>\n\u003col>\n\u003cli>A new form submission creates or updates the contact in your CRM.\u003c/li>\n\u003cli>AI drafts the reply and the lead summary.\u003c/li>\n\u003cli>The draft lands in your inbox, CRM or team chat for approval.\u003c/li>\n\u003cli>A team member edits and sends it.\u003c/li>\n\u003cli>Follow-up tasks are created automatically on the cadence dates.\u003c/li>\n\u003c/ol>\n\u003cp>Keep human approval on customer-facing messages until you have weeks of evidence the drafts are consistently right, and keep it permanently for anything involving price or scope. One thing you \u003cem>can\u003c/em> send instantly without AI: a simple, pre-written acknowledgment that says you received the message and when they&#39;ll hear back.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Reactivate past customers and &quot;not now&quot; leads\u003c/h2>\n\u003cp>Every few months, group past customers and paused leads into segments in your CRM, such as &quot;bought a spring cleanup in the last two years&quot; or &quot;asked for a quote but said not yet.&quot; Describe each segment to the AI without pasting names or contact details, and ask it to help you write a short, genuinely useful check-in for each one: a seasonal reminder, a new service that fits what they bought before, or a helpful tip. Send it through your email tool or CRM from a real person, only to people you have permission to contact, and make it easy to reply.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Measure it\u003c/h2>\n\u003cp>Track three numbers, before and after:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Median time to first reply\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Follow-up completion rate:\u003c/strong> the share of quotes that received the full cadence\u003c/li>\n\u003cli>\u003cstrong>Quote-to-win rate\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Take your last ten inquiries, anonymized if they contain personal details. Run each through the reply prompt and compare the drafts with what was actually sent. Then write your post-quote cadence and set it up as recurring tasks in your CRM or calendar, so follow-up happens whether or not anyone remembers.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Slow and missing follow-up often costs more revenue than a shortage of leads.\u003c/li>\n\u003cli>Start with AI-drafted replies that a person sends, plus a one-line CRM summary.\u003c/li>\n\u003cli>Write your cadence down and make every follow-up specific to the person.\u003c/li>\n\u003cli>Automate the handoffs only after the manual version works, and keep approval on anything about price.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"For many small businesses, the cheapest new revenue comes from leads they already have. Inquiries get answered late, quotes never get followed up, \"not right now\" prospects are never contacted again. That's not a marketing problem; it's a follow-up problem. And follow-up is mostly writing and remembering, which is exactly what AI and a little structure handle well. Where leads leak Sketch your lead journey from first inquiry to decision, then look for the gaps. The usual leaks are: Slow first replies, especially evenings, weekends and busy weeks Generic replies that don't answer the question the person actually asked No follow-up after a quote, because everyone assumes the prospect will get in touch No system for \"not now\" leads, who were interested but not ready Lost leads and past customers who are never contacted again Level 1: AI-drafted replies (start here) Combine your context pack, FAQ answers and voice guide with a reply prompt. AI drafts; a person reviews and sends. You're drafting a first reply to a new inquiry for [COMPANY]. Our services, pricing guidance and FAQs: \"\"\" [PASTE OR ATTACH] \"\"\" Our goal for this first reply: [BOOK A CALL / BOOK A SITE VISIT / COMPLETE A QUOTE REQUEST FORM]. Inquiry: \"\"\" [PASTE] \"\"\" Write a reply that: - Thanks them by name and shows we read their message by referencing one specific detail - Answers their direct questions using only our information; if we can't answer something, say we'll confirm it on the call - Asks at most two qualifying questions: [FOR EXAMPLE, TIMELINE, BUDGET RANGE, LOCATION] - Ends with one clear next step and this link: [BOOKING LINK] Keep it under 140 words. Then, separately, write a one-line lead summary for our CRM: need, timeline, budget signal, fit (high, medium or low) and why. The second part is a quiet time-saver: every lead arrives in your CRM with a consistent summary, which makes pipeline reviews much faster. Level 2: A follow-up system Write your cadence down once, so follow-up stops depending on memory. Here's a starting point for after a quote; adjust the timing to your sales cycle. When Channel Purpose Day 0 Email Send the quote with a short recap of their goals Day 2 Email, or text if they've agreed to texts Any questions? Offer a 15-minute walkthrough Day 6 Email Add value: answer a common concern or share a relevant FAQ Day 12 Phone or personal email A direct, friendly question: is this still a priority? Day 25 Email Close the loop politely: \"Should I close your file for now?\" After that Newsletter Stay in touch, with their consent Write a follow-up sequence for a prospect who received our quote for [SERVICE]. Context: \"\"\" [PASTE CALL NOTES OR CRM SUMMARY] \"\"\" Use this cadence: [PASTE CADENCE]. Each message: under 100 words, adds something useful, references their specific situation and ends with one low-pressure question. No guilt-tripping and no fake deadlines. The final message is a polite close-the-loop. One rule makes follow-up work: every message must reference something specific to that person. A generic \"just checking in\" is noise. A message that mentions their timeline or their concern about disruption is service. Level 3: Connect the handoffs, with approval Once drafted replies and follow-ups have worked manually for a few weeks, connect the steps with your CRM's built-in automation or a no-code platform such as Zapier or Make: A new form submission creates or updates the contact in your CRM. AI drafts the reply and the lead summary. The draft lands in your inbox, CRM or team chat for approval. A team member edits and sends it. Follow-up tasks are created automatically on the cadence dates. Keep human approval on customer-facing messages until you have weeks of evidence the drafts are consistently right, and keep it permanently for anything involving price or scope. One thing you can send instantly without AI: a simple, pre-written acknowledgment that says you received the message and when they'll hear back. Reactivate past customers and \"not now\" leads Every few months, group past customers and paused leads into segments in your CRM, such as \"bought a spring cleanup in the last two years\" or \"asked for a quote but said not yet.\" Describe each segment to the AI without pasting names or contact details, and ask it to help you write a short, genuinely useful check-in for each one: a seasonal reminder, a new service that fits what they bought before, or a helpful tip. Send it through your email tool or CRM from a real person, only to people you have permission to contact, and make it easy to reply. Measure it Track three numbers, before and after: Median time to first reply Follow-up completion rate: the share of quotes that received the full cadence Quote-to-win rate Do this now Take your last ten inquiries, anonymized if they contain personal details. Run each through the reply prompt and compare the drafts with what was actually sent. Then write your post-quote cadence and set it up as recurring tasks in your CRM or calendar, so follow-up happens whether or not anyone remembers. Key takeaways Slow and missing follow-up often costs more revenue than a shortage of leads. Start with AI-drafted replies that a person sends, plus a one-line CRM summary. Write your cadence down and make every follow-up specific to the person. Automate the handoffs only after the manual version works, and keep approval on anything about price.","blocks":[{"lang":"","text":"You're drafting a first reply to a new inquiry for [COMPANY].\nOur services, pricing guidance and FAQs:\n\"\"\"\n[PASTE OR ATTACH]\n\"\"\"\nOur goal for this first reply: [BOOK A CALL / BOOK A SITE VISIT / COMPLETE A QUOTE REQUEST FORM].\n\nInquiry:\n\"\"\"\n[PASTE]\n\"\"\"\n\nWrite a reply that:\n- Thanks them by name and shows we read their message by referencing one specific detail\n- Answers their direct questions using only our information; if we can't answer something, say we'll confirm it on the call\n- Asks at most two qualifying questions: [FOR EXAMPLE, TIMELINE, BUDGET RANGE, LOCATION]\n- Ends with one clear next step and this link: [BOOKING LINK]\nKeep it under 140 words.\n\nThen, separately, write a one-line lead summary for our CRM: need, timeline, budget signal, fit (high, medium or low) and why."},{"lang":"","text":"Write a follow-up sequence for a prospect who received our quote for [SERVICE].\nContext:\n\"\"\"\n[PASTE CALL NOTES OR CRM SUMMARY]\n\"\"\"\nUse this cadence: [PASTE CADENCE].\nEach message: under 100 words, adds something useful, references their specific situation and ends with one low-pressure question. No guilt-tripping and no fake deadlines. The final message is a polite close-the-loop."}],"quiz":[{"q":"According to the lesson, what one rule makes a follow-up sequence work?","options":["Send every follow-up within an hour of the quote going out","Every message references something specific to that person","Each message includes a deadline to create a sense of urgency","Follow-ups come from an automated address rather than a person"],"answer":1,"explain":"The lesson says a generic \"just checking in\" is noise, while a message that mentions the prospect's timeline or concern is service. It also rules out guilt-tripping and fake deadlines."},{"q":"A landscaping company has run AI-drafted replies by hand for a month and now connects its web form, AI drafts and CRM with a no-code tool. Which message should still always get a person's approval before it's sent?","options":["A pre-written note confirming the inquiry was received","The one-line lead summary saved into the CRM record","The follow-up tasks created on the cadence dates","A reply that confirms the price and scope of a job"],"answer":3,"explain":"The lesson says to keep human approval permanently for anything involving price or scope. A simple, pre-written acknowledgment is the one thing it says you can send instantly without AI."},{"q":"A cleaning business wants to win back customers who bought a spring deep clean in the last two years. Which approach follows the lesson?","options":["Describe the segment without names, then have a person send a useful check-in to those who agreed to contact","Paste the full customer list with emails so the AI can personalize each check-in by name and address","Have the AI email a discount automatically to everyone who has ever filled in the inquiry form","Wait for past customers to get back in touch on their own once they're ready to book again"],"answer":0,"explain":"The lesson says to describe each segment to the AI without pasting names or contact details, then send a genuinely useful check-in from a real person, only to people you have permission to contact."}],"videoUrl":null},{"n":12,"slug":"proposals-and-sales-calls","title":"Sales Call Prep, Call Notes and Proposals","summary":"Walk into every sales conversation prepared, capture what matters, and turn it into a tailored proposal in a fraction of the time.","durationMin":15,"module":4,"moduleTitle":"Sales & Customer Service","html":"\u003csection class=\"sec sec-intro\">\u003cp>Sales conversations are where your business is won or lost. AI can&#39;t have them for you, and it shouldn&#39;t. What it can do is handle the work around them: the research before, the notes during and the proposal after. That&#39;s often hours per deal, and the quality goes up at the same time.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Before the call: a 10-minute prep brief\u003c/h2>\n\u003cp>Gather what you already have: the inquiry, past emails, CRM notes and anything public about their business.\u003c/p>\n\u003cpre>\u003ccode>I have a sales call with [NAME, ROLE] at [COMPANY] about [TOPIC].\nWhat I know:\n&quot;&quot;&quot;\n[PASTE INQUIRY, EMAILS, CRM NOTES AND PUBLIC INFORMATION FROM THEIR WEBSITE]\n&quot;&quot;&quot;\nOur offers:\n&quot;&quot;&quot;\n[PASTE A SHORT SUMMARY OF YOUR OFFERS]\n&quot;&quot;&quot;\nPrepare a one-page call brief:\n1. What they likely want and why now (label assumptions clearly as assumptions)\n2. Five discovery questions about their goals, constraints, decision process and budget\n3. The three objections most likely to come up, each with a short, honest response\n4. Which of our offers fits best, and why\n5. A suggested agenda for a 30-minute call\n\u003c/code>\u003c/pre>\n\u003cp>If your assistant can browse the web, it can gather public information for you. Verify anything you plan to mention on the call, and never present a guess about their business as fact.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>During the call: capture, don&#39;t type\u003c/h2>\n\u003cp>Typing notes while someone talks splits your attention. Two better options:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Record and transcribe.\u003c/strong> Many video-call tools and AI note-takers can do this. Always ask permission first: recording laws vary, and some places require everyone on the call to consent.\u003c/li>\n\u003cli>\u003cstrong>Talk it out afterwards.\u003c/strong> If you&#39;d rather not record, jot a few words during the call, then dictate a two-minute voice memo straight after while it&#39;s fresh.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>After the call: from notes to a structured summary\u003c/h2>\n\u003cpre>\u003ccode>Here is the transcript (or my notes) from a sales call. Create:\n1. A five-bullet summary\n2. Their goals, in their words (quote them where possible)\n3. Their problems, and what those problems cost them, if mentioned\n4. Decision makers, timeline and budget signals\n5. Objections or concerns they raised\n6. Agreed next steps, each with an owner and a date\n7. A one-line note for our CRM\n\nUse only what was said. Mark anything uncertain with [CHECK].\n\nTRANSCRIPT:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>Paste the CRM note in right away, and send the prospect a short recap of next steps the same day. Prospects notice when you remember exactly what they said.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Proposals: build the template once\u003c/h2>\n\u003cp>Much of any proposal is the same from one client to the next. Build a template with reusable sections, then let AI tailor it from your call summary.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Section\u003c/th>\n\u003cth>Where it comes from\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Their situation and goals\u003c/td>\n\u003ctd>The call summary, in their words\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recommended approach\u003c/td>\n\u003ctd>Your offer descriptions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scope: included and not included\u003c/td>\n\u003ctd>Your standard scope blocks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Timeline\u003c/td>\n\u003ctd>Your standard timeline for that offer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Investment\u003c/td>\n\u003ctd>Your price list, entered by a person\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Why us\u003c/td>\n\u003ctd>Your context pack, with real proof only\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Next steps\u003c/td>\n\u003ctd>How to accept and what happens next\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre>\u003ccode>Draft a proposal for [CLIENT] using our template and the call summary below.\nRules:\n- Describe their goals in their own words.\n- Choose scope only from our standard scope blocks; don&#39;t invent services.\n- Leave every price as [PRICE]. I&#39;ll add pricing from our price list.\n- Keep it under [TWO] pages, in plain English with no jargon.\n\nTEMPLATE:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\nSCOPE BLOCKS:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\nCALL SUMMARY:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>The pricing rule:\u003c/strong> AI never sets prices or calculates totals that go to a client unchecked. Insert prices from your own pricing sheet and double-check any arithmetic.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Make it sharper before you send\u003c/h2>\n\u003cpre>\u003ccode>Read this proposal as the client&#39;s most skeptical decision maker, who is comparing us with a cheaper option. List the five questions or doubts you&#39;d have, then suggest specific edits to address each one without adding claims we can&#39;t support.\n&quot;&quot;&quot;\n[PASTE PROPOSAL]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Learn from your pipeline\u003c/h2>\n\u003cp>Once a month, paste five to ten anonymized call summaries, from deals both won and lost, and ask AI to find patterns: recurring objections, questions you&#39;re asked every time, and reasons deals stall. Feed what you learn into your FAQs, your website copy and your offers. Over time, your sales conversations get easier because the answers are already out there.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Build your proposal template and write your standard scope blocks. Then use the prep, summary and proposal prompts on your next sales call (or retroactively on a recent one), and time each step so you have a baseline to compare against.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>AI handles the work around the sales conversation: prep, notes and proposals.\u003c/li>\n\u003cli>Always get consent before recording, and verify any research before you use it.\u003c/li>\n\u003cli>A reusable proposal template plus a call summary produces tailored proposals quickly.\u003c/li>\n\u003cli>AI never sets prices; a person enters and checks them every time.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Sales conversations are where your business is won or lost. AI can't have them for you, and it shouldn't. What it can do is handle the work around them: the research before, the notes during and the proposal after. That's often hours per deal, and the quality goes up at the same time. Before the call: a 10-minute prep brief Gather what you already have: the inquiry, past emails, CRM notes and anything public about their business. I have a sales call with [NAME, ROLE] at [COMPANY] about [TOPIC]. What I know: \"\"\" [PASTE INQUIRY, EMAILS, CRM NOTES AND PUBLIC INFORMATION FROM THEIR WEBSITE] \"\"\" Our offers: \"\"\" [PASTE A SHORT SUMMARY OF YOUR OFFERS] \"\"\" Prepare a one-page call brief: 1. What they likely want and why now (label assumptions clearly as assumptions) 2. Five discovery questions about their goals, constraints, decision process and budget 3. The three objections most likely to come up, each with a short, honest response 4. Which of our offers fits best, and why 5. A suggested agenda for a 30-minute call If your assistant can browse the web, it can gather public information for you. Verify anything you plan to mention on the call, and never present a guess about their business as fact. During the call: capture, don't type Typing notes while someone talks splits your attention. Two better options: Record and transcribe. Many video-call tools and AI note-takers can do this. Always ask permission first: recording laws vary, and some places require everyone on the call to consent. Talk it out afterwards. If you'd rather not record, jot a few words during the call, then dictate a two-minute voice memo straight after while it's fresh. After the call: from notes to a structured summary Here is the transcript (or my notes) from a sales call. Create: 1. A five-bullet summary 2. Their goals, in their words (quote them where possible) 3. Their problems, and what those problems cost them, if mentioned 4. Decision makers, timeline and budget signals 5. Objections or concerns they raised 6. Agreed next steps, each with an owner and a date 7. A one-line note for our CRM Use only what was said. Mark anything uncertain with [CHECK]. TRANSCRIPT: \"\"\" [PASTE] \"\"\" Paste the CRM note in right away, and send the prospect a short recap of next steps the same day. Prospects notice when you remember exactly what they said. Proposals: build the template once Much of any proposal is the same from one client to the next. Build a template with reusable sections, then let AI tailor it from your call summary. Section Where it comes from Their situation and goals The call summary, in their words Recommended approach Your offer descriptions Scope: included and not included Your standard scope blocks Timeline Your standard timeline for that offer Investment Your price list, entered by a person Why us Your context pack, with real proof only Next steps How to accept and what happens next Draft a proposal for [CLIENT] using our template and the call summary below. Rules: - Describe their goals in their own words. - Choose scope only from our standard scope blocks; don't invent services. - Leave every price as [PRICE]. I'll add pricing from our price list. - Keep it under [TWO] pages, in plain English with no jargon. TEMPLATE: \"\"\" [PASTE] \"\"\" SCOPE BLOCKS: \"\"\" [PASTE] \"\"\" CALL SUMMARY: \"\"\" [PASTE] \"\"\" The pricing rule: AI never sets prices or calculates totals that go to a client unchecked. Insert prices from your own pricing sheet and double-check any arithmetic. Make it sharper before you send Read this proposal as the client's most skeptical decision maker, who is comparing us with a cheaper option. List the five questions or doubts you'd have, then suggest specific edits to address each one without adding claims we can't support. \"\"\" [PASTE PROPOSAL] \"\"\" Learn from your pipeline Once a month, paste five to ten anonymized call summaries, from deals both won and lost, and ask AI to find patterns: recurring objections, questions you're asked every time, and reasons deals stall. Feed what you learn into your FAQs, your website copy and your offers. Over time, your sales conversations get easier because the answers are already out there. Do this now Build your proposal template and write your standard scope blocks. Then use the prep, summary and proposal prompts on your next sales call (or retroactively on a recent one), and time each step so you have a baseline to compare against. Key takeaways AI handles the work around the sales conversation: prep, notes and proposals. Always get consent before recording, and verify any research before you use it. A reusable proposal template plus a call summary produces tailored proposals quickly. AI never sets prices; a person enters and checks them every time.","blocks":[{"lang":"","text":"I have a sales call with [NAME, ROLE] at [COMPANY] about [TOPIC].\nWhat I know:\n\"\"\"\n[PASTE INQUIRY, EMAILS, CRM NOTES AND PUBLIC INFORMATION FROM THEIR WEBSITE]\n\"\"\"\nOur offers:\n\"\"\"\n[PASTE A SHORT SUMMARY OF YOUR OFFERS]\n\"\"\"\nPrepare a one-page call brief:\n1. What they likely want and why now (label assumptions clearly as assumptions)\n2. Five discovery questions about their goals, constraints, decision process and budget\n3. The three objections most likely to come up, each with a short, honest response\n4. Which of our offers fits best, and why\n5. A suggested agenda for a 30-minute call"},{"lang":"","text":"Here is the transcript (or my notes) from a sales call. Create:\n1. A five-bullet summary\n2. Their goals, in their words (quote them where possible)\n3. Their problems, and what those problems cost them, if mentioned\n4. Decision makers, timeline and budget signals\n5. Objections or concerns they raised\n6. Agreed next steps, each with an owner and a date\n7. A one-line note for our CRM\n\nUse only what was said. Mark anything uncertain with [CHECK].\n\nTRANSCRIPT:\n\"\"\"\n[PASTE]\n\"\"\""},{"lang":"","text":"Draft a proposal for [CLIENT] using our template and the call summary below.\nRules:\n- Describe their goals in their own words.\n- Choose scope only from our standard scope blocks; don't invent services.\n- Leave every price as [PRICE]. I'll add pricing from our price list.\n- Keep it under [TWO] pages, in plain English with no jargon.\n\nTEMPLATE:\n\"\"\"\n[PASTE]\n\"\"\"\nSCOPE BLOCKS:\n\"\"\"\n[PASTE]\n\"\"\"\nCALL SUMMARY:\n\"\"\"\n[PASTE]\n\"\"\""},{"lang":"","text":"Read this proposal as the client's most skeptical decision maker, who is comparing us with a cheaper option. List the five questions or doubts you'd have, then suggest specific edits to address each one without adding claims we can't support.\n\"\"\"\n[PASTE PROPOSAL]\n\"\"\""}],"quiz":[{"q":"What is the lesson's pricing rule for AI-drafted proposals?","options":["AI sets prices from past proposals, and a person reviews only the final total","AI calculates totals from the scope blocks so the arithmetic stays consistent","AI leaves prices as placeholders; a person enters them and checks the math","AI suggests a price range, and the client picks the figure that fits their budget"],"answer":2,"explain":"The lesson says AI never sets prices or calculates totals that go to a client unchecked. The proposal prompt leaves every price as a placeholder, and a person inserts prices from the pricing sheet and double-checks any arithmetic."},{"q":"A bookkeeping firm owner wants an AI note-taker to record and transcribe her video sales call with a prospect. What should she do first?","options":["Ask the prospect for permission, because recording laws vary by place","Start recording quietly so the conversation feels natural and relaxed","Record only the audio, since that avoids the need for anyone's consent","Type full notes during the call as a backup in case the recording fails"],"answer":0,"explain":"The lesson says to always ask permission before recording: recording laws vary, and some places require everyone on the call to consent. If she'd rather not record, she can jot a few words and dictate a voice memo straight after."},{"q":"A small marketing agency's AI prep brief says a prospect is probably expanding into a new region, based on a job posting it found online. How should the owner handle this before the call?","options":["Open the call by congratulating them on the expansion to build rapport","Delete it from the brief, since nothing found online can be trusted","Copy it into the proposal's situation section as confirmed background","Treat it as an assumption to verify, not something to present as fact"],"answer":3,"explain":"The prep prompt asks the AI to label assumptions clearly, and the lesson says to verify anything you plan to mention and never present a guess about their business as fact."}],"videoUrl":null},{"n":13,"slug":"customer-support-with-ai","title":"Customer Support: Drafts, FAQ Assistants and Escalation","summary":"Answer customers faster and more consistently with AI-drafted replies and a carefully scoped FAQ assistant, and know exactly when a person takes over.","durationMin":16,"module":4,"moduleTitle":"Sales & Customer Service","html":"\u003csection class=\"sec sec-intro\">\u003cp>Customer support is where AI can create both delight and disaster. Fast, accurate, friendly answers build loyalty. A bot that confidently invents a policy destroys it, and you&#39;ll own the consequences. In a widely reported 2024 case, a Canadian tribunal held an airline responsible for incorrect information its website chatbot gave a customer about bereavement fares. Whatever your AI tells customers, your business is saying it.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The support maturity ladder\u003c/h2>\n\u003cp>Climb one rung at a time. Most small businesses get most of the value from the first two.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>What AI does\u003c/th>\n\u003cth>What people do\u003c/th>\n\u003cth>Move up when\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1. Draft assistant\u003c/td>\n\u003ctd>Drafts replies for your team\u003c/td>\n\u003ctd>Review and send every reply\u003c/td>\n\u003ctd>Drafts consistently need only light edits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2. Knowledge base\u003c/td>\n\u003ctd>Helps write and maintain FAQs and help articles\u003c/td>\n\u003ctd>Approve every article\u003c/td>\n\u003ctd>Your common questions are covered in writing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3. FAQ assistant\u003c/td>\n\u003ctd>Answers customers directly from approved content only\u003c/td>\n\u003ctd>Handle escalations; review conversations weekly\u003c/td>\n\u003ctd>Only for low-risk questions with clear answers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4. Assisted actions\u003c/td>\n\u003ctd>Looks up orders, changes bookings and so on\u003c/td>\n\u003ctd>Approve anything involving money or personal data\u003c/td>\n\u003ctd>Usually worth an implementation partner\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 1: Build the knowledge base first\u003c/h2>\n\u003cp>AI support is only as good as the content behind it. Gather your policies (refunds, cancellations, warranties, delivery), your packages and pricing, your process and timelines, and your best answers to the questions customers ask most. Your inbox already contains the questions:\u003c/p>\n\u003cpre>\u003ccode>Below are [50] anonymized customer emails from recent months.\n1. Group them into question themes and count how often each theme appears.\n2. For each theme, write the question the way a customer would ask it.\n3. Draft an answer using ONLY the policies below. If the policies don&#39;t answer it, write &quot;POLICY GAP&quot; and explain what&#39;s missing.\n\nPOLICIES:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\nEMAILS:\n&quot;&quot;&quot;\n[PASTE]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003cp>The policy gaps are gold. Each one is a question your team has been answering inconsistently. Decide the answer, write it down and add it to the knowledge base before any AI faces a customer.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 2: AI-drafted replies\u003c/h2>\n\u003cpre>\u003ccode>Draft a reply to this customer message for [COMPANY], using only the knowledge base below.\n- Acknowledge their situation in one specific sentence (no generic &quot;we apologize for any inconvenience&quot;).\n- Answer every question they asked, in order.\n- If they&#39;re angry or threatening to leave, mention legal action, raise a safety issue or
