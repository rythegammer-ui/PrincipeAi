the [CHECK] rule, a tour of the prompt library\u003c/td>\n\u003ctd>Add one tested prompt to the library\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3. Your workflows\u003c/td>\n\u003ctd>90 min\u003c/td>\n\u003ctd>Hands-on, in pairs, with your actual pilot projects\u003c/td>\n\u003ctd>Use the new workflow for a week and time it\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4. Show and tell\u003c/td>\n\u003ctd>45 min\u003c/td>\n\u003ctd>Everyone shares one win and one failure; update prompts and SOPs\u003c/td>\n\u003ctd>Suggest the next workflow to improve\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Failures in session 4 are as valuable as wins. They show you where prompts, examples or reference documents need work, and they make it safe for people to admit when something didn&#39;t go well.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Appoint AI champions\u003c/h2>\n\u003cp>Choose one or two people who are curious and respected by their colleagues. They don&#39;t need to be the most technical. Their job:\u003c/p>\n\u003cul>\n\u003cli>Be the first port of call for questions\u003c/li>\n\u003cli>Maintain the prompt library and spot what needs updating\u003c/li>\n\u003cli>Run a short monthly show-and-tell\u003c/li>\n\u003cli>Collect wins, problems and ideas, and pass them to you\u003c/li>\n\u003c/ul>\n\u003cp>Give champions a couple of hours of protected time each week. Volunteer enthusiasm fades quickly without it.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Practice with safe exercises\u003c/h2>\n\u003cp>Practice works best with realistic but fictional material, so nobody is tempted to paste real customer data while learning.\u003c/p>\n\u003cpre>\u003ccode>I&#39;m training my team to use AI. Create five practice exercises for a [ROLE] at a [BUSINESS TYPE], based on tasks they really do: [LIST TASKS].\nFor each exercise, give: the scenario, fictional sample input they can use (no real customer data), what a good result looks like, and one common mistake to watch for.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Make sharing a habit\u003c/h2>\n\u003cul>\n\u003cli>Set up a shared channel or thread for AI tips, prompts and results\u003c/li>\n\u003cli>Spend ten minutes in a regular team meeting on one win and one lesson learned\u003c/li>\n\u003cli>Celebrate time saved \u003cem>and\u003c/em> how it was reinvested\u003c/li>\n\u003cli>Add AI basics and the usage policy to onboarding for every new hire\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Measure adoption\u003c/h2>\n\u003cp>Track a few simple signals: how many people use AI for work each week, which library prompts get used, self-reported time saved and quality issues found in review. A three-question monthly survey is enough:\u003c/p>\n\u003col>\n\u003cli>Which AI workflows did you use this month?\u003c/li>\n\u003cli>Roughly how much time did they save you each week?\u003c/li>\n\u003cli>What&#39;s one thing that frustrated you or went wrong?\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Schedule session 1 and choose your champions. Then tell your team what&#39;s happening and why. Draft the announcement with AI, and edit it until it sounds like you:\u003c/p>\n\u003cpre>\u003ccode>Help me write a short, honest message to my team of [NUMBER] announcing that we&#39;re starting to use AI in [AREAS]. Explain why, what will change, what won&#39;t, how we&#39;ll train everyone, and that I want their ideas and concerns. Tone: [TONE]. Under 200 words. Don&#39;t overpromise.\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Adoption is a people challenge; address fears honestly before teaching tools.\u003c/li>\n\u003cli>Four short sessions on real work beat one long demo.\u003c/li>\n\u003cli>Champions with protected time keep momentum going after training ends.\u003c/li>\n\u003cli>Share wins and failures openly, and measure adoption with a few simple questions.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"Tools don't create ROI; habits do. Most AI rollouts stall for human reasons, not technical ones: people don't know where to start, they worry about what AI means for their jobs, or they tried it once, got a poor result and gave up. A little structured training fixes all three. Address the fear first Be direct about your intentions. If it's true, say something like: \"We're using AI to take away the work nobody enjoys and to serve customers better. This isn't about replacing anyone.\" If roles will change, say how, and how you'll support people through it. Honesty builds more trust than reassurance. Expect these concerns and have an honest answer ready: Concern An honest response \"Will this replace me?\" Share your intent, show which tasks you're targeting, and explain how freed-up time will be used \"It makes things up.\" It can. That's exactly why we review and verify, and you'll learn how \"I'm not technical.\" If you can write a clear email, you can do this. It's delegation, not coding \"It feels like cheating.\" Like a template or a calculator, it's a tool. You're still accountable for the result \"Customers will hate it.\" Customers see what we send, and a person reviews everything The four-session training plan Space the sessions about a week apart, and use your team's real work rather than toy examples. Session Length What it covers Homework 1. Foundations 60 min What AI is good and bad at, the usage policy, the traffic-light rules, first prompts Use AI for three real tasks and note what happened 2. The business brief 60 min The six-part brief, examples, the [CHECK] rule, a tour of the prompt library Add one tested prompt to the library 3. Your workflows 90 min Hands-on, in pairs, with your actual pilot projects Use the new workflow for a week and time it 4. Show and tell 45 min Everyone shares one win and one failure; update prompts and SOPs Suggest the next workflow to improve Failures in session 4 are as valuable as wins. They show you where prompts, examples or reference documents need work, and they make it safe for people to admit when something didn't go well. Appoint AI champions Choose one or two people who are curious and respected by their colleagues. They don't need to be the most technical. Their job: Be the first port of call for questions Maintain the prompt library and spot what needs updating Run a short monthly show-and-tell Collect wins, problems and ideas, and pass them to you Give champions a couple of hours of protected time each week. Volunteer enthusiasm fades quickly without it. Practice with safe exercises Practice works best with realistic but fictional material, so nobody is tempted to paste real customer data while learning. I'm training my team to use AI. Create five practice exercises for a [ROLE] at a [BUSINESS TYPE], based on tasks they really do: [LIST TASKS]. For each exercise, give: the scenario, fictional sample input they can use (no real customer data), what a good result looks like, and one common mistake to watch for. Make sharing a habit Set up a shared channel or thread for AI tips, prompts and results Spend ten minutes in a regular team meeting on one win and one lesson learned Celebrate time saved and how it was reinvested Add AI basics and the usage policy to onboarding for every new hire Measure adoption Track a few simple signals: how many people use AI for work each week, which library prompts get used, self-reported time saved and quality issues found in review. A three-question monthly survey is enough: Which AI workflows did you use this month? Roughly how much time did they save you each week? What's one thing that frustrated you or went wrong? Do this now Schedule session 1 and choose your champions. Then tell your team what's happening and why. Draft the announcement with AI, and edit it until it sounds like you: Help me write a short, honest message to my team of [NUMBER] announcing that we're starting to use AI in [AREAS]. Explain why, what will change, what won't, how we'll train everyone, and that I want their ideas and concerns. Tone: [TONE]. Under 200 words. Don't overpromise. Key takeaways Adoption is a people challenge; address fears honestly before teaching tools. Four short sessions on real work beat one long demo. Champions with protected time keep momentum going after training ends. Share wins and failures openly, and measure adoption with a few simple questions.","blocks":[{"lang":"","text":"I'm training my team to use AI. Create five practice exercises for a [ROLE] at a [BUSINESS TYPE], based on tasks they really do: [LIST TASKS].\nFor each exercise, give: the scenario, fictional sample input they can use (no real customer data), what a good result looks like, and one common mistake to watch for."},{"lang":"","text":"Help me write a short, honest message to my team of [NUMBER] announcing that we're starting to use AI in [AREAS]. Explain why, what will change, what won't, how we'll train everyone, and that I want their ideas and concerns. Tone: [TONE]. Under 200 words. Don't overpromise."}],"quiz":[{"q":"Why does the lesson say AI champions should get a couple of hours of protected time each week?","options":["Volunteer enthusiasm fades quickly without protected time","Champions must approve every prompt before anyone uses it","Champions need the time to run all four training sessions alone","It lets champions review every AI output the team sends out"],"answer":0,"explain":"The lesson says to give champions a couple of hours of protected time each week because volunteer enthusiasm fades quickly without it. Their role is to answer questions, maintain the prompt library, run show-and-tells and collect feedback."},{"q":"At a 12-person insurance brokerage, an experienced account manager asks, \"Will this replace me?\" What does the lesson suggest the owner do?","options":["Promise that nobody's role will ever change, whatever happens","Share the intent, the tasks targeted and how freed-up time will be used","Put off the conversation until the training sessions are finished","Point out that AI makes mistakes, so it couldn't really replace anyone"],"answer":1,"explain":"The lesson's honest response is to share your intent, show which tasks you're targeting and explain how freed-up time will be used. If roles will change, say how, because honesty builds more trust than reassurance."},{"q":"A dental practice manager is planning hands-on AI practice for the front-desk team. Which approach does the lesson recommend?","options":["Use last week's real patient emails so the practice feels authentic","Skip practice and show one long demo of everything AI can do","Use realistic but fictional material, like AI-written practice exercises","Let each person practice alone on whatever tasks they happen to pick"],"answer":2,"explain":"The lesson says practice works best with realistic but fictional material, so nobody is tempted to paste real customer data while learning. It includes a prompt that creates exercises with fictional sample input."}],"videoUrl":null},{"n":19,"slug":"measure-roi","title":"Measure ROI: Baseline, Measure, Iterate","summary":"Prove which AI projects are paying off with a simple baseline-and-measure method and a calculator you can build in any spreadsheet.","durationMin":15,"module":6,"moduleTitle":"Rollout, Safety & ROI","html":"\u003csection class=\"sec sec-intro\">\u003cp>&quot;We use AI and it feels faster&quot; isn&#39;t ROI. Measuring tells you where to invest more, what to fix or stop, and whether your tool spend is justified. It doesn&#39;t require complicated analytics. It requires a baseline, a consistent way to measure and a regular review.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>The three-step loop\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Baseline:\u003c/strong> measure the current process \u003cem>before\u003c/em> you change it.\u003c/li>\n\u003cli>\u003cstrong>Measure:\u003c/strong> after the change, measure the same way over a similar period.\u003c/li>\n\u003cli>\u003cstrong>Iterate:\u003c/strong> improve, scale or stop, based on what you find.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 1: Set the baseline\u003c/h2>\n\u003cp>For each pilot, choose one to three metrics that match its payoff:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Payoff\u003c/th>\n\u003cth>Example metrics\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Time\u003c/td>\n\u003ctd>Minutes per task, hours per week on the workflow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quality\u003c/td>\n\u003ctd>Edits needed, errors, rework, complaints, review scores\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Speed\u003c/td>\n\u003ctd>Time to first reply, turnaround time\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Revenue\u003c/td>\n\u003ctd>Follow-up completion rate, quote-to-win rate, repeat purchases\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Keep measurement simple. Time five to ten instances of the task with a stopwatch or time tracker. Pull response times from your inbox or CRM. Count volumes for two weeks. Rough but consistent beats precise but never done.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 2: Build the ROI calculator\u003c/h2>\n\u003cp>Set this up in any spreadsheet. The example numbers are hypothetical, for a business that writes 20 quotes a month.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Line\u003c/th>\n\u003cth>How to calculate\u003c/th>\n\u003cth>Example\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A. Tasks per month\u003c/td>\n\u003ctd>Count\u003c/td>\n\u003ctd>20\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B. Minutes per task before\u003c/td>\n\u003ctd>Measured baseline\u003c/td>\n\u003ctd>75\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C. Minutes per task after, including review\u003c/td>\n\u003ctd>Measured\u003c/td>\n\u003ctd>30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D. Hours saved per month\u003c/td>\n\u003ctd>A × (B − C) ÷ 60\u003c/td>\n\u003ctd>15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E. Loaded hourly cost\u003c/td>\n\u003ctd>Pay plus taxes, benefits and overhead\u003c/td>\n\u003ctd>$45\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F. Monthly value of time saved\u003c/td>\n\u003ctd>D × E\u003c/td>\n\u003ctd>$675\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G. Monthly tool costs\u003c/td>\n\u003ctd>Subscriptions used for this workflow\u003c/td>\n\u003ctd>$60\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H. One-off setup cost\u003c/td>\n\u003ctd>Setup hours × hourly cost\u003c/td>\n\u003ctd>10 × $45 = $450\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>I. Net monthly benefit\u003c/td>\n\u003ctd>F − G\u003c/td>\n\u003ctd>$615\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>J. Payback period\u003c/td>\n\u003ctd>H ÷ I\u003c/td>\n\u003ctd>About 0.7 months\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Three things people often get wrong:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Leaving review time out of line C.\u003c/strong> Measure the whole new process, not just how fast the AI generates a draft.\u003c/li>\n\u003cli>\u003cstrong>Using hourly pay instead of loaded cost.\u003c/strong> Include taxes, benefits and overhead. For the owner&#39;s time, use what an hour is worth on revenue-generating work.\u003c/li>\n\u003cli>\u003cstrong>Claiming every revenue change.\u003c/strong> If you measure a revenue payoff, like a higher quote-to-win rate, compare like with like and consider other explanations: seasonality, price changes or a new marketing push. Count it when the comparison is reasonable, and say how confident you are.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Time saved only counts if you use it\u003c/h2>\n\u003cp>Saved hours easily disappear into other busywork. Decide in advance where they&#39;ll go, such as more sales calls, faster delivery, better service or simply fewer late nights, and track it. &quot;Fifteen hours a month reinvested in follow-up calls&quot; is a far stronger result than &quot;fifteen hours saved.&quot;\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Watch quality, not just speed\u003c/h2>\n\u003cp>Speed can hide problems. Alongside time, track errors caught in review, corrections after sending and customer complaints. If errors rise, slow down and improve the prompt, the examples or the SOP before scaling.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Step 3: Iterate with a 30-day review\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Result\u003c/th>\n\u003cth>What to do\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Clear win\u003c/td>\n\u003ctd>Standardize it: SOP, prompt library, train everyone, then consider automating\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Promising but inconsistent\u003c/td>\n\u003ctd>Improve prompts, examples and inputs, then re-measure in two weeks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Little or no gain\u003c/td>\n\u003ctd>Check whether the real bottleneck is somewhere else; if so, refocus or stop\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quality problems\u003c/td>\n\u003ctd>Tighten review, narrow the scope, or stop\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Stopping a project that isn&#39;t working is a success of the process, not a failure. It frees time for the next opportunity on your list.\u003c/p>\n\u003cpre>\u003ccode>Here&#39;s the before-and-after data for an AI pilot in my business:\n&quot;&quot;&quot;\n[PASTE METRICS AND NOTES]\n&quot;&quot;&quot;\n1. Calculate hours saved, monthly value and payback period, using a loaded hourly cost of [$X], tool costs of [$Y] per month and [Z] setup hours.\n2. Show each step of the calculation so I can check it.\n3. Point out anything that could make this result misleading, such as a small sample, seasonality or a learning curve.\n4. Recommend whether to standardize, improve or stop, and explain why.\n\u003c/code>\u003c/pre>\n\u003cp>Check the arithmetic yourself, using the verification habits from Module 5.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>A one-table AI scorecard\u003c/h2>\n\u003cp>Review this monthly with your team:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Project\u003c/th>\n\u003cth>Owner\u003c/th>\n\u003cth>Metric\u003c/th>\n\u003cth>Baseline\u003c/th>\n\u003cth>Now\u003c/th>\n\u003cth>Net monthly value\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Quote drafting\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>Minutes per quote\u003c/td>\n\u003ctd>75\u003c/td>\n\u003ctd>30\u003c/td>\n\u003ctd>$615\u003c/td>\n\u003ctd>Standardize\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Build the calculator for your three pilot projects and fill in the baselines. If you haven&#39;t measured them yet, do it this week, before the new process starts. Then confirm the 30-day review in your calendar.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Baseline, measure and iterate; without a baseline you can&#39;t prove anything.\u003c/li>\n\u003cli>Include review time, use loaded hourly cost and be careful attributing revenue.\u003c/li>\n\u003cli>Decide where saved time will be reinvested, and track quality alongside speed.\u003c/li>\n\u003cli>Standardize the winners, fix the promising ones and stop the rest without regret.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"\"We use AI and it feels faster\" isn't ROI. Measuring tells you where to invest more, what to fix or stop, and whether your tool spend is justified. It doesn't require complicated analytics. It requires a baseline, a consistent way to measure and a regular review. The three-step loop Baseline: measure the current process before you change it. Measure: after the change, measure the same way over a similar period. Iterate: improve, scale or stop, based on what you find. Step 1: Set the baseline For each pilot, choose one to three metrics that match its payoff: Payoff Example metrics Time Minutes per task, hours per week on the workflow Quality Edits needed, errors, rework, complaints, review scores Speed Time to first reply, turnaround time Revenue Follow-up completion rate, quote-to-win rate, repeat purchases Keep measurement simple. Time five to ten instances of the task with a stopwatch or time tracker. Pull response times from your inbox or CRM. Count volumes for two weeks. Rough but consistent beats precise but never done. Step 2: Build the ROI calculator Set this up in any spreadsheet. The example numbers are hypothetical, for a business that writes 20 quotes a month. Line How to calculate Example A. Tasks per month Count 20 B. Minutes per task before Measured baseline 75 C. Minutes per task after, including review Measured 30 D. Hours saved per month A × (B − C) ÷ 60 15 E. Loaded hourly cost Pay plus taxes, benefits and overhead $45 F. Monthly value of time saved D × E $675 G. Monthly tool costs Subscriptions used for this workflow $60 H. One-off setup cost Setup hours × hourly cost 10 × $45 = $450 I. Net monthly benefit F − G $615 J. Payback period H ÷ I About 0.7 months Three things people often get wrong: Leaving review time out of line C. Measure the whole new process, not just how fast the AI generates a draft. Using hourly pay instead of loaded cost. Include taxes, benefits and overhead. For the owner's time, use what an hour is worth on revenue-generating work. Claiming every revenue change. If you measure a revenue payoff, like a higher quote-to-win rate, compare like with like and consider other explanations: seasonality, price changes or a new marketing push. Count it when the comparison is reasonable, and say how confident you are. Time saved only counts if you use it Saved hours easily disappear into other busywork. Decide in advance where they'll go, such as more sales calls, faster delivery, better service or simply fewer late nights, and track it. \"Fifteen hours a month reinvested in follow-up calls\" is a far stronger result than \"fifteen hours saved.\" Watch quality, not just speed Speed can hide problems. Alongside time, track errors caught in review, corrections after sending and customer complaints. If errors rise, slow down and improve the prompt, the examples or the SOP before scaling. Step 3: Iterate with a 30-day review Result What to do Clear win Standardize it: SOP, prompt library, train everyone, then consider automating Promising but inconsistent Improve prompts, examples and inputs, then re-measure in two weeks Little or no gain Check whether the real bottleneck is somewhere else; if so, refocus or stop Quality problems Tighten review, narrow the scope, or stop Stopping a project that isn't working is a success of the process, not a failure. It frees time for the next opportunity on your list. Here's the before-and-after data for an AI pilot in my business: \"\"\" [PASTE METRICS AND NOTES] \"\"\" 1. Calculate hours saved, monthly value and payback period, using a loaded hourly cost of [$X], tool costs of [$Y] per month and [Z] setup hours. 2. Show each step of the calculation so I can check it. 3. Point out anything that could make this result misleading, such as a small sample, seasonality or a learning curve. 4. Recommend whether to standardize, improve or stop, and explain why. Check the arithmetic yourself, using the verification habits from Module 5. A one-table AI scorecard Review this monthly with your team: Project Owner Metric Baseline Now Net monthly value Decision Quote drafting Minutes per quote 75 30 $615 Standardize Do this now Build the calculator for your three pilot projects and fill in the baselines. If you haven't measured them yet, do it this week, before the new process starts. Then confirm the 30-day review in your calendar. Key takeaways Baseline, measure and iterate; without a baseline you can't prove anything. Include review time, use loaded hourly cost and be careful attributing revenue. Decide where saved time will be reinvested, and track quality alongside speed. Standardize the winners, fix the promising ones and stop the rest without regret.","blocks":[{"lang":"","text":"Here's the before-and-after data for an AI pilot in my business:\n\"\"\"\n[PASTE METRICS AND NOTES]\n\"\"\"\n1. Calculate hours saved, monthly value and payback period, using a loaded hourly cost of [$X], tool costs of [$Y] per month and [Z] setup hours.\n2. Show each step of the calculation so I can check it.\n3. Point out anything that could make this result misleading, such as a small sample, seasonality or a learning curve.\n4. Recommend whether to standardize, improve or stop, and explain why."}],"quiz":[{"q":"In the lesson's ROI calculator, what should the \"minutes per task after\" figure include?","options":["Only the time the AI takes to generate the first draft","The average of the before and after times, for fairness","The whole new process, including time spent on review","The setup hours spread evenly across the month's tasks"],"answer":2,"explain":"The lesson lists leaving review time out of the \"after\" figure as a common mistake. You measure the whole new process, not just how fast the AI generates a draft."},{"q":"A garden center's quote-to-win rate rose after it started AI-drafted follow-ups, but that same month it cut prices and the spring season began. How should the owner treat the gain?","options":["Count the whole increase as AI ROI, since follow-ups began that month","Ignore revenue altogether and report only the hours the AI saved","Wait a full year before recording any result from the pilot at all","Compare like with like, weigh other explanations and state confidence"],"answer":3,"explain":"The lesson warns against claiming every revenue change. Compare like with like, consider explanations such as seasonality or price changes, count it when the comparison is reasonable, and say how confident you are."},{"q":"At the 30-day review, an auto repair shop's pilot of AI-drafted service reminders shows promising time savings but inconsistent results. What does the lesson's review table recommend?","options":["Standardize it now and train everyone, then fix problems as they appear","Improve the prompts, examples and inputs, then re-measure in two weeks","Stop it at once, since inconsistent results mean the pilot has failed","Automate it fully so that people can't introduce any inconsistency"],"answer":1,"explain":"For results that are promising but inconsistent, the lesson says to improve prompts, examples and inputs, then re-measure in two weeks. Standardizing is for clear wins."}],"videoUrl":null},{"n":20,"slug":"thirty-day-rollout","title":"Your 30-Day Rollout Plan (and When to Get Help)","summary":"Bring everything together in a week-by-week plan to launch your first AI projects, and learn how to tell when it's time to bring in an implementation partner.","durationMin":16,"module":6,"moduleTitle":"Rollout, Safety & ROI","html":"\u003csection class=\"sec sec-intro\">\u003cp>You now have every piece: an opportunity audit, prompts and a voice guide, workflows for marketing, sales, service and operations, a usage policy, a training plan and an ROI calculator. This final lesson puts them in order. The plan below is designed to run alongside normal work, at roughly three to five hours a week for whoever leads it.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Week 1: Foundations\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Finish your opportunity audit and confirm your first three projects (Lessons 2 to 4)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Measure the baseline for all three projects\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Choose and approve your tools; set up business accounts and data settings\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Publish version 1 of your AI usage policy (Lesson 17)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Write your business context pack and brand voice guide (Lessons 6 and 7)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Run training session 1 (Lesson 18)\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Milestone:\u003c/strong> everyone knows the rules and has used AI for at least one real task.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Week 2: The quick win goes live\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Build the prompts for your quick-win project and test them on ten real examples\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Write a one-page SOP: when to use it, the prompt, and the review rule\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Run training session 2 and launch the quick win\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Start the prompt library with your first five entries\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Begin preparing the core workflow: templates, scope blocks and reference documents\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Milestone:\u003c/strong> the quick win is part of someone&#39;s daily routine.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Week 3: The core workflow and growth bet launch\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Launch the core workflow, with full human review\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Launch the growth bet, such as your follow-up cadence, content engine or reactivation campaign\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Run training session 3, hands-on with the new workflows\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Champions collect issues daily, and prompts are fixed quickly\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Milestone:\u003c/strong> all three projects are running.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Week 4: Measure and decide\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Measure all three projects against their baselines (Lesson 19)\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Run training session 4: show and tell\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Decide for each project: standardize, improve or stop\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Update your SOPs, prompt library and policy with what you learned\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Choose the next two or three opportunities from your audit\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Milestone:\u003c/strong> a completed AI scorecard and a plan for the next 30 days.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Days 31 to 90: Scale what works\u003c/h2>\n\u003cul>\n\u003cli>Standardize the winners and make them the default way of working in your SOPs.\u003c/li>\n\u003cli>Once a workflow is stable and proven, consider connecting the steps with your CRM&#39;s automation features or a no-code tool.\u003c/li>\n\u003cli>Repeat the opportunity audit every quarter, because both your business and the tools keep changing.\u003c/li>\n\u003cli>Re-test your most-used prompts whenever your AI tools update.\u003c/li>\n\u003c/ul>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Why rollouts stall, and the fix\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Symptom\u003c/th>\n\u003cth>Fix\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>&quot;Nobody&#39;s using it.&quot;\u003c/td>\n\u003ctd>Tie AI to specific workflows, make it the default in SOPs, and lean on your champions\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;The results are inconsistent.&quot;\u003c/td>\n\u003ctd>Add better examples and reference documents; standardize the prompts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;We don&#39;t have time.&quot;\u003c/td>\n\u003ctd>Shrink the scope, protect two hours a week, and lead with the quick win\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Something went wrong.&quot;\u003c/td>\n\u003ctd>Review what happened without blame, then adjust the review rule or policy\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;We have too many tools.&quot;\u003c/td>\n\u003ctd>Pick one primary assistant; add tools only for proven needs\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>When to bring in an implementation partner\u003c/h2>\n\u003cp>Everything in this course can be done in-house, and many businesses go a long way on their own. Outside help starts to make sense when:\u003c/p>\n\u003cul>\n\u003cli>Your workflows span several systems (website, CRM, inbox, calendar, accounting) and need reliable connections\u003c/li>\n\u003cli>You want a customer-facing assistant built on your knowledge base, with proper testing and escalation\u003c/li>\n\u003cli>You handle sensitive or regulated data and need the setup done right the first time\u003c/li>\n\u003cli>You&#39;ve proven the value but don&#39;t have the internal time to scale it\u003c/li>\n\u003cli>Team adoption has stalled and you need structured training and accountability\u003c/li>\n\u003c/ul>\n\u003cp>Whoever you consider, check that they:\u003c/p>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Start with your workflows and goals, not their favorite tool\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Give you a written plan with scope, timeline and price\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Build in human review, testing and fallbacks\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Train your team and document everything, so you&#39;re not dependent on them\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Explain clearly how your data is handled and which tools can see it\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Measure results against a baseline\u003c/li>\n\u003c/ul>\n\u003cp>If you&#39;d like a done-with-you option, Principe AI&#39;s \u003ca href=\"https://principeai.com/consulting\">AI implementation service\u003c/a> follows the same approach you&#39;ve learned here: discovery, a written blueprint, build, training and ongoing support. Whether you work with us, with another partner or entirely on your own, the framework stays the same.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-default\">\u003ch2>Your final prompt\u003c/h2>\n\u003cpre>\u003ccode>I&#39;ve just completed an AI implementation course. Here&#39;s my situation:\n- Business: [TYPE AND SIZE]\n- My first three AI projects: [PASTE YOUR PROJECT BRIEFS]\n- Tools we use: [LIST]\n- Hours per week I can commit: [NUMBER]\n\nTurn the 30-day rollout plan below into a personalized week-by-week checklist, with owners and dates starting [START DATE]. Flag any week that looks overloaded and suggest what to move.\n\nPLAN:\n&quot;&quot;&quot;\n[PASTE THE WEEK-BY-WEEK PLAN FROM THIS LESSON]\n&quot;&quot;&quot;\n\u003c/code>\u003c/pre>\n\u003c/section>\n\u003csection class=\"sec sec-exercise\">\u003ch2>Do this now\u003c/h2>\n\u003cp>Put real dates on the plan, block two to three hours in your calendar this week, and tell your team when training session 1 will happen. The best time to start was before you took this course. The second-best time is this week.\u003c/p>\n\u003c/section>\n\u003csection class=\"sec sec-takeaways\">\u003ch2>Key takeaways\u003c/h2>\n\u003cul>\n\u003cli>Sequence matters: foundations first, then a quick win, then the core workflow and growth bet, then measurement.\u003c/li>\n\u003cli>Every week has a clear milestone, so you always know whether you&#39;re on track.\u003c/li>\n\u003cli>Most stalls have simple fixes: tie AI to real workflows, standardize prompts, protect time.\u003c/li>\n\u003cli>Bring in a partner when complexity, risk or capacity outgrows what you can do in-house, and choose one that leaves you more capable, not more dependent.\u003c/li>\n\u003c/ul>\n\u003c/section>","text":"You now have every piece: an opportunity audit, prompts and a voice guide, workflows for marketing, sales, service and operations, a usage policy, a training plan and an ROI calculator. This final lesson puts them in order. The plan below is designed to run alongside normal work, at roughly three to five hours a week for whoever leads it. Week 1: Foundations Finish your opportunity audit and confirm your first three projects (Lessons 2 to 4) Measure the baseline for all three projects Choose and approve your tools; set up business accounts and data settings Publish version 1 of your AI usage policy (Lesson 17) Write your business context pack and brand voice guide (Lessons 6 and 7) Run training session 1 (Lesson 18) Milestone: everyone knows the rules and has used AI for at least one real task. Week 2: The quick win goes live Build the prompts for your quick-win project and test them on ten real examples Write a one-page SOP: when to use it, the prompt, and the review rule Run training session 2 and launch the quick win Start the prompt library with your first five entries Begin preparing the core workflow: templates, scope blocks and reference documents Milestone: the quick win is part of someone's daily routine. Week 3: The core workflow and growth bet launch Launch the core workflow, with full human review Launch the growth bet, such as your follow-up cadence, content engine or reactivation campaign Run training session 3, hands-on with the new workflows Champions collect issues daily, and prompts are fixed quickly Milestone: all three projects are running. Week 4: Measure and decide Measure all three projects against their baselines (Lesson 19) Run training session 4: show and tell Decide for each project: standardize, improve or stop Update your SOPs, prompt library and policy with what you learned Choose the next two or three opportunities from your audit Milestone: a completed AI scorecard and a plan for the next 30 days. Days 31 to 90: Scale what works Standardize the winners and make them the default way of working in your SOPs. Once a workflow is stable and proven, consider connecting the steps with your CRM's automation features or a no-code tool. Repeat the opportunity audit every quarter, because both your business and the tools keep changing. Re-test your most-used prompts whenever your AI tools update. Why rollouts stall, and the fix Symptom Fix \"Nobody's using it.\" Tie AI to specific workflows, make it the default in SOPs, and lean on your champions \"The results are inconsistent.\" Add better examples and reference documents; standardize the prompts \"We don't have time.\" Shrink the scope, protect two hours a week, and lead with the quick win \"Something went wrong.\" Review what happened without blame, then adjust the review rule or policy \"We have too many tools.\" Pick one primary assistant; add tools only for proven needs When to bring in an implementation partner Everything in this course can be done in-house, and many businesses go a long way on their own. Outside help starts to make sense when: Your workflows span several systems (website, CRM, inbox, calendar, accounting) and need reliable connections You want a customer-facing assistant built on your knowledge base, with proper testing and escalation You handle sensitive or regulated data and need the setup done right the first time You've proven the value but don't have the internal time to scale it Team adoption has stalled and you need structured training and accountability Whoever you consider, check that they: Start with your workflows and goals, not their favorite tool Give you a written plan with scope, timeline and price Build in human review, testing and fallbacks Train your team and document everything, so you're not dependent on them Explain clearly how your data is handled and which tools can see it Measure results against a baseline If you'd like a done-with-you option, Principe AI's AI implementation service follows the same approach you've learned here: discovery, a written blueprint, build, training and ongoing support. Whether you work with us, with another partner or entirely on your own, the framework stays the same. Your final prompt I've just completed an AI implementation course. Here's my situation: - Business: [TYPE AND SIZE] - My first three AI projects: [PASTE YOUR PROJECT BRIEFS] - Tools we use: [LIST] - Hours per week I can commit: [NUMBER] Turn the 30-day rollout plan below into a personalized week-by-week checklist, with owners and dates starting [START DATE]. Flag any week that looks overloaded and suggest what to move. PLAN: \"\"\" [PASTE THE WEEK-BY-WEEK PLAN FROM THIS LESSON] \"\"\" Do this now Put real dates on the plan, block two to three hours in your calendar this week, and tell your team when training session 1 will happen. The best time to start was before you took this course. The second-best time is this week. Key takeaways Sequence matters: foundations first, then a quick win, then the core workflow and growth bet, then measurement. Every week has a clear milestone, so you always know whether you're on track. Most stalls have simple fixes: tie AI to real workflows, standardize prompts, protect time. Bring in a partner when complexity, risk or capacity outgrows what you can do in-house, and choose one that leaves you more capable, not more dependent.","blocks":[{"lang":"","text":"I've just completed an AI implementation course. Here's my situation:\n- Business: [TYPE AND SIZE]\n- My first three AI projects: [PASTE YOUR PROJECT BRIEFS]\n- Tools we use: [LIST]\n- Hours per week I can commit: [NUMBER]\n\nTurn the 30-day rollout plan below into a personalized week-by-week checklist, with owners and dates starting [START DATE]. Flag any week that looks overloaded and suggest what to move.\n\nPLAN:\n\"\"\"\n[PASTE THE WEEK-BY-WEEK PLAN FROM THIS LESSON]\n\"\"\""}],"quiz":[{"q":"What order does the 30-day rollout plan follow?","options":["Foundations, quick win, core workflow and growth bet, then measurement","Core workflow, quick win, then foundations once early results show up","All three projects in week one, then foundations and training after","Growth bet first, then measurement, then the quick win and foundations"],"answer":0,"explain":"The lesson says sequence matters: foundations first, then a quick win, then the core workflow and growth bet, then measurement in week four. Each week ends with a milestone so you know whether you're on track."},{"q":"Three weeks into the rollout at a property management firm, the owner keeps hearing, \"Nobody's using it.\" Which fix does the lesson recommend?","options":["Add two more AI tools so people can choose the one they like best","Pause the rollout until a newer and better AI model is released","Bring in an implementation partner right away to take over the project","Tie AI to specific workflows, make it the SOP default and use champions"],"answer":3,"explain":"The lesson's fix for \"Nobody's using it\" is to tie AI to specific workflows, make it the default in your SOPs and lean on your champions. Adding tools runs against its advice to pick one primary assistant."},{"q":"A 25-person HVAC company has proven its AI quote workflow. It now wants the workflow connected across its website, CRM, inbox, calendar and accounting, but nobody inside has the time. What does the lesson suggest?","options":["Keep everything manual, since outside help rarely suits a small firm","Let each employee connect the systems with whichever tool they prefer","Consider a partner who starts with your workflows and trains your team","Choose the partner with the most impressive tool and let them run it"],"answer":2,"explain":"The lesson says outside help makes sense when workflows span several systems or you've proven the value but lack time to scale. Its checklist favors a partner who starts with your workflows, not their favorite tool, and trains your team so you're not dependent on them."}],"videoUrl":null}],"totalMin":299,"siteUrl":"https://principeai.com","contactEmail":"principeconsults@gmail.com","licensee":null,"welcomeVideoUrl":null,"builtAt":"2026-10-20T16:43:03.611Z"}</script>

  /* ── State ─────────────────────────────────────────── */
  function loadState() {

    }
    return {};
  }
  const state = Object.assign({ done: {}, checks: {}, notes: {}, quiz: {}, last: null, name: "", theme: "system", completedAt: null }, loadState());
  function save() {

    }

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const doneCount = () => LESSONS.filter((l) => state.done[l.slug]).length;

  function fmtDuration(min) {

  }
  function splitTitle(t) {
    const i = t.indexOf(":");
    return i < 0 ? esc(t) : esc(t.slice(0, i + 1)) + " <em>" + esc(t.slice(i + 1).trim()) + "</em>";
  }
  function nextUp() {
    const last = state.last && BY_SLUG.get(state.last);
    if (last && !state.done[last.slug]) return last;

    "</aside>" +

    '<div class="view" id="view"></div>' +

    '<div class="toast" id="toast" role="status" aria-live="polite"></div>';

  const $ = (sel, root) => (root || document).querySelector(sel);

  const app = $("#app");

  /* Theme */
  const dark = window.matchMedia("(prefers-color-scheme: dark)");
  function applyTheme() {
    const mode = state.theme === "system" ? (dark.matches ? "dark" : "light") : state.theme;

  }
  if (dark.addEventListener) dark.addEventListener("change", applyTheme);

  applyTheme();

  $("#reset-btn").addEventListener("click", () => {
    if (!window.confirm("Reset your progress, quiz answers, checklists and notes for this course on this device?")) return;
    Object.assign(state, { done: {}, checks: {}, notes: {}, quiz: {}, last: null, completedAt: null });
    save();
    location.hash = "#/";

  /* Mobile drawer */
  function setNav(open) {

  /* Search box */
  const q = $("#q");
  let searchTimer;
  function goSearch(value, push) {
    const target = value.trim() ? "#/search/" + encodeURIComponent(value.trim()) : "#/";

      render();

  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if (e.key === "Escape") setNav(false);
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") {
      e.preventDefault();
      setNav(true);
      q.focus();

    const lesson = currentLesson();
    if (lesson && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const target = LESSONS[lesson.n - 1 + (e.key === "ArrowRight" ? 1 : -1)];
      if (target) location.hash = lessonHref(target);

  /* ── Router ────────────────────────────────────────── */
  function parseRoute() {
    const parts = location.hash.replace(/^#\/?/, "").split("/");
    return { name: parts[0] || "home", arg: decodeURIComponent(parts.slice(1).join("/")) };
  }
  function currentLesson() {
    const r = parseRoute();
    return r.name === "lesson" ? BY_SLUG.get(r.arg) : null;
  }
  function render() {
    const r = parseRoute();
    view.className = "view";
    if (r.name === "lesson" && BY_SLUG.has(r.arg)) renderLesson(BY_SLUG.get(r.arg));
    else if (r.name === "prompts") renderPrompts(r.arg);
    else if (r.name === "search") renderSearch(r.arg);
    else if (r.name === "notes") renderNotes();
    else if (r.name === "certificate") renderCertificate();
    else renderHome();
    if (r.name !== "search" && document.activeElement !== q) q.value = "";
    updateSide(r);
    setNav(false);
    window.scrollTo(0, 0);
    const h1 = $("h1", view);
    if (h1 && r.name !== "search") {
      h1.setAttribute("tabindex", "-1");
      h1.focus({ preventScroll: true });
    }
  }
  window.addEventListener("hashchange", render);

  function updateSide(r) {
    const done = doneCount();
    $("#side-progress").textContent = done + " of " + LESSONS.length + " lessons complete";
    $("#side-bar").style.width = pct() + "%";
    $("#top-pct").textContent = pct() + "%";
    $$(".nav a").forEach((a) => a.toggleAttribute("aria-current", a.dataset.nav === r.name || (r.name === "home" && a.dataset.nav === "home")));
    $$(".nav a[aria-current]").forEach((a) => a.setAttribute("aria-current", "page"));
    $$(".lessons a").forEach((a) => {
      const active = r.name === "lesson" && a.dataset.lesson === r.arg;
      a.toggleAttribute("aria-current", active);
      if (active) a.setAttribute("aria-current", "page");
      a.parentElement.classList.toggle("done", !!state.done[a.dataset.lesson]);
    });

      const n = m.lessons.filter((s) => state.done[s]).length;
      $('[data-mod="' + m.n + '"]').textContent = n + "/" + m.lessons.length;
    });

    if (active && window.innerWidth > 960) active.scrollIntoView({ block: "nearest" });
  }

  /* ── Home ──────────────────────────────────────────── */
  function renderHome() {
    document.title = DATA.title + " · Principe AI";
    const done = doneCount();
    const next = nextUp();
    const started = done > 0 || !!state.last;
    const cta = next || LESSONS[0];
    const ctaLabel = !started ? "Start the course" : next ? "Continue: Lesson " + next.n : "Review the course";
    view.innerHTML =
      '<section class="hero">' +

      '<span class="chip">' + ICON.clock + fmtDuration(DATA.totalMin) + "</span>" +
      '<span class="chip">' + ICON.wifi + "Works offline</span></div>" +
      '<div class="hero-cta"><a class="btn primary" href="' + lessonHref(cta) + '">' + ctaLabel + ICON.right + "</a>" +
      '<a class="btn secondary" href="#/prompts">' + ICON.sparkles + "Browse " + TOTAL_PROMPTS + " prompts</a></div>" +
      (started
        ? '<div class="hero-progress"><div>' + done + " of " + LESSONS.length + " lessons complete · " + pct() + '%</div><div class="bar"><span style="width:' + pct() + '%"></span></div></div>'
        : "") +
      "</section>" +
      (DATA.welcomeVideoUrl
        ? '<a class="video" href="' + esc(DATA.welcomeVideoUrl) + '" target="_blank" rel="noopener"><span class="play">' + ICON.play + "</span><span><strong>Watch the welcome video</strong><span>Opens in your browser · needs an internet connection</span></span></a>"
        : "") +
      '<section class="section"><h2>What you\'ll be able to do</h2><p class="sub">By the end of this course you\'ll be able to:</p><div class="grid2">' +

      "</div></section>" +
      '<section class="section"><h2>How this course works</h2><p class="sub">Short lessons, real practice, and a clear finish line.</p><div class="steps">' +
      step("Learn the idea", "Read each short lesson" + (LESSONS.some((l) => l.videoUrl) ? " and watch its video" : "") + ". Every one ends with the key takeaways.") +
      step("Try it with AI", "Copy the ready-made prompts into Claude, ChatGPT, Gemini or Copilot and adapt them to you.") +

      DATA.modules
        .map((m) => {

          return (

            fmtDuration(ls.reduce((s, l) => s + l.durationMin, 0)) + '</div></div><span class="mini">' + n + "/" + ls.length + " done</span></header><ul class=\"rows\">" +
            ls
              .map(
                (l) =>
                  '<li><a href="' + lessonHref(l) + '"><span class="n">' + l.n + '</span><span class="nm">' + esc(l.title) + "</span>" +
                  (state.done[l.slug] ? '<span class="pill">Done</span>' : '<span class="du">' + l.durationMin + " min</span>") + "</a></li>",
              )

        .join("") +
      "</div></section>" +

      '<a class="btn secondary" href="' + esc(DATA.siteUrl) + '/book" target="_blank" rel="noopener">Book a free strategy call</a></div></section>';
  }
  function step(title, text) {

  }

  /* ── Lesson ────────────────────────────────────────── */
  function renderLesson(l) {
    document.title = l.title + " · " + DATA.shortTitle;
    state.last = l.slug;
    save();
    const prev = LESSONS[l.n - 2];
    const next = LESSONS[l.n];
    const done = !!state.done[l.slug];
    view.innerHTML =
      '<article class="lesson">' +
      '<div class="crumbs"><a href="#/">' + esc(DATA.shortTitle) + '</a><span class="dot">/</span><span>Module ' + l.module + " · " + esc(l.moduleTitle) + "</span></div>" +
      '<p class="kicker">Lesson ' + l.n + " of " + LESSONS.length + "</p>" +
      '<h1 class="display">' + esc(l.title) + "</h1>" +
      '<p class="lead">' + esc(l.summary) + "</p>" +
      '<div class="lesson-meta"><span class="chip">' + ICON.clock + l.durationMin + " min read</span>" +
      (l.blocks.length ? '<span class="chip">' + ICON.sparkles + l.blocks.length + " ready-to-copy " + (l.blocks.length === 1 ? "block" : "blocks") + "</span>" : "") +
      (done ? '<span class="pill">Completed</span>' : "") + "</div>" +
      (l.videoUrl
        ? '<a class="video" href="' + esc(l.videoUrl) + '" target="_blank" rel="noopener"><span class="play">' + ICON.play + "</span><span><strong>Watch the lesson video</strong><span>Opens in your browser · needs an internet connection</span></span></a>"
        : "") +
      '<div class="prose" id="lesson-body">' + l.html + "</div>" +
      quizHtml(l) +
      '<div class="notes"><label for="note">Your notes <span id="note-status">Saved on this device</span></label>' +
      '<textarea id="note" placeholder="Ideas, prompts that worked for you, things to try next…">' + esc(state.notes[l.slug] || "") + "</textarea></div>" +
      '<nav class="pager" aria-label="Lesson navigation"><div>' +
      (prev ? '<a class="btn ghost prev" href="' + lessonHref(prev) + '">' + ICON.left + "Previous</a>" : "") +

      '<button type="button" class="btn ' + (done ? "done" : "secondary") + '" data-toggle>' + (done ? ICON.check + "Completed" : "Mark complete") + "</button>" +
      (next
        ? '<button type="button" class="btn primary" data-next>' + (done ? "Next lesson" : "Complete & continue") + ICON.right + "</button>"
        : '<button type="button" class="btn primary" data-finish>' + (done ? "Get your certificate" : "Finish the course") + ICON.right + "</button>") +
      "</div></nav></article>";

    enhance($("#lesson-body"), l);
    const quiz = $(".quiz", view);
    if (quiz) {
      paintQuiz(quiz, l);
      quiz.addEventListener("click", (e) => {
        const opt = e.target.closest(".opt");

          const qi = +opt.closest(".q").dataset.q;

          save();
          paintQuiz(quiz, l);

          delete state.quiz[l.slug];
          save();
          paintQuiz(quiz, l);

        $("#note-status").textContent = "Saved on this device";

    });

    $("[data-toggle]", view).addEventListener("click", () => {
      setDone(l, !state.done[l.slug]);

        if (!state.done[l.slug]) setDone(l, true);
        location.hash = "#/certificate";
      });
  }
  function renderLessonState(l) {

  function setDone(l, value) {
    if (value) state.done[l.slug] = 1;
    else delete state.done[l.slug];
    if (doneCount() === LESSONS.length && !state.completedAt) state.completedAt = new Date().toISOString();
    save();
    if (value) toast("Lesson " + l.n + " complete · " + doneCount() + " of " + LESSONS.length + " done");
  }

  function blockHtml(text, lang) {
    return (
      '<div class="block"><div class="block-head">' + ICON.sparkles + "<span>" + (LANGS[lang] || "Ready to copy") + "</span>" +
      '<button type="button" class="copy" aria-label="Copy to clipboard">' + ICON.copy + "<span>Copy</span></button></div><pre><code>" + esc(text) + "</code></pre></div>"
    );
  }
  function enhance(root, l) {
    $$("pre", root).forEach((pre) => {
      const code = pre.querySelector("code");
      const lang = ((code && code.className.match(/language-(\w+)/)) || [])[1];
      const wrap = document.createElement("div");
      wrap.innerHTML = blockHtml("", lang);
      const block = wrap.firstChild;
      const placeholder = block.querySelector("pre");
      pre.replaceWith(block);
      placeholder.replaceWith(pre);
    });
    $$("table", root).forEach((t) => {
      const w = document.createElement("div");
      w.className = "table-wrap";
      t.replaceWith(w);
      w.appendChild(t);
    });
    $$('a[href^="http"]', root).forEach((a) => {
      a.target = "_blank";
      a.rel = "noopener";
    });
    $$(".sec-exercise", root).forEach((sec, si) => {
      $$(":scope > ol > li, :scope > ul > li", sec).forEach((li, i) => {
        const key = l.slug + ":" + si + ":" + i;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.className = "cbx";
        cb.setAttribute("aria-label", "Mark step " + (i + 1) + " done");
        cb.checked = !!state.checks[key];
        li.classList.add("chk");
        li.classList.toggle("is-done", cb.checked);
        cb.addEventListener("change", () => {
          if (cb.checked) state.checks[key] = 1;
          else delete state.checks[key];
          li.classList.toggle("is-done", cb.checked);
          save();
        });
        li.prepend(cb);
      });
    });
  }
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".copy");
    if (!btn) return;
    copyText(btn.closest(".block").querySelector("pre").textContent, btn);
  });
  function copyText(text, btn) {
    const ok = () => {
      btn.classList.add("ok");
      btn.querySelector("span").textContent = "Copied";
      setTimeout(() => {
        btn.classList.remove("ok");
        btn.querySelector("span").textContent = "Copy";
      }, 1600);
    };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch {
        copied = false;
      }
      ta.remove();
      if (copied) ok();
      else toast("Couldn't copy automatically. Select the text and copy it.");
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  function quizHtml(l) {
    if (!l.quiz.length) return "";
    return (
      '<section class="quiz" aria-labelledby="quiz-h"><div class="quiz-head"><p class="kicker">Knowledge check</p><h2 id="quiz-h">Check your understanding</h2>' +

          (x, qi) =>
            '<li class="q" data-q="' + qi + '"><p class="q-text">' + esc(x.q) + '</p><div class="opts" role="group" aria-label="Answers to question ' + (qi + 1) + '">' +
            x.options.map((o, oi) => '<button type="button" class="opt" data-o="' + oi + '"><span class="k">' + "ABCD"[oi] + "</span><span>" + esc(o) + "</span></button>").join("") +
            '</div><p class="explain" hidden></p></li>',
        )
        .join("") +
      '</ol><div class="quiz-foot"><span class="score" aria-live="polite"></span><button type="button" class="btn ghost" data-retake hidden>' + ICON.reset + "Retake</button></div></section>"
    );
  }
  function paintQuiz(el, l) {
    const answers = state.quiz[l.slug] || {};
    let right = 0;
    let answered = 0;
    $$(".q", el).forEach((qEl) => {
      const qi = +qEl.dataset.q;
      const x = l.quiz[qi];
      const chosen = answers[qi];
      const has = chosen !== undefined;
      $$(".opt", qEl).forEach((b) => {
        const oi = +b.dataset.o;
        b.disabled = has;
        b.classList.toggle("right", has && oi === x.answer);
        b.classList.toggle("wrong", has && oi === chosen && chosen !== x.answer);
        b.classList.toggle("dim", has && oi !== x.answer && oi !== chosen);
        b.setAttribute("aria-pressed", String(has && oi === chosen));
      });
      const ex = $(".explain", qEl);
      ex.hidden = !has;
      if (has) {
        answered++;
        const correct = chosen === x.answer;
        if (correct) right++;
        ex.className = "explain" + (correct ? "" : " no");
        ex.innerHTML = "<b>" + (correct ? "Correct." : "Not quite.") + "</b> " + esc(x.explain);
      }
    });
    const total = l.quiz.length;
    const score = $(".score", el);
    score.className = "score" + (answered === total && right === total ? " perfect" : "");
    score.textContent = answered === total ? "You got " + right + " of " + total + (right === total ? ". Perfect!" : ". Review the explanations, then retake it.") : answered + " of " + total + " answered";
    $("[data-retake]", el).hidden = answered === 0;
  }

  /* ── Prompt library ────────────────────────────────── */
  function renderPrompts(initial) {
    document.title = "Prompt library · " + DATA.shortTitle;
    view.className = "view wide";
    view.innerHTML =
      '<div class="page-head"><p class="kicker">Your toolkit</p><h1 class="display">Prompt library</h1>' +
      '<p class="lead">Every prompt, template and example from the course in one place: ' + TOTAL_PROMPTS +
      " in total. Copy one into your AI assistant and fill in the details in brackets.</p></div>" +
      '<label class="sr-only" for="lib-filter">Filter the prompt library</label><input class="filter" id="lib-filter" type="search" placeholder="Filter by keyword, e.g. email, meal, policy…" value="' + esc(initial || "") + '">' +
      '<div id="lib"></div>';
    const input = $("#lib-filter");
    const paint = () => {
      const terms = input.value.toLowerCase().split(/\s+/).filter(Boolean);
      const match = (s) => terms.every((t) => s.toLowerCase().includes(t));
      let shown = 0;
      const html = LESSONS.map((l) => {
        const blocks = l.blocks.filter((b) => match(b.text + " " + l.title));
        shown += blocks.length;
        if (!blocks.length) return "";
        return (
          '<div class="group"><h2><a href="' + lessonHref(l) + '">Lesson ' + l.n + ": " + esc(l.title) + '</a></h2><div class="faint">Module ' + l.module + " · " + esc(l.moduleTitle) + "</div>" +
          blocks.map((b) => blockHtml(b.text, b.lang)).join("") + "</div>"
        );
      }).join("");
      $("#lib").innerHTML = shown ? html : '<div class="empty">No prompts match “' + esc(input.value) + "”. Try a different word.</div>";
    };
    input.addEventListener("input", paint);
    paint();
  }

  /* ── Search ────────────────────────────────────────── */
  function renderSearch(query) {
    document.title = "Search · " + DATA.shortTitle;
    if (document.activeElement !== q) q.value = query;
    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = LESSONS.map((l) => {
      const hay = (l.title + " " + l.summary + " " + l.text).toLowerCase();
      if (!terms.length || !terms.every((t) => hay.includes(t))) return null;
      const score = terms.reduce((s, t) => s + (l.title.toLowerCase().includes(t) ? 10 : 0) + hay.split(t).length - 1, 0);
      return { l, score };
    })
      .filter(Boolean)
      .sort((a, b) => b.score - a.score);
    const promptHits = LESSONS.reduce((n, l) => n + l.blocks.filter((b) => terms.length && terms.every((t) => b.text.toLowerCase().includes(t))).length, 0);
    view.innerHTML =
      '<div class="page-head"><p class="kicker">Search</p><h1 class="display">' + (terms.length ? "Results for “" + esc(query) + "”" : "Search the course") + "</h1>" +
      '<p class="lead">' + hits.length + (hits.length === 1 ? " lesson" : " lessons") + " found" +
      (promptHits ? ' · <a href="#/prompts/' + encodeURIComponent(query) + '">' + promptHits + (promptHits === 1 ? " matching prompt" : " matching prompts") + " in the library</a>" : "") + "</p></div>" +
      (hits.length
        ? hits.map((h) => '<a class="card result" href="' + lessonHref(h.l) + '"><div class="t">Lesson ' + h.l.n + ": " + highlight(esc(h.l.title), terms) + '</div><div class="s">' + snippet(h.l, terms) + "</div></a>").join("")
        : '<div class="empty">Nothing found. Try fewer or different words.</div>');
  }
  function highlight(html, terms) {
    if (!terms.length) return html;
    const re = new RegExp("(" + terms.map((t) => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    return html.replace(re, "<mark>$1</mark>");
  }
  function snippet(l, terms) {
    const text = l.text;
    const i = Math.max(0, text.toLowerCase().indexOf(terms[0]));
    const start = Math.max(0, i - 80);
    const piece = (start > 0 ? "…" : "") + text.slice(start, start + 220) + (start + 220 < text.length ? "…" : "");
    return highlight(esc(piece), terms);
  }

  /* ── Notes ─────────────────────────────────────────── */
  function renderNotes() {
    document.title = "My notes · " + DATA.shortTitle;
    const withNotes = LESSONS.filter((l) => state.notes[l.slug]);
    view.innerHTML =
      '<div class="page-head"><p class="kicker">Your workspace</p><h1 class="display">My notes</h1>' +
      '<p class="lead">Everything you\'ve written in the notes box at the end of each lesson. It\'s saved in this browser on this device.</p></div>' +
      (withNotes.length
        ? '<div class="actions"><button type="button" class="btn primary" id="export-notes">' + ICON.download + 'Download my notes</button><button type="button" class="btn secondary" id="copy-notes">' + ICON.copy + "Copy all</button></div>" +
          withNotes.map((l) => '<div class="card note-item"><a href="' + lessonHref(l) + '"><strong>Lesson ' + l.n + ": " + esc(l.title) + "</strong></a><p>" + esc(state.notes[l.slug]) + "</p></div>").join("")
        : '<div class="empty">No notes yet. Use the notes box at the end of any lesson and they\'ll collect here.</div>');
    const text = () =>
      "My notes: " + DATA.title + "\n\n" + withNotes.map((l) => "Lesson " + l.n + ": " + l.title + "\n" + "-".repeat(40) + "\n" + state.notes[l.slug].trim() + "\n").join("\n");
    const exp = $("#export-notes");
    if (exp) {
      exp.addEventListener("click", () => {
        const url = URL.createObjectURL(new Blob([text()], { type: "text/plain;charset=utf-8" }));
        const a = document.createElement("a");
        a.href = url;
        a.download = "My notes - " + DATA.shortTitle + ".txt";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      $("#copy-notes").addEventListener("click", (e) => {
        const btn = e.currentTarget;
        const done = () => toast("Notes copied");
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text()).then(done, () => toast("Couldn't copy. Use Download instead."));
        else toast("Couldn't copy. Use Download instead.");
        btn.blur();
      });
    }
  }

  /* ── Certificate ───────────────────────────────────── */
  function renderCertificate() {
    document.title = "Certificate · " + DATA.shortTitle;
    const done = doneCount();
    if (done < LESSONS.length) {
      const left = LESSONS.filter((l) => !state.done[l.slug]);
      view.innerHTML =
        '<div class="page-head"><p class="kicker">Certificate of completion</p><h1 class="display">Almost there</h1></div>' +
        '<div class="card locked"><div class="big">' + done + "/" + LESSONS.length + '</div><p class="muted">lessons complete. Mark every lesson complete to unlock your certificate.</p>' +
        '<div class="bar" style="max-width:420px;margin:16px auto 0;background:var(--border)"><span style="width:' + pct() + '%"></span></div>' +
        '<ul class="rows left-list">' +
        left.map((l) => '<li><a href="' + lessonHref(l) + '"><span class="n">' + l.n + '</span><span class="nm">' + esc(l.title) + '</span><span class="du">' + l.durationMin + " min</span></a></li>").join("") +
        "</ul></div>";
      return;
    }
    if (!state.completedAt) {
      state.completedAt = new Date().toISOString();
      save();
    }
    const name = state.name || DATA.licensee || "";
    const date = new Date(state.completedAt).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    view.className = "view wide";
    view.innerHTML =
      '<div class="cert-wrap"><div class="page-head" style="margin:0"><p class="kicker">You did it</p><h1 class="display">Your certificate</h1>' +
      '<p class="lead">You\'ve completed every lesson of ' + esc(DATA.shortTitle) + ". Add your name, then print it or save it as a PDF.</p></div>" +
      '<form class="cert-form" id="cert-form"><label>Name on the certificate<input id="cert-name" value="' + esc(name) + '" placeholder="Your full name" autocomplete="name" maxlength="60"></label>' +
      '<button type="submit" class="btn primary">' + ICON.print + "Print or save as PDF</button></form>" +
      '<div class="cert" id="cert"><div class="brand"><span class="brand-mark">' + ICON.mark + "</span><span>Principe <b>AI</b></span></div>" +
      '<div class="c-k">Certificate of completion</div><div class="c-name" id="cert-out"></div><div class="c-line"></div>' +
      '<div class="c-txt">has successfully completed all ' + LESSONS.length + " lessons of</div>" +
      '<div class="c-course">' + esc(DATA.title) + "</div>" +
      '<div class="c-txt">' + esc(DATA.level) + " level · " + DATA.modules.length + " modules · " + fmtDuration(DATA.totalMin) + " of lessons</div>" +
      '<div class="c-foot"><div><b>' + esc(date) + "</b>Date completed</div><div><b>Principe Consults</b>Issued by Principe AI</div></div></div></div>";
    const input = $("#cert-name");
    const paint = () => {
      $("#cert-out").textContent = input.value.trim() || "Your name";
    };
    input.addEventListener("input", () => {
      state.name = input.value.trim();
      save();
      paint();
    });
    paint();
    $("#cert-form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!input.value.trim()) {
        input.focus();
        toast("Add your name first");
        return;
      }
      const page = document.createElement("style");
      page.textContent = "@page { size: letter landscape; margin: 0; }";
      document.head.appendChild(page);
      document.body.classList.add("print-cert");
      const cleanup = () => {
        page.remove();
        document.body.classList.remove("print-cert");
        window.removeEventListener("afterprint", cleanup);
      };
      window.addEventListener("afterprint", cleanup);
      window.print();
    });
  }

  render();
})();

</script>
</body>
</html>
